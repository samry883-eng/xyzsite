<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nike â AI â XYZ Studios</title>
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pad: 48px;    /* side padding on video */
      --ctrl: 62px;   /* controls bar height   */
      --nav: 80px;    /* nav bar height        */
    }
    html, body { background: #000; color: #fff; font-family: Micross, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    /* ââ STAGE: exactly 100vh ââââââââââââââââââââââââââââââ */
    .pj-stage {
      position: relative;
      width: 100%; height: calc(100vh - 80px);
      background: #000;
      overflow: hidden;
    }

    /* ââ VIDEO: starts below nav, inset sides, above controls */
    #pj-video {
      position: absolute;
      top: var(--nav);
      left: var(--pad); right: var(--pad);
      bottom: var(--ctrl);
      width: calc(100% - var(--pad) * 2);
      height: calc(100% - var(--ctrl) - var(--nav));
      object-fit: contain;
      display: block;
      cursor: none;
      background: #000;
    }

    /* ââ CUSTOM VIDEO CURSOR ââââââââââââââââââââââââââââââââ */
    #pj-cursor {
      position: fixed;
      pointer-events: none;
      z-index: 300;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    #pj-cursor.visible { opacity: 1; }
    #pj-cursor svg { display: block; }

    /* ââ NAV: always pinned, never hides âââââââââââââââââââ */
    .pj-nav-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      pointer-events: none;
    }

    /* Dark gradient fade at top */
    .pj-fade {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 130px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Shared label */
    .lbl {
      font: 400 10px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    /* Nav row: logo left, back/close right */
    .pj-nav {
      position: relative;
      height: 80px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      pointer-events: all;
    }
    .pj-logo { display: block; line-height: 0; }
    .pj-logo img { height: 29px; width: auto; display: block; }

    /* BACK / CLOSE button â always right-aligned */
    #pj-back-btn {
      margin-left: auto;
      color: rgba(255,255,255,0.8);
      background: none; border: none; cursor: pointer; padding: 0;
      transition: color 0.2s;
    }
    #pj-back-btn:hover { color: #fff; }

    /* ââ CONTROLS BAR: fixed at stage bottom, always visible */
    .pj-ctrl-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: var(--ctrl);
      background: #000;
      padding: 0 var(--pad);
      display: flex; flex-direction: column; justify-content: center;
      gap: 14px;
    }

    /* Progress track */
    .pj-track {
      height: 1px;
      background: rgba(255,255,255,0.15);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    #pj-progress {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: rgba(255,255,255,0.88);
      pointer-events: none; width: 0%;
    }
    #pj-handle {
      position: absolute; top: 50%;
      transform: translate(-50%, -50%);
      width: 9px; height: 9px; border-radius: 50%;
      background: #fff; pointer-events: none; left: 0%;
      opacity: 0 !important; transition: opacity 0.15s;
    }
    
    /* Controls row */
    .pj-ctrl-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .pj-ctrl-l { display: flex; align-items: center; gap: 18px; }
    .pj-ctrl-m { display: flex; align-items: baseline; gap: 8px; justify-content: center; white-space: nowrap; }
    .pj-ctrl-r { display: flex; align-items: center; gap: 22px; justify-content: flex-end; }

    #pj-play-btn { color: rgba(255,255,255,0.55); background: none; border: none; cursor: pointer; padding: 0; min-width: 44px; text-align: left; transition: color 0.2s; }
    #pj-play-btn:hover { color: #fff; }
    #pj-time { color: rgba(255,255,255,0.3); font-variant-numeric: tabular-nums; }
    #pj-title-span { color: rgba(255,255,255,0.75); }
    #pj-sep-span { color: rgba(255,255,255,0.22); letter-spacing: 0; }
    #pj-client-span { color: rgba(255,255,255,0.38); }
    #pj-mute-btn, #pj-fs-btn {
      color: rgba(255,255,255,0.45); background: none; border: none; cursor: pointer; padding: 0;
      transition: color 0.2s;
      font: 400 10px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    #pj-mute-btn:hover, #pj-fs-btn:hover { color: #fff; }

    /* ââ FULLSCREEN: video fills entire screen ââââââââââââââ */
    .pj-stage.is-fullscreen #pj-video {
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .pj-stage.is-fullscreen .pj-ctrl-bar {
      background: transparent;
      border-top: none;
    }
    .pj-stage.is-fullscreen .pj-logo { display: none; }
    .pj-stage.is-fullscreen #pj-fs-btn { display: none; }
    .pj-stage.is-fullscreen .pj-nav-bar { position: absolute; }

    /* ââ CREDITS STAGGER ANIMATION âââââââââââââââââââââââââ */
    @keyframes pj-rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pj-credits.revealed .pj-cr-title { animation: pj-rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
    .pj-credits.revealed .pj-cr-sub   { animation: pj-rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
    .pj-credits.revealed .pj-cr-cols  { animation: pj-rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
    .pj-credits.revealed .pj-frames   { animation: pj-rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.35s both; }

    /* ââ CREDITS: tight, directly after stage âââââââââââââââ */
    .pj-credits {
      background: #000;
      padding: 48px 48px 0;
    }
    .pj-cr-title {
      font: 700 48px/1.04 Micross, Arial, sans-serif;
      color: #fff; letter-spacing: -0.02em;
      margin-bottom: 10px;
      -webkit-font-smoothing: antialiased;
    }
    .pj-cr-sub {
      font: 400 12px/1 Micross, Arial, sans-serif;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }

    /* FRAMES: 2 per row */
    .pj-frames { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 0; }
    .pj-frames:empty { display: none; margin: 0; }
    .pj-frames img { width: 100%; display: block; object-fit: cover; aspect-ratio: 16/9; }
    .pj-frames img.full { grid-column: 1 / -1; }

    /* Credits columns */
    .pj-cr-cols {
      display: grid; grid-template-columns: 1fr 1fr;
      margin-bottom: 40px;
    }
    .pj-cr-col-lbl { font: 400 8px/1 Micross, Arial, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.22); margin-bottom: 10px; -webkit-font-smoothing: antialiased; }
    .pj-cr-col-val { font: 400 13px/1.5 Micross, Arial, sans-serif; color: rgba(255,255,255,0.75); }

    /* ── SCROLL SNAP ───────────────────────────── */
    html { height: 100%; }
    body { overflow-y: scroll; scroll-behavior: smooth; }
    .pj-stage { } /* no snap */
    .pj-credits { }

    /* ── ENTRANCE ANIMATIONS ───────────────────── */
    @keyframes pj-fade-up { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pj-fade-dn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pj-fade-in { from { opacity:0; } to { opacity:1; } }
    body.pj-entering #pj-video    { animation: pj-fade-up 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s both; }
    body.pj-entering .pj-nav      { animation: pj-fade-dn 0.8s cubic-bezier(0.16,1,0.3,1) 0.08s both; }
    body.pj-entering .pj-ctrl-bar { animation: pj-fade-in 0.7s cubic-bezier(0.16,1,0.3,1) 0.42s both; }

  </style>
</head>
<body>

  <!-- Page transition overlay -->
  <div id="page-in" style="position:fixed;inset:0;z-index:9998;background:#fff;pointer-events:none;transform:translateY(0);"></div>



  <!-- STAGE: 100vh — video + controls all in one screen -->
  <div class="pj-stage" id="pj-stage">

    <!-- Video: inset sides, stops above controls bar -->
    <video id="pj-video" src="https://xgjzloifyvgpbmyonaya.supabase.co/storage/v1/object/public/files/Clp65xDTmS/original" playsinline preload="auto"></video>

    <!-- NAV: always visible, never fades -->
    <div class="pj-nav-bar">
      <div class="pj-fade"></div>
      <div class="pj-nav">
        <a href="/" class="pj-logo">
          <img src="https://cdn.prod.website-files.com/6917408c1d0fee8fc2c58505/691f47e2f734702aa3a0675f_xyz-logo.png" alt="XYZ Studios">
        </a>
        <button class="lbl" id="pj-back-btn">Back</button>
      </div>
    </div>

    <!-- Custom cursor -->
    <div id="pj-cursor">
      <svg id="pj-cursor-svg" width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path id="pj-cursor-path" d="M8 5v14l11-7z"/>
      </svg>
    </div>

    <!-- Controls bar: always visible at bottom -->
    <div class="pj-ctrl-bar">
      <div class="pj-track" id="pj-track">
        <div id="pj-progress"></div>
        <div id="pj-handle"></div>
      </div>
      <div class="pj-ctrl-row">
        <div class="pj-ctrl-l">
          <button class="lbl" id="pj-play-btn">Play</button>
          <span class="lbl" id="pj-time">0:00 &mdash; 0:00</span>
        </div>
        <div class="pj-ctrl-m">
          <span class="lbl" id="pj-title-span">AI</span>
          <span class="lbl" id="pj-sep-span">&mdash;</span>
          <span class="lbl" id="pj-client-span">Nike</span>
        </div>
        <div class="pj-ctrl-r">
          <button id="pj-mute-btn">Sound:On</button>
          <button id="pj-fs-btn">Full Screen</button>
        </div>
      </div>
    </div>

  </div>

  <!-- CREDITS: tight directly after stage -->
  <div class="pj-credits">

    <div class="pj-cr-title">AI</div>
    <div class="pj-cr-sub">Nike</div>

    <div class="pj-cr-cols">
      <div>
        <div class="pj-cr-col-lbl">Directed by</div>
        <div class="pj-cr-col-val">XYZ Studios</div>
      </div>
      <div>
        <div class="pj-cr-col-lbl">Production by</div>
        <div class="pj-cr-col-val">XYZ Studios</div>
      </div>
    </div>

    <!-- ââ FRAMES â add stills below âââââââââââââââââââââââ -->
    <!--
      <img src="frame.jpg" alt="">           half-width (default)
      <img src="frame.jpg" class="full">     full-width
    -->

    <div class="pj-frames">
        </div>
  </div>





<script>
  const stage   = document.getElementById('pj-stage');
  const vid     = document.getElementById('pj-video');
  const playBtn = document.getElementById('pj-play-btn');
  const timeEl  = document.getElementById('pj-time');
  const muteBtn = document.getElementById('pj-mute-btn');
  const fsBtn   = document.getElementById('pj-fs-btn');
  const backBtn = document.getElementById('pj-back-btn');
  const track   = document.getElementById('pj-track');
  const progress= document.getElementById('pj-progress');
  const handle  = document.getElementById('pj-handle');

  // Start paused
  vid.pause();

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  }
  function updatePlay() { playBtn.textContent = vid.paused ? 'Play' : 'Pause'; }
  function updateMute() { muteBtn.textContent = vid.muted ? 'Sound:Off' : 'Sound:On'; }

  let _raf = null;
  function _tick() {
    const cur = vid.currentTime, dur = vid.duration || 0;
    timeEl.textContent = fmt(cur) + " / " + fmt(dur);
    const pct = dur ? (cur / dur) * 100 : 0;
    progress.style.width = pct + "%";
    _raf = requestAnimationFrame(_tick);
  }
  function _startRaf() { if (!_raf) _raf = requestAnimationFrame(_tick); }
  function _stopRaf()  { if (_raf)  { cancelAnimationFrame(_raf); _raf = null; } }
  vid.addEventListener("play",  () => { updatePlay(); _startRaf(); });
  vid.addEventListener("pause", () => { updatePlay(); _stopRaf();  });
  vid.addEventListener("ended", () => { updatePlay(); _stopRaf();  });
  vid.addEventListener("loadedmetadata", () => {
    timeEl.textContent = fmt(0) + " / " + fmt(vid.duration);
  });

  // Custom cursor on video
  // Custom cursor
  const cursor     = document.getElementById('pj-cursor');
  const cursorPath = document.getElementById('pj-cursor-path');
  const PLAY_PATH  = 'M8 5v14l11-7z';
  const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  function updateCursorIcon() { cursorPath.setAttribute('d', vid.paused ? PLAY_PATH : PAUSE_PATH); }
  vid.addEventListener('mouseenter', () => cursor.classList.add('visible'));
  vid.addEventListener('mouseleave', () => cursor.classList.remove('visible'));
  vid.addEventListener('mousemove',  e  => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
  vid.addEventListener('play',  updateCursorIcon);
  vid.addEventListener('pause', updateCursorIcon);

  // Click to play/pause
  vid.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
  playBtn.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
  muteBtn.addEventListener('click', () => { vid.muted = !vid.muted; updateMute(); });

  // Fullscreen â enter only; CSS hides fsBtn when in fullscreen; Back btn becomes Close
  fsBtn.addEventListener('click', () => { stage.requestFullscreen && stage.requestFullscreen(); });
  document.addEventListener('fullscreenchange', () => {
    const fs = !!document.fullscreenElement;
    stage.classList.toggle('is-fullscreen', fs);
    backBtn.textContent = fs ? 'Close' : 'Back';
  });

  // Scrubber
  let scrubbing = false;
  function seekTo(e) {
    const r = track.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    if (isFinite(vid.duration)) vid.currentTime = pct * vid.duration;
  }
  track.addEventListener('mousedown', e => { scrubbing = true; seekTo(e); });
  document.addEventListener('mousemove', e => { if (scrubbing) seekTo(e); });
  document.addEventListener('mouseup',   () => { scrubbing = false; });

  // ââ SUBTLE TILT ON VIDEO âââââââââââââââââââââââââââââââââââââ
  (function() {
    const TILT_MAX = 3;
    const SPRING = "transform 1.2s cubic-bezier(0.34,1.56,0.64,1)";
    const EASE_IN = "transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)";
    let entering = false, enterTimer;
    vid.addEventListener("mouseenter", () => {
      if (document.fullscreenElement) return;
      entering = true;
      vid.style.transition = EASE_IN;
      clearTimeout(enterTimer);
      enterTimer = setTimeout(() => { entering = false; }, 500);
    });
    vid.addEventListener("mousemove", e => {
      if (document.fullscreenElement) return;
      const r  = vid.getBoundingClientRect();
      const tiltX = ((e.clientY - r.top  - r.height / 2) / (r.height / 2)) * -TILT_MAX;
      const tiltY = ((e.clientX - r.left - r.width  / 2) / (r.width  / 2)) *  TILT_MAX;
      if (!entering) vid.style.transition = "none";
      vid.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    });
    vid.addEventListener("mouseleave", () => {
      entering = false;
      clearTimeout(enterTimer);
      vid.style.transition = SPRING;
      vid.style.transform = "";
    });
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) { vid.style.transition = "none"; vid.style.transform = ""; }
    });
  })();


  // Page enter: fade in from black
  const pageIn = document.getElementById('page-in');
  const _urlPoster = new URLSearchParams(window.location.search).get("poster");
  if (_urlPoster) { const _v = document.getElementById("pj-video"); if (_v) { _v.poster = _urlPoster; _v.preload = "metadata"; } }
  if (_urlPoster) window.history.replaceState(null, "", window.location.pathname);
  document.body.classList.add("pj-entering");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { pageIn.style.transition = "transform 0.55s cubic-bezier(0.76,0,0.24,1)"; pageIn.style.transform = "translateY(-100%)"; });
  });

  // Back: fade to black then navigate
  

  const pageOut = document.createElement("div");
  pageOut.style.cssText = "position:fixed;inset:0;z-index:9999;background:#fff;pointer-events:none;transform:translateY(100%);";
  document.body.appendChild(pageOut);

  function goBack() {
    pageOut.style.transition = "transform 0.42s cubic-bezier(0.76,0,0.24,1)";
    pageOut.style.transform = "translateY(0)";
    pageOut.style.pointerEvents = "all";
    setTimeout(() => {
      if (document.referrer && new URL(document.referrer).host === window.location.host) history.back();
      else window.location.href = '/projects/';
    }, 420);
  }
  backBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      goBack();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.fullscreenElement) goBack(); });

  updatePlay(); updateMute(); updateCursorIcon();

  // Credits stagger â trigger when scrolled into view
  const credits = document.querySelector('.pj-credits');
  new IntersectionObserver((entries, obs) => {
    if (entries[0].isIntersecting) { credits.classList.add('revealed'); obs.disconnect(); }
  }, { threshold: 0.05 }).observe(credits);

  // ── SECTION SNAP SCROLL ──────────────────────────────────────────
  (function () {
    const DURATION = 420;
    const EASE = t => 1 - Math.pow(1 - t, 3); // ease-out cubic

    let scrolling = false;
    let startY = 0;
    let startTime = 0;
    let targetY = 0;
    let rafId = null;

    const credits = document.querySelector('.pj-credits');
    if (!credits) return;

    function getCreditsTop() {
      return Math.round(credits.getBoundingClientRect().top + window.scrollY);
    }

    function cancelAnim() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      scrolling = false;
    }

    function animateTo(to) {
      cancelAnim();
      startY = window.scrollY;
      targetY = to;
      startTime = performance.now();
      scrolling = true;
      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / DURATION, 1);
        window.scrollTo(0, startY + (targetY - startY) * EASE(t));
        if (t < 1) { rafId = requestAnimationFrame(step); }
        else { window.scrollTo(0, targetY); scrolling = false; rafId = null; }
      }
      rafId = requestAnimationFrame(step);
    }

    function onWheel(e) {
      const sy  = window.scrollY;
      const ct  = getCreditsTop();
      const vh  = window.innerHeight;
      const dn  = e.deltaY > 0;

      // ── Snap DOWN: anywhere in video zone → credits ──────────
      if (dn && sy < vh * 0.75) {
        if (scrolling) { cancelAnim(); return; }
        e.preventDefault();
        animateTo(ct);
        return;
      }

      // ── Snap UP: just at credits top → back to video ─────────
      if (!dn && sy >= ct - 30 && sy <= ct + vh * 0.35) {
        if (scrolling) { cancelAnim(); return; }
        e.preventDefault();
        animateTo(0);
        return;
      }

      // ── Free zone: cancel any anim, let browser scroll ───────
      if (scrolling) cancelAnim();
    }

    let touchStartY = 0;
    function onTouchStart(e) { touchStartY = e.touches[0].clientY; }
    function onTouchEnd(e) {
      const sy  = window.scrollY;
      const ct  = getCreditsTop();
      const vh  = window.innerHeight;
      const diff = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(diff) < 10) return;
      const dn = diff > 0;

      if (dn && sy < vh * 0.75)                            { animateTo(ct); return; }
      if (!dn && sy >= ct - 30 && sy <= ct + vh * 0.35)   { animateTo(0);  return; }
      if (scrolling) cancelAnim();
    }

    window.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchend', onTouchEnd, { passive: true });
  })();
</script>
</body>
