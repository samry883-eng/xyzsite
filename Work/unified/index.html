  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --fg: #fff;
      --muted: rgba(255, 255, 255, 0.52);
      --line: rgba(255, 255, 255, 0.13);
      --accent: #fff;
      --site-font: Micross, Arial, sans-serif;
      --type-ui: clamp(10px, 0.95vw, 11.2px);
      --type-filter-btn: clamp(9px, 0.85vw, 10px);
      --type-filter-label: clamp(7px, 0.65vw, 8px);
      --type-filter-link: clamp(9px, 0.85vw, 10.5px);
      --nav-h: clamp(52px, 9vh, 80px);
      --top-stack-h: 140px;
      --col-gap: 56px;
      --row-gap: 66px;
      --page-pad-x: clamp(20px, 4.2vw, 52px);
      --filter-marker-w: 18px;
      --filter-marker-gap: 10px;
      --filter-marker-slot: 28px;
      --tls: -0.012em;
    }

    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
      overflow-y: auto;
      font-family: var(--site-font);
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; display: none; }

    body {
      font-family: inherit;
      font-size: var(--type-ui);
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      background: var(--bg);
      min-height: 100vh;
    }

    ::selection { background: rgba(255, 255, 255, 0.16); }

    button, input, select, textarea { font: inherit; color: inherit; }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3%, 1%); }
      50% { transform: translate(2%, -2%); }
      75% { transform: translate(-1%, 2%); }
      100% { transform: translate(0, 0); }
    }

    /* ── FIXED TOP (nav + toolbar) ── */
    .wu-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1001;
      background: var(--bg);
    }

    nav {
      position: relative;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      background: transparent !important;
    }
    .nav-logo img { height: 29px; width: auto; display: block; }
    .nav-links {
      display: flex;
      gap: clamp(20px, 3vw, 34px);
      list-style: none;
      font-size: var(--type-ui);
      letter-spacing: normal;
      text-transform: uppercase;
    }
    .nav-links a {
      font-family: Micross, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: normal;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--fg); }

    .wu-toolbar-wrap {
      position: relative;
      z-index: 46;
      background: var(--bg);
    }

    .wu-toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 40px var(--page-pad-x) 18px;
      background: var(--bg);
      opacity: 1;
      transition: opacity 0.35s ease;
      font-family: var(--site-font);
    }
    .wu-toolbar.is-scroll-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .wu-toolbar__modes {
      display: flex;
      gap: 14px;
      align-items: baseline;
      flex-wrap: wrap;
      font-family: var(--site-font);
      font-size: var(--type-ui);
      font-weight: 400;
      letter-spacing: normal;
      text-transform: uppercase;
    }
    .wu-toolbar__modes button,
    .wu-filter-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: Micross, Arial, sans-serif;
      font-weight: 400;
      font-size: inherit;
      letter-spacing: normal;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.3s;
    }
    .wu-toolbar__modes button.is-active { color: var(--fg); }
    .wu-toolbar__modes button:hover { color: var(--fg); }
    .wu-toolbar__sep { color: var(--muted); opacity: 0.4; }
    .wu-filter-btn {
      display: inline-flex;
      align-items: baseline;
      font-size: var(--type-filter-btn);
    }
    .wu-filter-btn.is-open,
    .wu-filter-btn.is-active { color: var(--fg); }

    /* ── FILTER PANEL (reference curtain + scrim) ── */
    .wu-scrim {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(4, 4, 5, 0.78);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }
    .wu-scrim.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .wu-filter-drop {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 50;
      overflow: hidden;
      pointer-events: none;
      visibility: hidden;
      margin-top: -1px;
      font-family: var(--site-font);
    }
    .wu-filter-drop.is-open {
      pointer-events: auto;
      visibility: visible;
    }

    .wu-filter-curtain {
      position: absolute;
      inset: 0;
      clip-path: inset(0 0 100% 0);
      transition: clip-path 0.62s cubic-bezier(0.4, 0, 0.1, 1);
    }
    .wu-filter-curtain--white {
      z-index: 1;
      background: #f4f3ee;
      top: -1px;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .wu-filter-curtain--black {
      z-index: 2;
      background: var(--bg);
      box-shadow: 0 36px 70px -10px rgba(0, 0, 0, 0.7);
      bottom: -1px;
    }
    .wu-filter-drop.is-open.is-reveal .wu-filter-curtain--white {
      clip-path: inset(0);
      transition-delay: 0s;
      animation: wu-filter-white-out 0s linear 0.78s forwards;
    }
    @keyframes wu-filter-white-out {

    }

    if (cat === 'visual effects') {
      services.add('Visual Effects');
      services.add('Compositing');
      if (/delevingne|forgot|essentials|jacobs/i.test(blob)) services.add('Clean Up & Beauty');
      if (/atomic|manifesto|flip|essentials|palisades/i.test(blob)) services.add('Creative Direction');
      if (/speedcross|nba|nhl|palisades|flip|void/i.test(blob)) services.add('CGI');
    } else if (cat === 'sound') {
      services.add('Sound Design');
      if (card.soundDesignMix) services.add('Mixing & Mastering');
      if (card.credits) {
        card.credits.forEach(function (c) {
          const lab = c.label.toLowerCase();
          if (lab.indexOf('mix') >= 0 || lab.indexOf('mixer') >= 0) services.add('Mixing & Mastering');
        });
      }
      if (/teaser|open|galaxy/i.test(blob)) services.add('Compose');
    } else if (cat === 'ai') {
      services.add('AI');
      services.add('Visual Effects');
      services.add('Creative Direction');
      if (/concept|cold wall|ducati|bmw|nike|chanel|mercedes/i.test(blob)) services.add('CGI');
    }

    return { services: sortServicesList(Array.from(services)), type: [projectType] };
  }

  function sortServicesList(services) {
    const group = FILTER_GROUPS.find(function (g) { return g.key === 'services'; });
    const order = group ? group.options : [];
    return services.slice().sort(function (a, b) {
      const ia = order.indexOf(a);
      const ib = order.indexOf(b);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });
  }

  const PROJECTS = [];
  const baked = window.__PROJECTS_CATALOG;
  if (baked && baked.projects && baked.projects.length) {
    const catLabel = function (slug) {
      return ({ 'visual-effects': 'Visual Effects', sound: 'Sound', ai: 'AI', 'making-of': 'Making Of' })[slug] || slug;
    };
    baked.projects.slice().sort(function (a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); }).forEach(function (p) {
      PROJECTS.push({
        id: p.id,
        client: p.client,
        title: p.title,
        video: p.video,
        poster: p.poster,
        url: p.href,
        category: catLabel(p.category),
        services: p.services || [],
        type: [p.projectType || 'Commercial'],
        selected: !!p.featured,
        clipStart: p.clipStart,
        clipEnd: p.clipEnd,
      });
    });
  } else {
  ROWS.forEach(function (row) {
    row.cards.forEach(function (card) {
      const key = normalizeKey(card.title, card.client);
      const meta = inferProjectMeta(card, row.label);
      PROJECTS.push({
        id: key,
        client: card.client,
        title: card.title,
        video: card.video,
        poster: getPoster(card),
        url: projectURL(card, row.label),
        category: row.label,
        services: meta.services,
        type: meta.type,
        selected: SELECTED_KEYS.has(key),
        clipStart: card.clipStart,
        clipEnd: card.clipEnd,
      });
    });
  });
  }

  const state = { mode: 'selected', filters: { services: [], type: [] }, filterOpen: false };
  let closeTimer = null;
  let scrimTimer = null;
  const FILTER_CURTAIN_MS = 620;
  const FILTER_CLOSE_BLACK_DELAY_MS = 400;
  const FILTER_SCRIM_OUT_MS = FILTER_CLOSE_BLACK_DELAY_MS + FILTER_CURTAIN_MS + 120;
  const FILTER_PANEL_CLOSE_MS = FILTER_SCRIM_OUT_MS;

  const gridEl = document.getElementById('grid');
  const mainEl = document.getElementById('wu-main');
  const filterDrop = document.getElementById('filter-drop');
  const filterScrim = document.getElementById('filter-scrim');
  const filterOptions = document.getElementById('filter-options');
  const filterBtn = document.getElementById('mode-filter');
  const pageOut = document.getElementById('page-out');

  function activeFilterCount() {
    return state.filters.services.length + state.filters.type.length;
  }

  function matchesFilters(p) {
    if (state.filters.services.length && !state.filters.services.some(function (v) { return p.services.indexOf(v) >= 0; })) return false;
    if (state.filters.type.length && !state.filters.type.some(function (v) { return p.type.indexOf(v) >= 0; })) return false;
    return true;
  }

  function visibleProjects() {
    let list = PROJECTS.slice();
    if (state.mode === 'selected') list = list.filter(function (p) { return p.selected; });
    return list.filter(matchesFilters);
  }

  function collapseFilterPanelInstant() {
    clearTimeout(closeTimer);
    clearTimeout(scrimTimer);
    state.filterOpen = false;
    filterDrop.classList.remove('is-open', 'is-closing', 'is-reveal');
    filterDrop.setAttribute('aria-hidden', 'true');
    filterScrim.classList.remove('is-visible');
    filterScrim.setAttribute('aria-hidden', 'true');
    mainEl.classList.remove('is-dimmed');
    filterBtn.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  function setMode(mode) {
    if (state.filterOpen) collapseFilterPanelInstant();
    state.mode = mode;
    state.filters = { services: [], type: [] };
    document.querySelectorAll('[data-mode]').forEach(function (btn) {
      btn.classList.toggle('is-active', btn.dataset.mode === mode);
    });
    updateFilterUI();
    renderGrid();
    if (mode !== 'selected') window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleFilter(key, name) {
    const already = state.filters[key].indexOf(name) >= 0;
    state.filters.services = [];
    state.filters.type = [];
    if (!already) {
      state.filters[key] = [name];
      state.mode = 'everything';
      document.querySelectorAll('[data-mode]').forEach(function (btn) {
        btn.classList.toggle('is-active', false);
      });
    }
    updateFilterUI();

    if (state.filterOpen) {
      renderGrid();
      if (!already) window.scrollTo({ top: 0, behavior: 'smooth' });
      requestAnimationFrame(function () { closeFilterPanel(); });
      return;
    }

    renderGrid();
    if (!already) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeFilterPanel() {
    if (!state.filterOpen) return;
    clearTimeout(closeTimer);
    clearTimeout(scrimTimer);
    state.filterOpen = false;
    applyFilterStagger(false);
    filterDrop.classList.add('is-closing');
    filterBtn.classList.remove('is-open');
    filterDrop.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    closeTimer = setTimeout(function () {
      filterDrop.classList.remove('is-open', 'is-closing', 'is-reveal');
    }, FILTER_PANEL_CLOSE_MS);
    scrimTimer = setTimeout(function () {
      filterScrim.classList.remove('is-visible');
      filterScrim.setAttribute('aria-hidden', 'true');
      mainEl.classList.remove('is-dimmed');
      updateFilterUI();
    }, FILTER_SCRIM_OUT_MS);
  }

  function openFilterPanel() {
    if (state.filterOpen) {
      closeFilterPanel();
      return;
    }
    clearTimeout(closeTimer);
    clearTimeout(scrimTimer);
    state.filterOpen = true;
    filterDrop.classList.add('is-open');
    filterDrop.classList.remove('is-closing');
    filterDrop.setAttribute('aria-hidden', 'false');
    filterScrim.classList.add('is-visible');
    filterScrim.setAttribute('aria-hidden', 'false');
    mainEl.classList.add('is-dimmed');
    filterBtn.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    var tb = document.querySelector('.wu-toolbar');
    if (tb) tb.classList.remove('is-scroll-hidden');
    scrollDelta = 0;
    scrollDir = 0;
    toolbarHidden = false;
    updateFilterUI();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        filterDrop.classList.add('is-reveal');
        applyFilterStagger(true);
      });
    });
  }

  function applyFilterStagger(revealing) {
    var idx = 0;
    var total = FILTER_GROUPS.reduce(function (a, g) { return a + g.options.length; }, 0);
    var groups = filterOptions.querySelectorAll('.wu-filter-group');
    var head = filterDrop.querySelector('.wu-filter-head');

    groups.forEach(function (section, ci) {
      var label = section.querySelector('.wu-filter-group-label');
      if (!label) return;
      var catOpen = (0.26 + ci * 0.05).toFixed(2) + 's';
      var catClose = (0.04 + (groups.length - 1 - ci) * 0.04).toFixed(2) + 's';
      label.style.transitionDelay = revealing ? catOpen : catClose;
    });

    filterOptions.querySelectorAll('.wu-filter-link').forEach(function (btn) {
      var openD = (0.32 + idx * 0.04).toFixed(2) + 's';
      var closeD = ((total - 1 - idx) * 0.022).toFixed(2) + 's';
      btn.style.transitionDelay = revealing ? openD : closeD;
      idx++;
    });

    if (head) head.style.transitionDelay = revealing ? '0.34s' : '0s';
  }

  function updateFilterUI() {
    const filtering = activeFilterCount() > 0;
    filterBtn.classList.toggle('is-active', filtering && !state.filterOpen);
    if (filtering) {
      document.querySelectorAll('[data-mode]').forEach(function (btn) {
        btn.classList.toggle('is-active', false);
      });
    }
    filterOptions.querySelectorAll('.wu-filter-link').forEach(function (btn) {
      const key = btn.dataset.key;
      const name = btn.dataset.name;
      const active = state.filters[key] && state.filters[key].indexOf(name) >= 0;
      btn.classList.toggle('is-active', active);
    });
  }

  function buildFilterPanel() {
    filterOptions.innerHTML = '';
    FILTER_GROUPS.forEach(function (group, gi) {
      const section = document.createElement('div');
      section.className = 'wu-filter-group';
      section.dataset.key = group.key;
      const label = document.createElement('div');
      label.className = 'wu-filter-group-label';
      label.textContent = group.label;
      section.appendChild(label);
      const links = document.createElement('div');
      links.className = 'wu-filter-links wu-filter-links--' + group.key;
      group.options.forEach(function (opt) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wu-filter-link';
        btn.dataset.key = group.key;
        btn.dataset.name = opt;
        btn.innerHTML = '<span class="wu-filter-marker"></span>' + opt;
        btn.addEventListener('click', function () { toggleFilter(group.key, opt); });
        links.appendChild(btn);
      });
      section.appendChild(links);
      filterOptions.appendChild(section);
    });
    updateFilterUI();
  }

  function bindCardHover(wrap, project) {
    if (!window.matchMedia('(hover: hover)').matches) return;
    if (wrap.dataset.hoverBound) return;
    wrap.dataset.hoverBound = '1';
    var card = wrap.querySelector('.work-card');
    var video = card && card.querySelector('.wc-hover-video');
    var img = card && card.querySelector('.wc-card-poster');
    if (!card || !video) return;

    wrap.addEventListener('mouseenter', function () {
      wrap.classList.add('wc-hover-active');
      video.muted = true;
      if (!video.src && video.dataset.src) {
        video.src = video.dataset.src;
        video.load();
      }
      if (project.clipStart != null) video.currentTime = project.clipStart;
      video.play().catch(function () {});
      if (img) img.style.opacity = '0';
    });
    wrap.addEventListener('mouseleave', function () {
      wrap.classList.remove('wc-hover-active');
      video.pause();
      video.currentTime = project.clipStart != null ? project.clipStart : 0;
      if (img) img.style.opacity = '';
    });
  }

  function navigateTo(url, poster) {
    const dest = poster ? url + '?poster=' + encodeURIComponent(poster) : url;
    if (!pageOut) {
      window.location.href = dest;
      return;
    }
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(100%)';
    pageOut.style.pointerEvents = 'all';
    if (window.xyzQuickSlide) {
      window.xyzQuickSlide.markNav();
      window.xyzQuickSlide.cover(pageOut, function () { window.location.href = dest; });
      return;
    }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        pageOut.style.transition = 'transform 0.48s cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(0)';
      });
    });
    try { sessionStorage.setItem('xyz-quick-nav', '1'); } catch (e) {}
    setTimeout(function () { window.location.href = dest; }, 540);
  }

  function renderGrid() {
    const list = visibleProjects();
    gridEl.innerHTML = '';
    updateFilterUI();

    list.forEach(function (p, i) {
      const wrap = document.createElement('div');
      wrap.className = 'work-card-wrap';
      const tagline = p.type[0] || 'Commercial';

      wrap.innerHTML =
        '<div class="work-card">' +
          '<video class="wc-hover-video" muted loop playsinline preload="none" data-src="' + p.video + '"></video>' +
          '<img class="wc-card-poster" src="' + p.poster + '" alt="' + p.title + ' – ' + p.client + '" loading="' + (i < 6 ? 'eager' : 'lazy') + '">' +
          '<div class="wc-grain"></div>' +
          '<div class="wc-vignette"></div>' +
        '</div>' +
        '<div class="wc-label-block">' +
          '<div class="wc-title-row">' +
            '<span class="wc-label-title">' + p.title + '</span>' +
            '<span class="wc-label-sep"> – </span>' +
            '<span class="wc-label-client">' + p.client + '</span>' +
          '</div>' +
          '<div class="wc-tagline">' + tagline + '</div>' +
        '</div>';

      const img = wrap.querySelector('.wc-card-poster');
      img.addEventListener('error', function () { img.src = FALLBACK_IMG; }, { once: true });

      const video = wrap.querySelector('.wc-hover-video');
      if (p.clipStart != null && p.clipEnd != null) {
        video.addEventListener('loadedmetadata', function () { video.currentTime = p.clipStart; }, { once: true });
        video.addEventListener('timeupdate', function () {
          if (video.currentTime >= p.clipEnd) video.currentTime = p.clipStart;
        });
      }

      wrap.addEventListener('click', function () { navigateTo(p.url, p.poster); });
      bindCardHover(wrap, p);
      gridEl.appendChild(wrap);
    });
  }

  document.getElementById('mode-everything').addEventListener('click', function () { setMode('everything'); });
  document.getElementById('mode-selected').addEventListener('click', function () { setMode('selected'); });
  filterBtn.addEventListener('click', openFilterPanel);
  document.getElementById('filter-close').addEventListener('click', closeFilterPanel);
  filterScrim.addEventListener('click', closeFilterPanel);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.filterOpen) closeFilterPanel();
  });

  document.addEventListener('click', function (e) {
    const a = e.target.closest('nav a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;
    let u;
    try { u = new URL(href, location.href); } catch (x) { return; }
    if (u.origin !== location.origin) return;
    if (u.pathname === location.pathname && !u.search) return;
    e.preventDefault();
    navigateTo(u.pathname + u.search + u.hash);
  }, true);

  function waitForGridReady() {
    var seen = new Set();
    var imgs = [];
    document.querySelectorAll('.wc-card-poster').forEach(function (img) {
      if (!img.src || seen.has(img.src)) return;
      seen.add(img.src);
      imgs.push(img);
    });
    if (!imgs.length) return Promise.resolve();
    var decodes = imgs.map(function (img) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      if (img.decode) return img.decode().catch(function () {});
      return new Promise(function (res) {
        img.addEventListener('load', res, { once: true });
        img.addEventListener('error', res, { once: true });
      });
    });
    var bail = new Promise(function (res) { setTimeout(res, 6000); });
    return Promise.race([Promise.allSettled(decodes), bail]);
  }

  function isReloadNavigation() {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.type) return nav.type === 'reload';
    try { return !!(performance.navigation && performance.navigation.type === 1); } catch (e) { return false; }
  }

  function markPageOpen() {
    document.body.classList.add('wu-page-open');
  }

  function slideAwayPanel(fromCacheRestore) {
    if (!pageOut) {
      markPageOpen();
      return;
    }
    var dur = (!fromCacheRestore && isReloadNavigation()) ? '1.06s' : '0.48s';
    var QS = window.xyzQuickSlide;
    if (QS && dur === '0.48s') {
      QS.reveal(pageOut, function () {
        markPageOpen();
      });
      return;
    }
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(0)';
    pageOut.style.pointerEvents = 'none';
    var done = false;
    function finishOpen() {
      if (done) return;
      done = true;
      pageOut.removeEventListener('transitionend', onEnd);
      clearTimeout(fallback);
      markPageOpen();
    }
    function onEnd(e) {
      if (e.target !== pageOut || e.propertyName !== 'transform') return;
      finishOpen();
    }
    pageOut.addEventListener('transitionend', onEnd);
    var fallback = setTimeout(finishOpen, parseFloat(dur) * 1000 + 120);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        pageOut.style.transition = 'transform ' + dur + ' cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(-100%)';
      });
    });
  }

  var pageOpenStarted = false;
  function openUnifiedPage() {
    if (pageOpenStarted) return;
    pageOpenStarted = true;
    slideAwayPanel();
    setTimeout(function () {
      if (!document.body.classList.contains('wu-page-open')) markPageOpen();
    }, 1200);
  }

  buildFilterPanel();
  filterDrop.style.setProperty('--filter-close-black-delay', (FILTER_CLOSE_BLACK_DELAY_MS / 1000) + 's');
  renderGrid();

  function syncTopStackHeight() {
    var top = document.getElementById('wu-top');
    if (top) document.documentElement.style.setProperty('--top-stack-h', top.offsetHeight + 'px');
  }
  syncTopStackHeight();
  window.addEventListener('resize', syncTopStackHeight);

  var toolbarEl = document.querySelector('.wu-toolbar');
  var SCROLL_TOOLBAR_HIDE_PX = 100;
  var SCROLL_TOOLBAR_SHOW_PX = 80;
  var lastScrollY = window.scrollY || 0;
  var scrollDelta = 0;
  var scrollDir = 0;
  var toolbarHidden = false;
  var scrollTicking = false;
  window.addEventListener('scroll', function () {
    if (scrollTicking || !toolbarEl) return;
    scrollTicking = true;
    requestAnimationFrame(function () {
      var y = window.scrollY || document.documentElement.scrollTop || 0;
      if (state.filterOpen || y < 8) {
        scrollDelta = 0;
        scrollDir = 0;
        toolbarHidden = false;
        toolbarEl.classList.remove('is-scroll-hidden');
        lastScrollY = y;
        scrollTicking = false;
        return;
      }

      var dy = y - lastScrollY;
      if (dy !== 0) {
        var dir = dy > 0 ? 1 : -1;
        if (dir !== scrollDir) {
          scrollDir = dir;
          scrollDelta = 0;
        }
        scrollDelta += Math.abs(dy);

        if (!toolbarHidden && scrollDir === 1 && scrollDelta >= SCROLL_TOOLBAR_HIDE_PX) {
          toolbarHidden = true;
          toolbarEl.classList.add('is-scroll-hidden');
          scrollDelta = 0;
        } else if (toolbarHidden && scrollDir === -1 && scrollDelta >= SCROLL_TOOLBAR_SHOW_PX) {
          toolbarHidden = false;
          toolbarEl.classList.remove('is-scroll-hidden');
          scrollDelta = 0;
        }
      }

      lastScrollY = y;
      scrollTicking = false;
    });
  }, { passive: true });

  var quickNav = window.xyzQuickSlide && window.xyzQuickSlide.wasQuickNav
    ? window.xyzQuickSlide.wasQuickNav()
    : (function () {
      try {
        if (sessionStorage.getItem('xyz-quick-nav') === '1') {
          sessionStorage.removeItem('xyz-quick-nav');
          return true;
        }
      } catch (e) {}
      return false;
    })();

  if (quickNav) {
    openUnifiedPage();
  } else {
    setTimeout(openUnifiedPage, 1000);
  }
  waitForGridReady().catch(function () {});
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    pageOpenStarted = false;
    document.body.classList.remove('wu-page-open');
    if (pageOut) {
      pageOut.style.transition = 'none';
      pageOut.style.transform = 'translateY(0)';
      pageOut.style.pointerEvents = 'none';
    }
    openUnifiedPage();
  });
})();
</script>
</body>
