<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Work — XYZ Studios</title>
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h:    clamp(52px, 9vh, 80px);
      --row-gap:  clamp(4px, min(1.4vh, 2.5vw), 52px);
      --card-gap: clamp(20px, 3.5vw, 48px);
      --col-pad:  24px;
      /* Reserve space for title row under each thumbnail (must match .wc-header) */
      --wc-label-h: clamp(24px, 3.6vh, 46px);
    }

    html, body {
      background: #000; color: #fff;
      font-family: Micross, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: hidden;
      height: 100%;
    }

    /* ── NAV ──────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      background: transparent !important;
    }
    .nav-logo img { height: 29px; width: auto; display: block; }
    .nav-links { display: flex; gap: 47px; list-style: none; }
    .nav-links a {
      text-decoration: none;
      color: rgba(250,250,250,0.35);
      font-family: Micross, Arial, sans-serif;
      font-size: 10.64px; font-weight: 400;
      letter-spacing: normal; text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .nav-links a.active,
    .nav-links a:hover { color: rgb(250,250,250); }

    /* ── SHOWCASE — 4 rows always fit in viewport (no vertical page scroll) ─ */
    .work-showcase {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      height: calc(100vh - var(--nav-h));
      height: calc(100dvh - var(--nav-h));
      max-height: calc(100dvh - var(--nav-h));
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);
      padding: clamp(6px, 1.2vh, 28px) clamp(16px, 4vw, 48px) clamp(4px, 0.8vh, 20px);
      overflow-x: hidden;
      overflow-y: hidden;
      background: #000;
      z-index: 1;
    }

    /* ── ROW HEADER ─────────────────────────────────────── */
    .work-row-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: clamp(2px, 0.4vh, 6px);
    }
    .work-row-cat {
      font-family: Micross, Arial, sans-serif;
      font-size: 8px; font-weight: 400;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    .work-row-line {
      display: none;
    }

    .work-row {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.45vh, 6px);
    }

    /* ── TOP GRADIENT OVERLAY (behind nav, over thumbnails) ─ */
    .work-fade-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* ── TEXT FADE — thin strip at top of showcase ──────── */
    .work-fade-text {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0;
      height: 28px;
      background: linear-gradient(to bottom, #000 0%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* ── RIGHT FADE OVERLAY ──────────────────────────────── */
    .work-fade-right {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 120px;
      background: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 50%, #000 100%);
      pointer-events: none;
      z-index: 500;
    }

    .work-row-cards {
      container-type: size;
      container-name: work-row-strip;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      gap: var(--card-gap);
      overflow-x: auto;
      overflow-y: hidden;
      padding-top: clamp(2px, 0.5vh, 14px);
      margin-top: clamp(-6px, -0.45vh, -14px);
      padding-bottom: 2px;
      padding-right: clamp(16px, 4vw, 48px);
      scrollbar-width: none;
    }
    .work-row-cards::-webkit-scrollbar { display: none; }

    /* ── ROW HEADER (no load-in animation) ──────────────── */
    .work-row-header {
      opacity: 1;
      transform: none;
    }

    /* ── CARD WRAP — height from row strip; width = 16:9 of thumb area ─ */
    .work-card-wrap {
      flex: 0 0 auto;
      height: 100cqh;
      max-height: 100%;
      width: calc((100cqh - var(--wc-label-h)) * 16 / 9);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      opacity: 1;
      transform: none;
    }

    /* ── CARD HEADER ── */
    .wc-header {
      flex: 0 0 var(--wc-label-h);
      padding-top: clamp(2px, 0.4vh, 8px);
      font-family: Micross, Arial, sans-serif;
      min-width: 0;
      min-height: 0;
      text-align: center;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .wc-label {
      font-size: 8px; font-weight: 400; letter-spacing: 0.04em; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-transform: uppercase;
      display: block;
    }
    .wc-label-client { color: rgba(255,255,255,0.35); }
    .wc-label-sep    { color: rgba(255,255,255,0.2); }
    .wc-label-title  { color: rgba(255,255,255,0.9); }

    /* ── CARD THUMBNAIL ─────────────────────────────────── */
    .wc-tilt {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    @supports not (container-type: size) {
      .work-card-wrap {
        height: 100%;
        width: min(185px, 26vw);
      }
    }
    .work-card {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #111;
      position: relative;
    }
    .work-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      position: relative; z-index: 1;
    }
    .work-card::before {
      content: ''; position: absolute; inset: 0;
      background: #111; z-index: 0;
    }
    .work-card.loaded::before { display: none; }

    /* Hover overlay */
    .work-card::after {
      content: ''; position: absolute; inset: 0; z-index: 2;
      background: rgba(0,0,0,0);
      transition: background 0.3s ease;
    }
    .work-card-wrap:hover .work-card::after {
      background: rgba(0,0,0,0.18);
    }
  </style>
</head>

<style>
#xyz-wl{position:fixed;inset:0;z-index:10001;background:#fff;will-change:transform;pointer-events:all}
#xyz-wl-track{position:absolute;top:50%;left:44px;right:44px;height:3px;background:rgba(0,0,0,0.1);transform:translateY(-50%)}
#xyz-wl-fill{position:absolute;top:50%;left:44px;right:44px;height:3px;background:#111;transform:translateY(-50%) scaleX(0);transform-origin:left center;will-change:transform}
#xyz-wl-fill.go{animation:xyzBar 1.8s cubic-bezier(0.37,0,0.63,1) forwards}
@keyframes xyzBar{from{transform:translateY(-50%) scaleX(0)}to{transform:translateY(-50%) scaleX(1)}}
#xyz-wl-logo{position:absolute;bottom:36px;left:44px;width:72px;opacity:0;transition:opacity .3s ease;filter:invert(1)}
</style>
<div id="xyz-wl">
  <div id="xyz-wl-track"></div>
  <div id="xyz-wl-fill"></div>
  <img id="xyz-wl-logo" src="https://cdn.prod.website-files.com/6917408c1d0fee8fc2c58505/691f47e2f734702aa3a0675f_xyz-logo.png" alt="XYZ Studios">
</div>
<script>
(function(){
  var wf=document.querySelector('.loading_container');
  if(wf)wf.style.display='none';
  var el=document.getElementById('xyz-wl');
  var fill=document.getElementById('xyz-wl-fill');
  var logo=document.getElementById('xyz-wl-logo');
  document.body.style.overflow='hidden';
  setTimeout(function(){
    logo.style.opacity='1';
    fill.classList.add('go');
  },80);
  fill.addEventListener('animationend',function(){
    setTimeout(exit,220);
  });
  function exit(){
    el.style.transition='transform .65s cubic-bezier(0.76,0,0.24,1)';
    el.style.transform='translateY(-100%)';
    document.body.style.overflow='';
    document.dispatchEvent(new CustomEvent('xyz-exiting'));
    setTimeout(function(){el.style.display='none';},700);
  }
})();
</script>

  function decodeHTML(str) {
    return str.replace(/&amp;/g, '&')
      .replace(/&#x27;|&apos;/g, "'")
      .replace(/&quot;/g, '"');
  }

  function normalizeKey(title, client) {
    const clean = s => decodeHTML(s || '')
      .trim()
      .toLowerCase()
      .replace(/[''`]/g, '')
      .replace(/[""]/g, '"')
      .replace(/\s+/g, ' ')
      .replace(/\s*\/\s*/g, '/');
    return `${clean(title)}|${clean(client)}`;
  }

  function getPoster(title, client) {
    return THUMBNAILS[normalizeKey(title, client)];
  }

  // ── URL slug helpers (must match generate-projects.mjs) ──
  function slugify(s) {
    return s.toLowerCase()
      .replace(/[''`']/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '');
  }
  function projectURL(card, catLabel) {
    const catSlug  = slugify(catLabel);
    const projSlug = card.slug || slugify(card.title);
    return `/work/${catSlug}/${projSlug}/`;
  }

  // Fallback: VidzFlow CDN thumbnail from video URL
  function getVFThumb(videoUrl) {
    const m = videoUrl.match(/vidzflow\.com\/source\/([\w-]+)\.mp4/);
    return m ? `https://r2.vidzflow.com/thumbnails/${m[1]}.jpg` : null;
  }

  // Fallback: Streamable CDN thumbnail
  function getSBThumb(videoUrl) {
    const m = videoUrl.match(/streamable\.com\/([A-Za-z0-9_-]+)/);
    return m ? `https://cdn.streamable.com/image/${m[1]}.jpg` : null;
  }

  // ── BUILD DOM ──────────────────────────────────────────
  const showcase = document.getElementById('showcase');

  const DEFAULT_POSTER = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22360%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23111%22/%3E%3C/svg%3E';

  const CAT_LABELS = {
    'Visual Effects': 'VISUAL',
    'Sound': 'SOUND',
    'AI': 'AI',
    'Making Of': 'MAKING OF',
  };

  ROWS.forEach((rowData) => {
    const row = document.createElement('div');
    row.className = 'work-row';
    row.dataset.label = rowData.label;

    const rowHeader = document.createElement('div');
    rowHeader.className = 'work-row-header';
    rowHeader.innerHTML = `
      <span class="work-row-cat">${CAT_LABELS[rowData.label] || rowData.label.toUpperCase()}</span>
      <div class="work-row-line"></div>
    `;

    const rowCards = document.createElement('div');
    rowCards.className = 'work-row-cards';

    rowData.cards.forEach((card, cardIdx) => {
      const numStr = String(cardIdx + 1).padStart(2, '0');

      const wrap = document.createElement('div');
      wrap.className = 'work-card-wrap';
      wrap.dataset.rowLabel = rowData.label;

      const header = document.createElement('div');
      header.className = 'wc-header';
      header.innerHTML = `<span class="wc-label"><span class="wc-label-client">${card.client}</span><span class="wc-label-sep"> — </span><span class="wc-label-title">${card.title}</span></span>`;

      const div = document.createElement('div');
      div.className = 'work-card';

      const img = document.createElement('img');
      const poster = getPoster(card.title, card.client) || getVFThumb(card.video) || getSBThumb(card.video) || DEFAULT_POSTER;
      img.src = poster;
      img.alt = `${card.client} — ${card.title}`;
      img.addEventListener('load', () => div.classList.add('loaded'));
      img.addEventListener('error', () => { img.src = DEFAULT_POSTER; div.classList.add('loaded'); });

      div.appendChild(img);

      const tiltWrap = document.createElement('div');
      tiltWrap.className = 'wc-tilt';
      tiltWrap.appendChild(div);
      tiltWrap.appendChild(header);
      wrap.appendChild(tiltWrap);

      // Navigate to project page on click
      wrap.addEventListener('click', () => {
        navigateTo(projectURL(card, rowData.label), poster);
      });

      rowCards.appendChild(wrap);
    });

    row.appendChild(rowHeader);
    row.appendChild(rowCards);
    showcase.appendChild(row);
  });

  // ── HORIZONTAL ROWS — smooth lerp scroll ─────────────────────
  document.querySelectorAll('.work-row-cards').forEach(rowCards => {
    const originals = Array.from(rowCards.querySelectorAll('.work-card-wrap'));
    if (!originals.length) return;

    originals.forEach(orig => {
      const c = orig.cloneNode(true); c.dataset.clone='1'; rowCards.appendChild(c);
    });
    [...originals].reverse().forEach(orig => {
      const c = orig.cloneNode(true); c.dataset.clone='1';
      rowCards.insertBefore(c, rowCards.firstChild);
    });

    rowCards.querySelectorAll('[data-clone]').forEach(c => {
      c.style.transition = 'none';
      c.style.opacity = '1';
      c.style.transform = 'none';
    });

    // Re-attach click on clones
    rowCards.querySelectorAll('[data-clone] .work-card-wrap, [data-clone].work-card-wrap').forEach(cloneWrap => {
      const cloneClient = cloneWrap.querySelector('.wc-client')?.textContent.trim();
      const cloneTitle  = cloneWrap.querySelector('.wc-title')?.textContent.trim();
      const cloneCat    = cloneWrap.dataset.rowLabel || '';
      cloneWrap.style.cursor = 'pointer';
      cloneWrap.addEventListener('click', () => {
        const row  = ROWS.find(r => r.label === cloneCat);
        const card = row?.cards.find(c => c.client === cloneClient && c.title === cloneTitle);
        if (card) navigateTo(projectURL(card, cloneCat));
      });
    });

    let loopW = 0, pos = 0, target = 0, animFrom = 0, animStart = 0, raf = null, locked = false;
    const DURATION = 900;

    function easeInOut(t) { return 1 - Math.pow(1 - t, 4); }
    function wrapPos() {
      if (pos < loopW * 0.1) { pos += loopW; target += loopW; animFrom += loopW; }
      if (pos > loopW * 1.9) { pos -= loopW; target -= loopW; animFrom -= loopW; }
    }
    function snapTick() {
      const t = Math.min((performance.now() - animStart) / DURATION, 1);
      pos = animFrom + (target - animFrom) * easeInOut(t);
      wrapPos(); rowCards.scrollLeft = pos;
      if (t < 1) { raf = requestAnimationFrame(snapTick); }
      else { pos = target; wrapPos(); rowCards.scrollLeft = pos; raf = null; setTimeout(() => { locked = false; }, 500); }
    }
    function startSnap(dir) {
      if (locked) return; locked = true;
      const cardEl = rowCards.querySelector('.work-card-wrap');
      const cardW = cardEl ? cardEl.offsetWidth + 16 : 260;
      animFrom = pos; animStart = performance.now(); target = pos + dir * cardW * 2;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(snapTick);
    }

    rowCards.addEventListener('wheel', e => { if (!e.target.closest('.work-card-wrap')) return; e.preventDefault(); e.stopPropagation(); startSnap(e.deltaY > 0 ? 1 : -1); }, { passive: false });

    let tx0 = 0, tx1 = 0;
    rowCards.addEventListener('touchstart', e => { tx0 = tx1 = e.touches[0].clientX; }, { passive: true });
    rowCards.addEventListener('touchmove', e => { const dx = tx1 - e.touches[0].clientX; tx1 = e.touches[0].clientX; pos += dx; wrapPos(); rowCards.scrollLeft = pos; }, { passive: true });
    rowCards.addEventListener('touchend', e => { const dx = tx0 - e.changedTouches[0].clientX; if (Math.abs(dx) > 30) startSnap(dx > 0 ? 1 : -1); }, { passive: true });

    requestAnimationFrame(() => {
      loopW = rowCards.scrollWidth / 3;
      pos = loopW; target = loopW; animFrom = loopW;
      rowCards.scrollLeft = pos;
    });
  });

  // ── 3D TILT ──────────────────────────────────────────────────
  const SPRING = 'transform 1.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 1.3s cubic-bezier(0.25,0.46,0.45,0.94)';
  const ENTER  = 'transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.5s ease';
  document.querySelectorAll('.wc-tilt').forEach(tilt => {
    let entering = false, enterTimer;
    tilt.addEventListener('mouseenter', () => {
      entering = true;
      tilt.style.transition = ENTER;
      clearTimeout(enterTimer);
      enterTimer = setTimeout(() => { entering = false; }, 500);
    });
    tilt.addEventListener('mousemove', e => {
      const r  = tilt.getBoundingClientRect();
      const x  = e.clientX - r.left;
      const y  = e.clientY - r.top;
      const cx = r.width  / 2;
      const cy = r.height / 2;
      const tiltX = ((y - cy) / cy) * -6;
      const tiltY = ((x - cx) / cx) *  6;
      const sBlur = 20 + (Math.abs(tiltX) + Math.abs(tiltY)) * 0.5;
      if (!entering) tilt.style.transition = 'none';
      tilt.style.transform = `perspective(900px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      tilt.style.boxShadow = `${tiltY * 0.4}px ${-tiltX * 0.4}px ${sBlur}px rgba(0,0,0,0.45)`;
    });
    tilt.addEventListener('mouseleave', () => {
      entering = false;
      clearTimeout(enterTimer);
      tilt.style.transition = SPRING;
      tilt.style.transform  = '';
      tilt.style.boxShadow  = '';
    });
  });

  // ── TOP FADE (no vertical scroll on work grid; stays hidden) ─
  const fadeTop = document.querySelector('.work-fade-top');
  if (fadeTop) fadeTop.style.opacity = '0';

  // ── PAGE TRANSITION ───────────────────────────────────────────
  const pageOut = document.getElementById('page-out');

  function slideAwayPanel() {
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(0)';
    pageOut.style.pointerEvents = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        pageOut.style.transition = 'transform 0.58s cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(-100%)';
      });
    });
  }

  // On fresh load or bfcache restore: slide panel up to reveal
  slideAwayPanel();
  window.addEventListener('pageshow', (e) => { if (e.persisted) slideAwayPanel(); });

  function navigateTo(url, poster) {
    const dest = poster ? url + '?poster=' + encodeURIComponent(poster) : url;
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(100%)';
    pageOut.style.pointerEvents = 'all';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        pageOut.style.transition = 'transform 0.48s cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(0)';
      });
    });
    setTimeout(() => { window.location.href = dest; }, 540);
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('nav a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;
    if (/mailto:|tel:/i.test(href)) return;
    let u;
    try { u = new URL(href, location.href); } catch (x) { return; }
    if (u.origin !== location.origin) return;
    if (u.pathname === location.pathname && !u.search) return;
    e.preventDefault();
    navigateTo(u.pathname + u.search + u.hash);
  }, true);
</script>
</body>
