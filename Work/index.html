  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h:    clamp(52px, 9vh, 80px);
      --row-gap:  clamp(4px, min(1.4vh, 2.5vw), 52px);
      --card-gap: clamp(20px, 3.5vw, 48px);
      --col-pad:  24px;
      /* Reserve space for title row under each thumbnail (must match .wc-header) */
      --wc-label-h: clamp(24px, 3.6vh, 46px);
      /* Space between video thumb and title (included in 16:9 width calc) */
      --wc-card-gap: clamp(12px, 2vh, 22px);
      /* Hover zoom; neighbors move away (no peer down-scale) */
      --wc-hover-max: 1.12;
      --work-divider: rgba(255, 255, 255, 0.14);
      --wc-hover-ease: cubic-bezier(0.33, 1, 0.68, 1);
      --wc-hover-dur: 0.68s;
    }

    html, body {
      background: #000; color: #fff;
      font-family: Micross, Arial, sans-serif;
      font-size: clamp(9.6px, 1vw, 11.2px);
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: hidden;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* ── NAV ──────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      background: transparent !important;
    }
    .nav-logo img { height: 29px; width: auto; display: block; }
    .nav-links { display: flex; gap: 47px; list-style: none; }
    .nav-links a {
      text-decoration: none;
      color: rgba(250,250,250,0.35);
      font: 400 10px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .nav-links a.active,
    .nav-links a:hover { color: rgb(250,250,250); }

    /* ── SHOWCASE — 4 rows always fit in viewport (no vertical page scroll) ─ */
    .work-showcase {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      height: calc(100vh - var(--nav-h));
      height: calc(100dvh - var(--nav-h));
      max-height: calc(100dvh - var(--nav-h));
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);
      padding: clamp(6px, 1.2vh, 28px) clamp(16px, 4vw, 48px) clamp(4px, 0.8vh, 20px);
      /* visible so scaled thumbs + titles are not clipped (html/body already lock scroll) */
      overflow: visible;
      background: #000;
      z-index: 1;
    }

    /* ── ROW HEADER (bold divider + index, ref: Work - bold dividers) ─ */
    .work-row-header {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-end;
      width: 100%;
      gap: clamp(10px, 1.2vh, 16px);
      padding: 0 clamp(16px, 4vw, 48px) clamp(8px, 0.9vh, 14px);
      margin-bottom: clamp(2px, 0.35vh, 6px);
      box-sizing: border-box;
    }
    .work-row-header__left {
      display: flex;
      align-items: baseline;
      gap: clamp(12px, 2vw, 24px);
      min-width: 0;
    }
    .work-row-num {
      font: 400 1em/1 Micross, Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .work-row-cat {
      margin: 0;
      font-family: Micross, Arial, sans-serif;
      font-size: clamp(24px, 3.8vh, 48px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #fff;
      cursor: default;
    }
    /* Row scrub — single line under title (replaces separate divider + scrub) */
    .work-row-scrub {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
      box-sizing: border-box;
    }
    .work-row-scrub__track {
      position: relative;
      width: 100%;
      height: 1px;
      background: var(--work-divider);
      cursor: grab;
      touch-action: none;
    }
    .work-row-scrub__track:active { cursor: grabbing; }
    .work-row-scrub__fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.42);
      pointer-events: none;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }

    .work-row {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.45vh, 6px);
    }

    /* ── TOP GRADIENT OVERLAY (behind nav, over thumbnails) ─ */
    .work-fade-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* ── TEXT FADE — soft edge at top of showcase (keep visuals visible) ─ */
    .work-fade-text {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0;
      height: 36px;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.22) 0%,
        rgba(0, 0, 0, 0.06) 55%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ── RIGHT FADE OVERLAY ──────────────────────────────── */
    .work-fade-right {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 120px;
      background: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 50%, #000 100%);
      pointer-events: none;
      z-index: 500;
    }

    .work-row-cards {
      container-type: size;
      container-name: work-row-strip;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      gap: var(--card-gap);
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: none;
      touch-action: pan-x;
      padding-top: clamp(2px, 0.5vh, 8px);
      margin-top: 0;
      padding-bottom: 2px;
      padding-right: clamp(16px, 4vw, 48px);
      scrollbar-width: none;
    }
    .work-row-cards::-webkit-scrollbar { display: none; }

    /* ── ROW ENTRANCE ANIMATION ─────────────────────────── */
    .work-row {
      opacity: 0;
      transform: translateY(48px);
      will-change: transform, opacity;
    }
    .work-row.wc-row-in {
      opacity: 1;
      transform: translateY(0);
      /* Item reveal on xyzstudios.co/projects: 1.2s, power3.inOut, 60ms stagger from top */
      transition:
        opacity   1.2s cubic-bezier(0.65, 0, 0.35, 1),
        transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ── CARD WRAP — height from row strip; width = 16:9 of thumb area ─ */
    .work-card-wrap {
      flex: 0 0 auto;
      height: 100cqh;
      max-height: 100%;
      width: calc((100cqh - var(--wc-label-h) - var(--wc-card-gap)) * 16 / 9);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      opacity: 1;
      transform: none;
      position: relative;
      z-index: 1;
      transition: transform var(--wc-hover-dur) var(--wc-hover-ease);
    }
    .work-card-wrap:hover {
      z-index: 50;
    }

    /* While scrolling: kill hover zoom / video / peer motion (less lag) */
    .work-showcase.work-hover-paused .work-card-wrap,
    .work-showcase.work-hover-paused .wc-tilt {
      transition: none !important;
    }
    .work-showcase.work-hover-paused .work-card-wrap .wc-tilt,
    .work-showcase.work-hover-paused .work-card-wrap:hover .wc-tilt {
      transform: none !important;
    }
    .work-showcase.work-hover-paused .work-card-wrap .wc-hover-video {
      opacity: 0 !important;
    }
    .work-showcase.work-hover-paused .work-card-wrap .wc-card-poster {
      opacity: 1 !important;
    }

    /* ── CARD HEADER: label above thumb (no vertical shift on hover) ── */
    .wc-header {
      flex: 0 0 auto;
      min-height: var(--wc-label-h);
      padding-top: 0;
      font-family: Micross, Arial, sans-serif;
      min-width: 0;
      text-align: center;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    .wc-label {
      font: 400 1em/1.3 Micross, Arial, sans-serif;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      display: block;
      max-width: 100%;
    }
    .work-card-wrap:hover .wc-label {
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }
    .wc-label-client {
      opacity: 0.6;
      color: #fff;
    }
    .wc-label-sep { opacity: 0.35; color: #fff; }
    .wc-label-title {
      color: #fff;
      font-weight: 400;
      -webkit-text-stroke-width: 0.01em;
    }

    /* ── CARD THUMBNAIL ─────────────────────────────────── */
    .wc-tilt {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--wc-card-gap);
      overflow: visible;
      transform: translateZ(0);
      transform-origin: 50% calc((100% - var(--wc-label-h) - var(--wc-card-gap)) * 0.5);
      transition: transform var(--wc-hover-dur) var(--wc-hover-ease);
    }

    @supports not (container-type: size) {
      .work-card-wrap {
        height: 100%;
        width: min(185px, 26vw);
      }
    }
    /* Thumbnail cell stays 16:9 from layout; uniform scale() preserves aspect ratio. */
    .work-card {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    .work-card-wrap:hover .work-card {
      overflow: visible;
    }
    .work-card .wc-hover-video,
    .work-card .wc-card-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .work-card .wc-hover-video {
      z-index: 1;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .work-card .wc-card-poster {
      z-index: 2;
      opacity: 1;
      transition: opacity 0.55s cubic-bezier(0.33, 1, 0.68, 1);
    }
    .work-card-wrap.wc-hover-active .wc-hover-video {
      opacity: 1;
    }
    .work-card::before { display: none; }

    /* Hover overlay */
    .work-card::after {
      content: ''; position: absolute; inset: 0; z-index: 3;
      background: rgba(0,0,0,0);
      transition: background 0.3s ease;
    }
    .work-card-wrap:hover .work-card::after {
      background: rgba(0,0,0,0.18);
    }

    /* Peer motion is applied via JS (radial translate); no scale on siblings */

    /* Animation 2 overlay (used as controlled thumbnail load window) */
    #page-out {
      overflow: visible;
    }
    #page-out-logo {
      position: absolute; bottom: 36px; left: 44px; width: 72px;
      display: block; filter: invert(1); pointer-events: none;
      opacity: 1;
      transform: translateZ(0);
    }

    /* ── MOBILE (ref: Work - bold dividers mobile) ─────────── */
    @media (max-width: 760px) {
      html, body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      nav {
        height: auto;
        min-height: 52px;
        padding: 14px 20px 16px;
      }
      .nav-logo img { height: 24px; }
      .nav-links { gap: 18px; }
      .nav-links a { font-size: 10px; letter-spacing: 0.16em; }

      .work-fade-text,
      .work-fade-right { display: none; }

      .work-showcase {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        height: auto;
        max-height: none;
        margin-top: 0;
        padding: calc(var(--nav-h) + 12px) 0 40px;
        gap: 0;
        overflow: visible;
      }

      .work-row {
        flex: none;
        min-height: auto;
        margin-bottom: 56px;
        opacity: 1;
        transform: none;
        will-change: auto;
      }
      .work-row.wc-row-in {
        opacity: 1;
        transform: none;
        transition: none;
      }

      .work-row-header {
        width: auto;
        margin: 0 20px 8px;
        padding: 0 0 12px;
        gap: 12px;
      }
      .work-row-header__left { gap: 12px; }
      .work-row-num {
        font-size: 0.85em;
        letter-spacing: 0;
      }
      .work-row-cat {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      .work-row-cards {
        container-type: normal;
        flex: none;
        min-height: auto;
        align-items: stretch;
        gap: 18px;
        margin-top: 0;
        padding: 0 20px;
        padding-top: 0;
        padding-right: 20px;
        overflow-x: auto;
        overflow-y: visible;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .work-card-wrap {
        flex: 0 0 78%;
        width: 78%;
        height: auto;
        max-height: none;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      .work-card-wrap[data-clone] { display: none !important; }

      .wc-tilt { gap: 12px; }

      .work-card {
        flex: none;
        width: 100%;
        min-height: 0;
        aspect-ratio: 16 / 9;
      }

      .wc-header {
        min-height: 0;
        text-align: left;
        justify-content: flex-start;
      }
      .wc-label {
        font-size: 0.85em;
        letter-spacing: 0;
        text-align: left;
        white-space: normal;
      }
      .wc-label-client {
        opacity: 0.4;
      }
      .work-card-wrap:hover .wc-label {
        white-space: normal;
      }

      .wc-tilt,
      .work-card-wrap:hover .wc-tilt {
        transform: none !important;
      }

      .work-card,
      .work-card-wrap:hover .work-card {
        overflow: hidden;
      }

    }

  const CDN = window.__WORK_DATA.CDN;
  const THUMBNAILS = window.__WORK_DATA.THUMBNAILS;

  function decodeHTML(str) {
    return str.replace(/&amp;/g, '&')
      .replace(/&#x27;|&apos;/g, "'")
      .replace(/&quot;/g, '"');
  }

  function normalizeKey(title, client) {
    const clean = s => decodeHTML(s || '')
      .trim()
      .toLowerCase()
      .replace(/[''`]/g, '')
      .replace(/[""]/g, '"')
      .replace(/\s+/g, ' ')
      .replace(/\s*\/\s*/g, '/');
    return `${clean(title)}|${clean(client)}`;
  }

  function getPoster(title, client) {
    return THUMBNAILS[normalizeKey(title, client)];
  }

  // ── URL slug helpers (must match generate-projects.mjs) ──
  function slugify(s) {
    return s.toLowerCase()
      .replace(/[''`']/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '');
  }
  function projectURL(card, catLabel) {
    const catSlug  = slugify(catLabel);
    const projSlug = card.slug || slugify(card.title);
    return `/work/${catSlug}/${projSlug}/`;
  }

  const pageOut = document.getElementById('page-out');
  const MOBILE_WORK_MQ = window.matchMedia('(max-width: 760px)');

  function waitForGridReady() {
    // Wait for the actual in-DOM poster <img> elements to decode and be paint-ready.
    // Only check originals (not clones) — unique src means one decode covers all copies.
    const seen = new Set();
    const imgs = [];
    document.querySelectorAll('.wc-card-poster').forEach(function (img) {
      if (img.closest('[data-clone]')) return;
      if (!img.src || seen.has(img.src)) return;
      seen.add(img.src);
      imgs.push(img);
    });
    if (!imgs.length) return Promise.resolve();
    const decodes = imgs.map(function (img) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      if (img.decode) return img.decode().catch(function () {});
      return new Promise(function (res) {
        img.addEventListener('load', res, { once: true });
        img.addEventListener('error', res, { once: true });
      });
    });
    // Never stall the page more than 6 s if something fails to load.
    const bail = new Promise(function (res) { setTimeout(res, 6000); });
    return Promise.race([Promise.allSettled(decodes), bail]);
  }

  /** Loop only a time range on hover video (e.g. Atomic / Into the Void 24s–33s). */
  if (showcase) {
    showcase.addEventListener('loadedmetadata', function (e) {
      const v = e.target;
      if (!v.classList || !v.classList.contains('wc-hover-video')) return;
      const s = parseFloat(v.dataset.clipStart, 10);
      if (Number.isNaN(s)) return;
      v.currentTime = s;
    }, true);
    showcase.addEventListener('timeupdate', function (e) {
      const v = e.target;
      if (!v.classList || !v.classList.contains('wc-hover-video')) return;
      const s = parseFloat(v.dataset.clipStart, 10);
      const end = parseFloat(v.dataset.clipEnd, 10);
      if (Number.isNaN(s) || Number.isNaN(end)) return;
      if (v.currentTime >= end) v.currentTime = s;
    }, true);
  }

  function startRowStagger(durMs) {
    var rows = showcase ? showcase.querySelectorAll('.work-row') : [];
    if (isMobileWorkLayout()) {
      Array.prototype.forEach.call(rows, function (row) {
        row.classList.add('wc-row-in');
        row.style.willChange = 'auto';
      });
      return;
    }
    // xyzstudios.co/projects: items use delay 0.1s + stagger 0.06s from "start" (top → bottom).
    // We were reversed (bottom rows first via rect.top) — that felt choppy vs the reference.
    var baseDelayMs = 100;
    var staggerMs = 100;
    Array.prototype.forEach.call(rows, function (row, rowIdx) {
      if (row.classList.contains('wc-row-in')) return;
      var delay = baseDelayMs + rowIdx * staggerMs;
      setTimeout(function () {
        row.classList.add('wc-row-in');
        row.addEventListener('transitionend', function cleanup(e) {
          if (e.propertyName !== 'opacity') return;
          row.style.willChange = 'auto';
          row.removeEventListener('transitionend', cleanup);
        });
      }, delay);
    });
  }

  function markWorkPageOpen() {
    document.body.classList.add('work-page-open');
    document.querySelectorAll('.work-card').forEach(function (el) {
      el.classList.add('wc-media-in');
    });
  }

  function scheduleCardReveal(div) {
    if (!div || div.classList.contains('wc-media-in')) return;
    div.removeAttribute('data-wc-pending');
    div.classList.add('wc-media-in');
  }

  function tryRevealCardMedia(div) {
    if (document.body.classList.contains('work-page-open')) {
      scheduleCardReveal(div);
    } else div.classList.add('wc-media-in');
  }

  function isReloadNavigation() {
    const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.type) return nav.type === 'reload';
    try { return !!(performance.navigation && performance.navigation.type === 1); } catch (e) { return false; }
  }

  function slideAwayPanel(fromCacheRestore) {
    if (!pageOut) {
      startRowStagger(null);
      markWorkPageOpen();
      return;
    }
    const dur = (!fromCacheRestore && isReloadNavigation()) ? '1.06s' : '0.58s';
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(0)';
    pageOut.style.pointerEvents = 'none';
    let done = false;
    function finishOpen() {
      if (done) return;
      done = true;
      pageOut.removeEventListener('transitionend', onEnd);
      clearTimeout(fallback);
      markWorkPageOpen();
    }
    function onEnd(e) {
      if (e.target !== pageOut || e.propertyName !== 'transform') return;
      finishOpen();
    }
    pageOut.addEventListener('transitionend', onEnd);
    const fallback = setTimeout(finishOpen, parseFloat(dur) * 1000 + 120);
    const durMs = parseFloat(dur) * 1000;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        pageOut.style.transition = 'transform ' + dur + ' cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(-100%)';
        // Schedule each row to animate the moment the overlay edge passes it.
        startRowStagger(durMs);
      });
    });
  }

  /** Animation 2 navigation transition */
  function navigateTo(url, poster) {
    const dest = poster ? url + '?poster=' + encodeURIComponent(poster) : url;
    if (!pageOut) {
      window.location.href = dest;
      return;
    }
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(100%)';
    pageOut.style.pointerEvents = 'all';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        let done = false;
        function finish() {
          if (done) return;
          done = true;
          window.location.href = dest;
        }
        function onEnd(e) {
          if (e.target !== pageOut || e.propertyName !== 'transform') return;
          pageOut.removeEventListener('transitionend', onEnd);
          clearTimeout(fallback);
          finish();
        }
        const fallback = setTimeout(() => {
          pageOut.removeEventListener('transitionend', onEnd);
          finish();
        }, 750);
        pageOut.addEventListener('transitionend', onEnd);
        pageOut.style.transition = 'transform 0.48s cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(0)';
      });
    });
  }

  /** Keep in sync with :root --wc-hover-max (gentler zoom than reference portfolios). */
  var WC_HOVER_SCALE_MAX = 1.12;
  var workHoverPaused = false;
  var workHoverResumeTimer = null;

  function pauseWorkHover() {
    workHoverPaused = true;
    if (showcase) showcase.classList.add('work-hover-paused');
    resetHoverState();
    if (workHoverResumeTimer) clearTimeout(workHoverResumeTimer);
  }

  function scheduleResumeWorkHover() {
    if (workHoverResumeTimer) clearTimeout(workHoverResumeTimer);
    workHoverResumeTimer = setTimeout(function () {
      workHoverPaused = false;
      if (showcase) showcase.classList.remove('work-hover-paused');
      workHoverResumeTimer = null;
    }, 220);
  }

  function bindRowScrollPause(rowCards) {
    if (!rowCards || rowCards.dataset.scrollPauseBound) return;
    rowCards.dataset.scrollPauseBound = '1';
    rowCards.addEventListener('scroll', function () {
      pauseWorkHover();
      scheduleResumeWorkHover();
    }, { passive: true });
  }

  function clearPeerRadialPush() {
    if (!showcase) return;
    showcase.querySelectorAll('.work-card-wrap').forEach(function (w) {
      w.style.transform = '';
    });
  }

  function resetHoverState() {
    clearPeerRadialPush();
    if (!showcase) return;
    showcase.querySelectorAll('.work-card-wrap').forEach(function (wrap) {
      wrap.classList.remove('wc-hover-active');
      var tilt = wrap.querySelector('.wc-tilt');
      if (tilt) {
        tilt.style.transform = '';
        tilt.style.transformOrigin = '';
      }
      var card = wrap.querySelector('.work-card');
      var video = card && card.querySelector('.wc-hover-video');
      if (video) video.pause();
      var img = card && card.querySelector('.wc-card-poster');
      if (img) img.style.opacity = '';
    });
  }

  var WORK_SCRUB_LOOPS = 2;

  function bindRowScrub(scrub, rowCards, loopState) {
    if (!scrub || !rowCards || scrub.dataset.bound) return;
    scrub.dataset.bound = '1';
    var track = scrub.querySelector('.work-row-scrub__track');
    var fill = scrub.querySelector('.work-row-scrub__fill');
    if (!track || !fill) return;

    function scrubDen() {
      if (loopState && loopState.loopW) return loopState.loopW * WORK_SCRUB_LOOPS;
      var max = rowCards.scrollWidth - rowCards.clientWidth;
      return max > 0 ? max * WORK_SCRUB_LOOPS : 1;
    }

    function scrubOrigin() {
      if (loopState && loopState.loopW) return loopState.loopW;
      return 0;
    }

    function getFrac() {
      var origin = scrubOrigin();
      var pos = loopState && loopState.loopW != null ? loopState.pos : rowCards.scrollLeft;
      return Math.max(0, Math.min(1, (pos - origin) / scrubDen()));
    }

    function renderScrub() {
      var frac = getFrac();
      fill.style.transform = 'scaleX(' + frac + ')';
      track.setAttribute('aria-valuenow', String(Math.round(frac * 100)));
    }

    function applyFrac(frac) {
      frac = Math.max(0, Math.min(1, frac));
      var p = scrubOrigin() + frac * scrubDen();
      if (loopState && loopState.loopW) {
        loopState.pos = p;
        loopState.target = p;
        loopState.animFrom = p;
        rowCards.scrollLeft = p;
      } else {
        rowCards.scrollLeft = p;
      }
      renderScrub();
    }

    function fracFromClientX(clientX) {
      var r = track.getBoundingClientRect();
      if (r.width <= 0) return 0;
      return (clientX - r.left) / r.width;
    }

    track.addEventListener('click', function (e) {
      pauseWorkHover();
      scheduleResumeWorkHover();
      applyFrac(fracFromClientX(e.clientX));
    });

    var dragging = false;
    function onMove(clientX) {
      if (!dragging) return;
      pauseWorkHover();
      scheduleResumeWorkHover();
      applyFrac(fracFromClientX(clientX));
    }
    track.addEventListener('mousedown', function (e) {
      e.preventDefault();
      dragging = true;
      scrub.classList.add('is-dragging');
      pauseWorkHover();
      applyFrac(fracFromClientX(e.clientX));
    });
    window.addEventListener('mousemove', function (e) { onMove(e.clientX); });
    window.addEventListener('mouseup', function () {
      dragging = false;
      scrub.classList.remove('is-dragging');
    });
    track.addEventListener('touchstart', function (e) {
      dragging = true;
      scrub.classList.add('is-dragging');
      pauseWorkHover();
      if (e.touches[0]) applyFrac(fracFromClientX(e.touches[0].clientX));
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (!dragging || !e.touches[0]) return;
      onMove(e.touches[0].clientX);
    }, { passive: true });
    window.addEventListener('touchend', function () {
      dragging = false;
      scrub.classList.remove('is-dragging');
    });

    rowCards.addEventListener('scroll', renderScrub, { passive: true });
    if (loopState) loopState.onScroll = renderScrub;
    fill.style.transform = 'scaleX(0)';
    track.setAttribute('aria-valuenow', '0');
    renderScrub();
  }

  /** Horizontal nudge only — no vertical push (was causing row jitter). */
  function applyPeerRadialPush(activeWrap, scaleFactor) {
    if (!showcase || !activeWrap || workHoverPaused) return;
    var ar = activeWrap.getBoundingClientRect();
    var hc = { x: ar.left + ar.width / 2 };
    var base = Math.min(ar.width, ar.height);
    var pushMax = Math.max(12, (scaleFactor - 1) * base * 0.45);
    var falloffDen = Math.max(base * 1.2, window.innerWidth * 0.22);
    var rowCards = activeWrap.closest('.work-row-cards');
    if (!rowCards) return;
    rowCards.querySelectorAll('.work-card-wrap').forEach(function (w) {
      if (w === activeWrap) return;
      var wr = w.getBoundingClientRect();
      var dx = (wr.left + wr.width / 2) - hc.x;
      var dist = Math.abs(dx);
      if (dist < 0.5) return;
      var falloff = 1 / (1 + dist / falloffDen);
      var push = pushMax * falloff;
      var pushX = (dx >= 0 ? 1 : -1) * push;
      w.style.transform = 'translate(' + pushX.toFixed(2) + 'px, 0)';
    });
  }

  /** Static poster + hidden video (plays on hover). */
  function appendCardMedia(div, card, opts) {
    opts = opts || {};
    const posterSrc = getPoster(card.title, card.client) || FALLBACK_IMG;

    const video = document.createElement('video');
    video.className = 'wc-hover-video';
    video.dataset.src = card.video;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    // Do not load video bytes until hover; keeps initial page fast/stable.
    video.preload = 'none';
    if (card.clipStart != null && card.clipEnd != null) {
      video.dataset.clipStart = String(card.clipStart);
      video.dataset.clipEnd = String(card.clipEnd);
    }

    const img = document.createElement('img');
    img.className = 'wc-card-poster';
    img.src = posterSrc;
    img.alt = `${card.client} — ${card.title}`;
    // Keep poster paint deterministic during initial reveal window.
    img.loading = 'eager';
    img.decoding = 'sync';
    img.fetchPriority = opts && opts.fetchPriority === 'high' ? 'high' : 'auto';

    img.addEventListener('error', function () {
      img.src = FALLBACK_IMG;
    }, { once: true });

    div.appendChild(video);
    div.appendChild(img);

    // Reveal cards immediately (staggered) instead of blocking on image decode.
    tryRevealCardMedia(div);
  }

  function bindWorkCardHover() {
    if (!window.matchMedia || !window.matchMedia('(hover: hover)').matches) return;
    if (!showcase) return;
    showcase.querySelectorAll('.work-card-wrap').forEach((wrap) => {
      if (wrap.dataset.hoverBound) return;
      const card = wrap.querySelector('.work-card');
      const tilt = wrap.querySelector('.wc-tilt');
      const video = card && card.querySelector('.wc-hover-video');
      const img = card && card.querySelector('.wc-card-poster');
      if (!card || !tilt || !video) return;
      wrap.dataset.hoverBound = '1';

      function applyHoverScale() {
        var s = WC_HOVER_SCALE_MAX;
        tilt.style.transform = 'translateZ(0) scale(' + s + ')';
        return s;
      }

      wrap.addEventListener('mouseenter', () => {
        if (workHoverPaused) return;
        const s = applyHoverScale();
        wrap.classList.add('wc-hover-active');
        applyPeerRadialPush(wrap, s);
        video.muted = true;
        if (!video.src && video.dataset.src) {
          video.src = video.dataset.src;
          video.load();
        }
        const clipS = parseFloat(video.dataset.clipStart, 10);
        if (!Number.isNaN(clipS)) video.currentTime = clipS;
        video.play().catch(function () {});
        if (img) img.style.opacity = '0';
      });
      wrap.addEventListener('mouseleave', () => {
        clearPeerRadialPush();
        wrap.classList.remove('wc-hover-active');
        tilt.style.transform = '';
        video.pause();
        const clipS = parseFloat(video.dataset.clipStart, 10);
        video.currentTime = Number.isNaN(clipS) ? 0 : clipS;
        if (img) img.style.opacity = '';
      });
    });
  }

  // ── BUILD DOM ──────────────────────────────────────────

  function buildWorkGrid() {
  try {

  const CAT_LABELS = {
    'Visual Effects': 'VISUAL',
    'Sound': 'SOUND',
    'AI': 'AI',
    // 'Making Of': 'MAKING OF',
  };

  if (!showcase) {
    console.error('[work] #showcase missing');
  }
  if (showcase) {
  var revealOrderBase = 0;
  const workRowTotal = ROWS.length;
  ROWS.forEach((rowData, rowIdx) => {
    const row = document.createElement('div');
    row.className = 'work-row';
    row.dataset.label = rowData.label;
    row.dataset.rowIdx = String(rowIdx);

    const rowHeader = document.createElement('div');
    rowHeader.className = 'work-row-header';
    const rowNum = String(rowIdx + 1).padStart(2, '0');
    const rowTotal = String(workRowTotal).padStart(2, '0');
    const rowCat = CAT_LABELS[rowData.label] || rowData.label.toUpperCase();
    rowHeader.innerHTML = `
      <div class="work-row-header__left">
        <span class="work-row-num">${rowNum} / ${rowTotal}</span>
        <h2 class="work-row-cat">${rowCat}</h2>
      </div>
      <div class="work-row-scrub" aria-hidden="false">
        <div class="work-row-scrub__track" role="slider" aria-label="Browse projects in this row" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="work-row-scrub__fill"></div>
        </div>
      </div>
    `;

    const rowCards = document.createElement('div');
    rowCards.className = 'work-row-cards';

    const rowCardCount = rowData.cards.length;
    rowData.cards.forEach((card, cardIdx) => {
      const numStr = String(cardIdx + 1).padStart(2, '0');
      /* Only the first row’s first tiles are above the fold — load those eagerly; rest lazy to cut initial bytes & decode work. */
      const priority = rowIdx === 0 && cardIdx < 8;
      const mediaOpts = {
        fetchPriority: priority ? 'high' : 'low',
        loading: priority ? 'eager' : 'lazy',
      };

      const wrap = document.createElement('div');
      wrap.className = 'work-card-wrap';
      wrap.dataset.rowLabel = rowData.label;

      const header = document.createElement('div');
      header.className = 'wc-header';
      header.innerHTML = `<span class="wc-label"><span class="wc-label-client">${card.client}</span><span class="wc-label-sep"> — </span><span class="wc-label-title">${card.title}</span></span>`;

      const div = document.createElement('div');
      div.className = 'work-card';
      const revealIndex = (rowIdx % 2 === 0) ? cardIdx : (rowCardCount - 1 - cardIdx);
      div.dataset.wcOrder = String(revealOrderBase + revealIndex);

      appendCardMedia(div, card, mediaOpts);

      const tiltWrap = document.createElement('div');
      tiltWrap.className = 'wc-tilt';
      tiltWrap.appendChild(div);
      tiltWrap.appendChild(header);
      wrap.appendChild(tiltWrap);

      const curatedNavPoster = getPoster(card.title, card.client);
      wrap.addEventListener('click', () => {
        navigateTo(projectURL(card, rowData.label), curatedNavPoster || undefined);
      });

      rowCards.appendChild(wrap);
    });
    revealOrderBase += rowCardCount;

    row.appendChild(rowHeader);
    row.appendChild(rowCards);
    showcase.appendChild(row);
  });
  }

    // ── HORIZONTAL ROWS ─────────────────────
  document.querySelectorAll('.work-row-cards').forEach(rowCards => {
    const originals = Array.from(rowCards.querySelectorAll('.work-card-wrap:not([data-clone])'));
    if (!originals.length) return;

    if (isMobileWorkLayout()) return;

    // Infinite strip: clone right and left so snap motion is continuous.
    originals.forEach(orig => {
      const c = orig.cloneNode(true); c.dataset.clone='1'; rowCards.appendChild(c);
    });
    [...originals].reverse().forEach(orig => {
      const c = orig.cloneNode(true); c.dataset.clone='1';
      rowCards.insertBefore(c, rowCards.firstChild);
    });

    rowCards.querySelectorAll('[data-clone]').forEach(c => {
      c.style.transition = 'none';
      c.style.opacity = '1';
      c.style.transform = 'none';
    });
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        rowCards.querySelectorAll('[data-clone]').forEach(c => {
          c.style.removeProperty('transition');
        });
      });
    });

    // Re-attach click on clones
    rowCards.querySelectorAll('.work-card-wrap[data-clone]').forEach(cloneWrap => {
      const ec = cloneWrap.querySelector('.wc-label-client');
      const et = cloneWrap.querySelector('.wc-label-title');
      const cloneClient = ec && ec.textContent ? ec.textContent.trim() : '';
      const cloneTitle = et && et.textContent ? et.textContent.trim() : '';
      const cloneCat = cloneWrap.dataset.rowLabel || '';
      cloneWrap.style.cursor = 'pointer';
      cloneWrap.addEventListener('click', () => {
        const row = ROWS.find(r => r.label === cloneCat);
        const card = row && row.cards ? row.cards.find(c => c.client === cloneClient && c.title === cloneTitle) : null;
        if (card) navigateTo(projectURL(card, cloneCat), getPoster(card.title, card.client) || undefined);
      });
    });

    let loopW = 0, pos = 0, target = 0, animFrom = 0, animStart = 0, raf = null, locked = false;
    const loopState = { loopW: 0, pos: 0, target: 0, animFrom: 0, onScroll: null };
    const rowEl = rowCards.closest('.work-row');
    const DURATION = 900;

    function easeInOut(t) { return 1 - Math.pow(1 - t, 4); }
    function wrapPos() {
      if (pos < loopW * 0.1) { pos += loopW; target += loopW; animFrom += loopW; }
      if (pos > loopW * (WORK_SCRUB_LOOPS + 0.95)) { pos -= loopW; target -= loopW; animFrom -= loopW; }
    }
    function snapTick() {
      const t = Math.min((performance.now() - animStart) / DURATION, 1);
      pos = animFrom + (target - animFrom) * easeInOut(t);
      wrapPos();
      loopState.pos = pos;
      loopState.target = target;
      loopState.animFrom = animFrom;
      rowCards.scrollLeft = pos;
      if (loopState.onScroll) loopState.onScroll();
      if (t < 1) { raf = requestAnimationFrame(snapTick); }
      else { pos = target; wrapPos(); loopState.pos = pos; rowCards.scrollLeft = pos; if (loopState.onScroll) loopState.onScroll(); raf = null; setTimeout(() => { locked = false; }, 500); }
    }
    function startSnap(dir) {
      if (locked) return;
      pauseWorkHover();
      scheduleResumeWorkHover();
      locked = true;
      const cardEl = rowCards.querySelector('.work-card-wrap');
      const cardW = cardEl ? cardEl.offsetWidth + 16 : 260;
      animFrom = pos; animStart = performance.now(); target = pos + dir * cardW * 2;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(snapTick);
    }

    rowCards.addEventListener('wheel', e => {
      pauseWorkHover();
      scheduleResumeWorkHover();
      e.preventDefault();
      e.stopPropagation();
      if (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
        startSnap(e.deltaY > 0 ? 1 : -1);
      } else {
        startSnap(e.deltaX > 0 ? 1 : -1);
      }
    }, { passive: false });

    bindRowScrollPause(rowCards);

    let touchScrubRaf = null;
    function touchScrubSync() {
      if (loopState.onScroll) loopState.onScroll();
      touchScrubRaf = requestAnimationFrame(touchScrubSync);
    }
    function startTouchScrubSync() {
      if (!touchScrubRaf) touchScrubRaf = requestAnimationFrame(touchScrubSync);
    }
    function stopTouchScrubSync() {
      if (touchScrubRaf) {
        cancelAnimationFrame(touchScrubRaf);
        touchScrubRaf = null;
      }
      if (loopState.onScroll) loopState.onScroll();
    }

    let tx0 = 0, tx1 = 0;
    rowCards.addEventListener('touchstart', e => {
      pauseWorkHover();
      tx0 = tx1 = e.touches[0].clientX;
      startTouchScrubSync();
    }, { passive: true });
    rowCards.addEventListener('touchmove', e => {
      const dx = tx1 - e.touches[0].clientX;
      tx1 = e.touches[0].clientX;
      pos += dx; loopState.pos = pos; wrapPos(); rowCards.scrollLeft = pos;
      scheduleResumeWorkHover();
    }, { passive: true });
    rowCards.addEventListener('touchend', e => {
      stopTouchScrubSync();
      const dx = tx0 - e.changedTouches[0].clientX;
      if (Math.abs(dx) > 30) startSnap(dx > 0 ? 1 : -1);
    }, { passive: true });

    requestAnimationFrame(() => {
      loopW = rowCards.scrollWidth / 3;
      pos = loopW; target = loopW; animFrom = loopW;
      loopState.loopW = loopW;
      loopState.pos = pos;
      loopState.target = target;
      loopState.animFrom = animFrom;
      rowCards.scrollLeft = pos;
      var scrubEl = rowEl && rowEl.querySelector('.work-row-scrub');
      bindRowScrub(scrubEl, rowCards, loopState);
      if (scrubEl && loopState.onScroll) loopState.onScroll();
    });

    const row = rowEl;
    const rowCat = row ? row.querySelector('.work-row-cat') : null;
    if (rowCat) {
      rowCat.addEventListener('click', function (e) {
        e.preventDefault();
        // No category spin animation.
      });
    }
  });

  document.querySelectorAll('.work-row').forEach(function (row) {
    var cards = row.querySelector('.work-row-cards');
    var scrub = row.querySelector('.work-row-scrub');
    if (cards && scrub && !scrub.dataset.bound) {
      cards.scrollLeft = 0;
      bindRowScrub(scrub, cards, null);
      bindRowScrollPause(cards);
    }
  });

  if (showcase && !showcase.dataset.wheelBound) {
    showcase.dataset.wheelBound = '1';
    showcase.addEventListener('wheel', function (e) {
      if (!e.target.closest('.work-row-cards')) return;
      e.preventDefault();
    }, { passive: false, capture: true });
  }

  bindWorkCardHover();

  // ── TOP FADE (no vertical scroll on work grid; stays hidden) ─
  const fadeTop = document.querySelector('.work-fade-top');
  if (fadeTop) fadeTop.style.opacity = '0';

  } finally {}

  document.addEventListener('click', (e) => {
    const a = e.target.closest('nav a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;
    if (/mailto:|tel:/i.test(href)) return;
    let u;
    try { u = new URL(href, location.href); } catch (x) { return; }
    if (u.origin !== location.origin) return;
    if (u.pathname === location.pathname && !u.search) return;
    e.preventDefault();
    navigateTo(u.pathname + u.search + u.hash);
  }, true);
  }

  buildWorkGrid();
  slideAwayPanel();
  waitForGridReady().catch(function () {});
  window.addEventListener('pageshow', function (e) { if (e.persisted) slideAwayPanel(true); });
</script>
