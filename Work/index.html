  <link rel="stylesheet" href="/assets/xyz-nav-font.css">
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('https://cdn.prod.website-files.com/6917408c1d0fee8fc2c58505/697ad8d7e20ca4c6f2870246_micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h:    clamp(52px, 9vh, 80px);
      --row-gap:  clamp(4px, min(1.4vh, 2.5vw), 52px);
      --card-gap: clamp(20px, 3.5vw, 48px);
      --col-pad:  24px;
      /* Reserve space for title row under each thumbnail (must match .wc-header) */
      --wc-label-h: clamp(24px, 3.6vh, 46px);
      /* Space between video thumb and title (included in 16:9 width calc) */
      --wc-card-gap: clamp(12px, 2vh, 22px);
      /* Hover zoom; neighbors move away (no peer down-scale) */
      --wc-hover-max: 1.12;
      --work-divider: rgba(255, 255, 255, 0.14);
      --work-row-edge-pad: clamp(16px, 4vw, 48px);
      --wc-hover-ease: cubic-bezier(0.33, 1, 0.68, 1);
      --wc-hover-dur: 0.68s;
      --wc-scroll-release-dur: 0.42s;
    }

    html {
      background: #000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: hidden;
      height: 100%;
    }

    body {
      font-family: Micross, Arial, sans-serif;
      font-size: clamp(9.6px, 1vw, 11.2px);
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* ── NAV ──────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      background: transparent !important;
    }
    .nav-logo img { height: 29px; width: auto; display: block; }

    /* ── SHOWCASE — 4 rows always fit in viewport (no vertical page scroll) ─ */
    .work-showcase {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      height: calc(100vh - var(--nav-h));
      height: calc(100dvh - var(--nav-h));
      max-height: calc(100dvh - var(--nav-h));
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);
      padding: clamp(6px, 1.2vh, 28px) clamp(16px, 4vw, 48px) clamp(4px, 0.8vh, 20px);
      /* visible so scaled thumbs + titles are not clipped (html/body already lock scroll) */
      overflow: visible;
      background: #000;
      z-index: 1;
    }

    /* ── ROW HEADER (bold divider + index, ref: Work - bold dividers) ─ */
    .work-row-header {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-end;
      width: 100%;
      gap: clamp(10px, 1.2vh, 16px);
      padding: 0 0 clamp(8px, 0.9vh, 14px);
      margin-bottom: clamp(2px, 0.35vh, 6px);
      box-sizing: border-box;
    }
    .work-row-header__left {
      display: flex;
      align-items: baseline;
      gap: clamp(12px, 2vw, 24px);
      min-width: 0;
    }
    .work-row-num {
      font: 400 1em/1 Micross, Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .work-row-cat {
      margin: 0;
      font-family: Micross, Arial, sans-serif;
      font-size: clamp(24px, 3.8vh, 48px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #fff;
      cursor: default;
    }
    /* Row scrub — single line under title (replaces separate divider + scrub) */
    .work-row-scrub {
      flex: 0 0 auto;
      width: 100%;
      padding: 0;
      box-sizing: border-box;
    }
    .work-row-scrub__track {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 1px;
      background: var(--work-divider);
      cursor: grab;
      touch-action: none;
    }
    .work-row-scrub__track:active { cursor: grabbing; }
    .work-row-scrub__fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.42);
      pointer-events: none;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.33, 1, 0.68, 1);
    }
    .work-row-scrub.is-snapping .work-row-scrub__fill,
    .work-row-scrub.is-dragging .work-row-scrub__fill {
      transition: none;
    }

    .work-row {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.45vh, 6px);
    }

    /* ── TOP GRADIENT OVERLAY (behind nav, over thumbnails) ─ */
    .work-fade-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* ── TEXT FADE — soft edge at top of showcase (keep visuals visible) ─ */
    .work-fade-text {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0;
      height: 36px;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.22) 0%,
        rgba(0, 0, 0, 0.06) 55%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ── RIGHT FADE OVERLAY ──────────────────────────────── */
    .work-fade-right {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 120px;
      background: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 50%, #000 100%);
      pointer-events: none;
      z-index: 500;
    }

    .work-row-cards {
      container-type: size;
      container-name: work-row-strip;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      gap: var(--card-gap);
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: none;
      touch-action: pan-x;
      padding-top: clamp(2px, 0.5vh, 8px);
      margin-top: 0;
      padding-bottom: 2px;
      padding-right: var(--work-row-edge-pad);
      scrollbar-width: none;
    }
    .work-row-cards::-webkit-scrollbar { display: none; }

    /* ── ROW ENTRANCE ANIMATION ─────────────────────────── */
    .work-row {
      opacity: 0;
      transform: translateY(12rem);
      will-change: transform, opacity;
    }
    .work-row.wc-row-in {
      opacity: 1;
      transform: translateY(0);
      /* xyzstudios.co/projects items: 12rem → 0, 1.2s power3.inOut */
      transition:
        opacity   1.2s cubic-bezier(0.65, 0, 0.35, 1),
        transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ── CARD WRAP — height from row strip; width = 16:9 of thumb area ─ */
    .work-card-wrap {
      flex: 0 0 auto;
      height: 100cqh;
      max-height: 100%;
      width: calc((100cqh - var(--wc-label-h) - var(--wc-card-gap)) * 16 / 9);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      opacity: 1;
      transform: none;
      position: relative;
      z-index: 1;
      transition: transform var(--wc-hover-dur) var(--wc-hover-ease);
    }
    .work-card-wrap:hover {
      z-index: 50;
    }

    /* Instant reset when not animating release (touch scrub, etc.) */
    .work-showcase.work-hover-paused:not(.work-scroll-releasing) .work-card-wrap,
    .work-showcase.work-hover-paused:not(.work-scroll-releasing) .wc-tilt {
      transition: none !important;
    }
    .work-showcase.work-hover-paused:not(.work-scroll-releasing) .work-card-wrap .wc-tilt,
    .work-showcase.work-hover-paused:not(.work-scroll-releasing) .work-card-wrap:hover .wc-tilt {
      transform: none !important;
    }
    .work-showcase.work-hover-paused:not(.work-scroll-releasing) .work-card-wrap .wc-hover-video {
      opacity: 0 !important;
    }
    .work-showcase.work-hover-paused:not(.work-scroll-releasing) .work-card-wrap .wc-card-poster {
      opacity: 1 !important;
    }
    /* Wheel snap: zoom out in parallel with horizontal scroll (JS sets inline transform) */
    .work-showcase.work-scroll-releasing .work-card-wrap .wc-tilt {
      transition: transform var(--wc-scroll-release-dur) var(--wc-hover-ease) !important;
    }
    .work-showcase.work-scroll-releasing .work-card-wrap .wc-hover-video {
      transition: opacity var(--wc-scroll-release-dur) ease !important;
    }
    .work-showcase.work-scroll-releasing .work-card-wrap .wc-card-poster {
      transition: opacity var(--wc-scroll-release-dur) var(--wc-hover-ease) !important;
    }

    /* ── CARD HEADER: label above thumb (no vertical shift on hover) ── */
    .wc-header {
      flex: 0 0 auto;
      min-height: var(--wc-label-h);
      padding-top: 0;
      font-family: Micross, Arial, sans-serif;
      min-width: 0;
      text-align: center;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    .wc-label {

      text-overflow: ellipsis;

      display: block;
      max-width: 100%;
    }
    .work-card-wrap:hover .wc-label {

    .wc-label-client {

    .wc-label-title {

    }

    /* ── CARD THUMBNAIL ─────────────────────────────────── */
    .wc-tilt {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--wc-card-gap);
      overflow: visible;
      transform: translateZ(0);
      transform-origin: 50% calc((100% - var(--wc-label-h) - var(--wc-card-gap)) * 0.5);
      transition: transform var(--wc-hover-dur) var(--wc-hover-ease);
    }

    @supports not (container-type: size) {

    .work-card-wrap:hover .work-card {

  const CDN = window.__WORK_DATA.CDN;
  const THUMBNAILS = window.__WORK_DATA.THUMBNAILS;

  function decodeHTML(str) {
    return str.replace(/&amp;/g, '&')
      .replace(/&#x27;|&apos;/g, "'")
      .replace(/&quot;/g, '"');
  }

  function normalizeKey(title, client) {
    const clean = s => decodeHTML(s || '')
      .trim()
      .toLowerCase()
      .replace(/[''`]/g, '')
      .replace(/[""]/g, '"')
      .replace(/\s+/g, ' ')
      .replace(/\s*\/\s*/g, '/');
    return `${clean(title)}|${clean(client)}`;
  }

  function getPoster(title, client) {
    return THUMBNAILS[normalizeKey(title, client)];
  }

  // ── URL slug helpers (must match generate-projects.mjs) ──
  function slugify(s) {
    return s.toLowerCase()
      .replace(/[''`']/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '');
  }
  function projectURL(card, catLabel) {
    const catSlug  = slugify(catLabel);
    const projSlug = card.slug || slugify(card.title);
    return `/work/${catSlug}/${projSlug}/`;
  }

  const FALLBACK_IMG = CDN + '69c0bbd38bf9e9ecfb7c293b_final%20test1.mp4_snapshot_00.27.567.jpg';
  const showcase = document.getElementById('showcase');
  const pageOut = document.getElementById('page-out');
  const MOBILE_WORK_MQ = window.matchMedia('(max-width: 760px)');
  function isMobileWorkLayout() { return MOBILE_WORK_MQ.matches; }

  function waitForGridReady() {
    // Wait for the actual in-DOM poster <img> elements to decode and be paint-ready.
    // Only check originals (not clones) — unique src means one decode covers all copies.
    const seen = new Set();
    const imgs = [];
    document.querySelectorAll('.wc-card-poster').forEach(function (img) {
      if (img.closest('[data-clone]')) return;
      if (!img.src || seen.has(img.src)) return;
      seen.add(img.src);
      imgs.push(img);
    });
    if (!imgs.length) return Promise.resolve();
    const decodes = imgs.map(function (img) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      if (img.decode) return img.decode().catch(function () {});
      return new Promise(function (res) {
        img.addEventListener('load', res, { once: true });
        img.addEventListener('error', res, { once: true });
      });
    });
    // Never stall the page more than 6 s if something fails to load.
    const bail = new Promise(function (res) { setTimeout(res, 6000); });
    return Promise.race([Promise.allSettled(decodes), bail]);
  }

  /** Loop only a time range on hover video (e.g. Atomic / Into the Void 24s–33s). */
  if (showcase) {
    showcase.addEventListener('loadedmetadata', function (e) {
      const v = e.target;
      if (!v.classList || !v.classList.contains('wc-hover-video')) return;
      const s = parseFloat(v.dataset.clipStart, 10);
      if (Number.isNaN(s)) return;
      v.currentTime = s;
    }, true);
    showcase.addEventListener('timeupdate', function (e) {
      const v = e.target;
      if (!v.classList || !v.classList.contains('wc-hover-video')) return;
      const s = parseFloat(v.dataset.clipStart, 10);
      const end = parseFloat(v.dataset.clipEnd, 10);
      if (Number.isNaN(s) || Number.isNaN(end)) return;
      if (v.currentTime >= end) v.currentTime = s;
    }, true);
  }

  function startRowStagger(durMs) {
    var rows = showcase ? showcase.querySelectorAll('.work-row') : [];
    if (isMobileWorkLayout()) {
      Array.prototype.forEach.call(rows, function (row) {
        row.classList.add('wc-row-in');
        row.style.willChange = 'auto';
      });
      return;
    }
    // Start the cascade AFTER the page-out overlay has fully lifted (so no row is still hidden),
    // then stagger TOP->BOTTOM in document order: VFX -> Sound -> AI. Every row gets a visible
    // slide-up + fade in the intended order.
    var baseDelayMs = (durMs || 600) + 60;
    var staggerMs = 180;
    Array.prototype.forEach.call(rows, function (row, rowIdx) {
      if (row.classList.contains('wc-row-in')) return;
      var delay = baseDelayMs + rowIdx * staggerMs;
      setTimeout(function () {
        row.classList.add('wc-row-in');
        row.addEventListener('transitionend', function cleanup(e) {
          if (e.propertyName !== 'opacity') return;
          row.style.willChange = 'auto';
          row.removeEventListener('transitionend', cleanup);
        });
      }, delay);
    });
  }

  function markWorkPageOpen() {
    document.body.classList.add('work-page-open');
    document.querySelectorAll('.work-card').forEach(function (el) {
      el.classList.add('wc-media-in');

  function scheduleCardReveal(div) {
    if (!div || div.classList.contains('wc-media-in')) return;
    div.removeAttribute('data-wc-pending');
    div.classList.add('wc-media-in');
  }

  function tryRevealCardMedia(div) {
    if (document.body.classList.contains('work-page-open')) {
      scheduleCardReveal(div);
    } else div.classList.add('wc-media-in');
  }

  function isReloadNavigation() {
    const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.type) return nav.type === 'reload';
    try { return !!(performance.navigation && performance.navigation.type === 1); } catch (e) { return false; }
  }

  function slideAwayPanel(fromCacheRestore) {
    if (!pageOut) {
      startRowStagger(null);
      markWorkPageOpen();
      return;
    }
    const dur = (!fromCacheRestore && isReloadNavigation()) ? '1.06s' : '0.58s';
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(0)';
    pageOut.style.pointerEvents = 'none';
    let done = false;
    function finishOpen() {
      if (done) return;
      done = true;
      pageOut.removeEventListener('transitionend', onEnd);
      clearTimeout(fallback);
      markWorkPageOpen();
    }
    function onEnd(e) {
      if (e.target !== pageOut || e.propertyName !== 'transform') return;
      finishOpen();
    }
    pageOut.addEventListener('transitionend', onEnd);
    const fallback = setTimeout(finishOpen, parseFloat(dur) * 1000 + 120);
    const durMs = parseFloat(dur) * 1000;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        pageOut.style.transition = 'transform ' + dur + ' cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(-100%)';
        // Schedule each row to animate the moment the overlay edge passes it.
        startRowStagger(durMs);
      });
    });
  }

  /** Animation 2 navigation transition */
  function navigateTo(url, poster) {
    const dest = poster ? url + '?poster=' + encodeURIComponent(poster) : url;
    if (!pageOut) {
      window.location.href = dest;
      return;
    }
    pageOut.style.transition = 'none';
    pageOut.style.transform = 'translateY(100%)';
    pageOut.style.pointerEvents = 'all';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        pageOut.style.transition = 'transform 0.48s cubic-bezier(0.76,0,0.24,1)';
        pageOut.style.transform = 'translateY(0)';
      });
    });
    // Match Home: fixed delay so cover completes before navigation (transitionend can fire early).
    setTimeout(function () { window.location.href = dest; }, 540);
  }

  /** Keep in sync with :root --wc-hover-max (gentler zoom than reference portfolios). */
  var WC_HOVER_SCALE_MAX = 1.12;
  var WORK_HOVER_RESUME_MS = 120;
  var WORK_HOVER_RELEASE_MS = 420;
  var workHoverPaused = false;
  var workHoverResumeTimer = null;
  var workHoverReleaseTimer = null;
  var workPointerX = 0;
  var workPointerY = 0;
  var workPointerTracking = false;

  function ensureWorkPointerTracking() {
    if (workPointerTracking) return;
    workPointerTracking = true;
    document.addEventListener('mousemove', function (e) {
      workPointerX = e.clientX;
      workPointerY = e.clientY;
    }, { passive: true });
  }

  function resumeWorkHoverUnderPointer() {
    if (!window.matchMedia || !window.matchMedia('(hover: hover)').matches) return;
    if (!showcase || workHoverPaused) return;
    var el = document.elementFromPoint(workPointerX, workPointerY);
    if (!el) return;
    var wrap = el.closest('.work-card-wrap');
    if (!wrap || !showcase.contains(wrap)) return;
    if (wrap.classList.contains('wc-hover-active')) return;
    wrap.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true, cancelable: true, view: window }));
  }

  function applyHoverLeave(wrap, animated) {
    if (!wrap) return;
    var card = wrap.querySelector('.work-card');
    var tilt = wrap.querySelector('.wc-tilt');
    var video = card && card.querySelector('.wc-hover-video');
    var img = card && card.querySelector('.wc-card-poster');
    var ease = 'cubic-bezier(0.33, 1, 0.68, 1)';
    var dur = animated ? WORK_HOVER_RELEASE_MS : 0;

    wrap.classList.remove('wc-hover-active');

    if (tilt) {
      if (animated) {
        tilt.style.transition = 'transform ' + dur + 'ms ' + ease;
        tilt.style.transform = 'translateZ(0) scale(1)';
      } else {
        tilt.style.transition = '';
        tilt.style.transform = '';
      }
    }
    if (video) {
      if (animated) video.style.transition = 'opacity 0.45s ease';
      else video.style.transition = '';
      video.pause();
      var clipS = parseFloat(video.dataset.clipStart, 10);
      video.currentTime = Number.isNaN(clipS) ? 0 : clipS;
    }
    if (img) {
      if (animated) {
        img.style.transition = 'opacity 0.55s ' + ease;
        img.style.opacity = '1';
      } else {
        img.style.transition = '';
        img.style.opacity = '';
      }
    }
  }

  function clearPeerRadialPushAnimated(durationMs) {
    if (!showcase) return;
    var ease = 'cubic-bezier(0.33, 1, 0.68, 1)';
    showcase.querySelectorAll('.work-card-wrap').forEach(function (w) {
      if (!w.style.transform) return;
      w.style.transition = 'transform ' + durationMs + 'ms ' + ease;
      w.style.transform = '';
    });
  }

  function releaseActiveHoverForScroll() {
    if (!showcase) return false;
    var active = showcase.querySelector('.work-card-wrap.wc-hover-active');
    if (!active) return false;
    if (workHoverReleaseTimer) clearTimeout(workHoverReleaseTimer);
    showcase.classList.add('work-scroll-releasing');
    clearPeerRadialPushAnimated(WORK_HOVER_RELEASE_MS);
    applyHoverLeave(active, true);
    workHoverReleaseTimer = setTimeout(function () {
      workHoverReleaseTimer = null;
      if (showcase) showcase.classList.remove('work-scroll-releasing');
    }, WORK_HOVER_RELEASE_MS);
    return true;
  }

  function pauseWorkHover(instant) {
    if (workHoverReleaseTimer) {
      clearTimeout(workHoverReleaseTimer);
      workHoverReleaseTimer = null;
    }
    workHoverPaused = true;
    if (showcase) {
      showcase.classList.add('work-hover-paused');
      if (instant) showcase.classList.remove('work-scroll-releasing');
    }
    if (instant) resetHoverState();
    if (workHoverResumeTimer) clearTimeout(workHoverResumeTimer);
  }

  function beginScrollHoverPause(done) {
    if (workHoverResumeTimer) clearTimeout(workHoverResumeTimer);
    workHoverPaused = true;
    var hadHover = releaseActiveHoverForScroll();
    if (!hadHover) pauseWorkHover(true);
    else if (showcase) showcase.classList.add('work-hover-paused');
    if (done) done();
  }

  function finishScrollSnapHover() {
    if (showcase) {
      showcase.classList.remove('work-scroll-releasing');
      showcase.classList.remove('work-hover-paused');
    }
    resetHoverState();
    scheduleResumeWorkHover(WORK_HOVER_RESUME_MS);

  function scheduleResumeWorkHover(delayMs) {
    if (workHoverResumeTimer) clearTimeout(workHoverResumeTimer);

  }, true);
  }

  buildWorkGrid();
  slideAwayPanel();
  waitForGridReady().catch(function () {});
  window.addEventListener('pageshow', function (e) { if (e.persisted) slideAwayPanel(true); });
</script>

<script>
(function(){
  if(!window.matchMedia('(max-width: 768px)').matches) return;
  var WANT=[['VFX',['vfx','visual effects']],['SOUND',['sound']],['AI',['ai']]];
  function norm(s){return (s||'').replace(/\s+/g,' ').trim().toLowerCase();}
  function align(bar){ var nav=document.querySelector('nav'); if(!nav) return;
    var cs=getComputedStyle(nav); bar.style.top=nav.offsetHeight+'px';
    bar.style.paddingLeft=cs.paddingLeft; bar.style.paddingRight=cs.paddingRight; }
  function build(){
    var rows=document.querySelectorAll('.work-row');
    if(!rows.length) return false;
    if(document.getElementById('xyz-work-tabs')) return true;
    var by={}; rows.forEach(function(r){ var c=r.querySelector('.work-row-cat'); if(c) by[norm(c.textContent)]=r; });
    var tabs=[];
    WANT.forEach(function(t){ for(var i=0;i<t[1].length;i++){ if(by[t[1][i]]){ tabs.push({name:t[0],key:t[1][i]}); break; } } });
    if(!tabs.length) return false;
    var bar=document.createElement('div'); bar.id='xyz-work-tabs';
    tabs.forEach(function(t){ var b=document.createElement('button'); b.type='button'; b.textContent=t.name;
      b.addEventListener('click',function(){show(t.key,b);}); bar.appendChild(b); });
    document.body.appendChild(bar);
    if(!document.getElementById('xyz-top-shadow')){ var sh=document.createElement('div'); sh.id='xyz-top-shadow'; document.body.appendChild(sh); }
    align(bar); window.addEventListener('resize',function(){ align(bar); });
    function show(key,btn){
      rows.forEach(function(r){ r.classList.add('xyz-hide'); });
      if(by[key]) by[key].classList.remove('xyz-hide');
      bar.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
      if(btn) btn.classList.add('active');
      window.scrollTo(0,0);
    }
    show(tabs[0].key, bar.querySelector('button'));
    var lastY=0;
    window.addEventListener('scroll', function(){
      var y=window.pageYOffset||document.documentElement.scrollTop||0;
      if(y>lastY+6 && y>140) bar.classList.add('xyz-hidden');
      else if(y<lastY-6) bar.classList.remove('xyz-hidden');
      lastY=y;
    }, {passive:true});
    return true;
  }
  var n=0, iv=setInterval(function(){ n++; if(build()||n>60) clearInterval(iv); },250);
  document.addEventListener('DOMContentLoaded',build); window.addEventListener('load',build);
})();
</script>
<script id="xyz-work-order">
(function(){
  function slug(s){ return ((s||'')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function okey(c,t){ return slug((c||'')+' '+(t||'')); }
  function normCat(l){ l=(l||'').trim().toLowerCase(); if(l==='vfx'||l==='visual effects') return 'visual effects'; return l; }
  function catSlug(l){ var nc=normCat(l); return nc==='visual effects'?'visual-effects':slug(nc); }
  function mkey(catLabel,t){ return catSlug(catLabel)+'/'+slug(t); }
  function stamp(card,catLabel){
    if(card.dataset.okey) return;
    var c=card.querySelector('.wc-label-client'), t=card.querySelector('.wc-label-title');
    var cv=(c&&c.textContent||'').trim(), tv=(t&&t.textContent||'').trim();
    card.dataset.okey=okey(cv,tv);
    card.dataset.mkey=mkey(catLabel,tv);
  }
  function stampAll(){
    document.querySelectorAll('.work-row').forEach(function(row){
      var catEl=row.querySelector('.work-row-cat'); if(!catEl) return;
      row.querySelectorAll('.work-card-wrap').forEach(function(card){ stamp(card,catEl.textContent); });
    });
  }
  function applyMeta(order){
    if(!order.meta) return;
    document.querySelectorAll('.work-card-wrap').forEach(function(card){
      var m=order.meta[card.dataset.mkey]; if(!m) return;
      var c=card.querySelector('.wc-label-client'), t=card.querySelector('.wc-label-title');
      if(c&&m.client!=null&&m.client!=='') c.textContent=m.client;
      if(t&&m.title!=null&&m.title!=='') t.textContent=m.title;
    });
  }
  function apply(order){
    var showcase=document.getElementById('showcase'); if(!showcase||!order) return false;
    var rows=[].slice.call(document.querySelectorAll('.work-row')); if(!rows.length) return false;
    stampAll();
    rows.forEach(function(row){
      var catEl=row.querySelector('.work-row-cat'); if(!catEl) return;
      var nc=normCat(catEl.textContent); var keys=null;
      Object.keys(order.projects||{}).forEach(function(k){ if(normCat(k)===nc) keys=order.projects[k]; });
      if(!keys) return;
      var cw=row.querySelector('.work-row-cards'); if(!cw) return;
      var cards=[].slice.call(cw.querySelectorAll('.work-card-wrap'));
      var origs=cards.filter(function(c){return !c.dataset.clone;}); if(!origs.length) return;
      var leftC=[], rightC=[], seen=false;
      cards.forEach(function(c){ if(!c.dataset.clone){ seen=true; return; } if(!seen) leftC.push(c); else rightC.push(c); });
      function ordered(group){ var byk={}; group.forEach(function(w){ byk[w.dataset.okey]=w; }); var out=[]; keys.forEach(function(k){ if(byk[k]){ out.push(byk[k]); delete byk[k]; } }); group.forEach(function(w){ if(out.indexOf(w)<0) out.push(w); }); return out; }
      var seq=ordered(leftC).concat(ordered(origs)).concat(ordered(rightC));
      seq.forEach(function(node){ cw.appendChild(node); });
    });
    if(order.categories){ var byCat={}; rows.forEach(function(r){ var c=r.querySelector('.work-row-cat'); if(c) byCat[normCat(c.textContent)]=r; });
      order.categories.forEach(function(lab){ var r=byCat[normCat(lab)]; if(r) showcase.appendChild(r); }); }
    applyMeta(order);
    return true;
  }
  fetch('/api/site-order').then(function(r){return r.json();}).then(function(d){
    if(d&&d.ok&&d.order){ var n=0,iv=setInterval(function(){ n++; if(apply(d.order)||n>80) clearInterval(iv); },200); window.addEventListener('load',function(){apply(d.order);}); }
  }).catch(function(){});
})();
</script>
