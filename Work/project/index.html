<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — XYZ Studios</title>
  <link rel="stylesheet" href="/assets/xyz-nav-font.css">
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('https://cdn.prod.website-files.com/6917408c1d0fee8fc2c58505/697ad8d7e20ca4c6f2870246_micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h: 80px;
      --pj-pad: 44px;
      /* room for scrubber + bottom controls above full-bleed edge */
      --pj-bottom-reserve: 140px;
      --pj-stage-h: calc(100vh - var(--nav-h) - var(--pj-bottom-reserve));
    }

    html, body {
      background: #000; color: #fff;
      font-family: Micross, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NAV ──────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%);
    }
    .nav-logo img { height: 29px; width: auto; display: block; }

    /* ── VIDEO PAGE — fills viewport below nav ───────────── */
    .pj-video-wrap {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
    }
    #pj-video {
      position: absolute;
      top: calc(var(--nav-h) + var(--pj-stage-h) / 2);
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(calc(100% - 2 * var(--pj-pad)), calc(var(--pj-stage-h) * 9 / 16));
      aspect-ratio: 9 / 16;
      height: auto;
      max-height: var(--pj-stage-h);
      object-fit: contain;
      display: block;
      cursor: pointer;
      background: #000;
    }

    .pj-video-wrap:fullscreen #pj-video,
    .pj-video-wrap:-webkit-full-screen #pj-video {
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      max-width: none;
      max-height: none;
      transform: none;
      aspect-ratio: unset;
      object-fit: cover;
    }

    /* UI overlay */
    .pj-ui {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .pj-ui.ui-hidden { opacity: 0; }
    .pj-ui > * { pointer-events: all; }

    /* Shared label style */
    .lbl {
      font: 400 10px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    /* Back button — top left, below nav */
    #pj-back {
      position: absolute; top: calc(var(--nav-h) + 20px); left: 44px;
      color: rgba(255,255,255,0.42);
      background: none; border: none; cursor: pointer; padding: 0;
      transition: color 0.2s;
    }
    #pj-back:hover { color: #fff; }

    /* Bottom controls */
    .pj-bottom {
      position: absolute; bottom: 76px; left: 44px; right: 44px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: end;
    }
    #pj-bottom-left  { display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
    #pj-bottom-center{ display: flex; align-items: baseline; gap: 8px; justify-content: center; white-space: nowrap; pointer-events: none; }
    #pj-bottom-right { display: flex; align-items: center; gap: 22px; justify-content: flex-end; }

    #pj-time { color: rgba(255,255,255,0.35); font-variant-numeric: tabular-nums; letter-spacing: 0.12em; }
    #pj-play-btn { color: rgba(255,255,255,0.48); background: none; border: none; cursor: pointer; padding: 0; min-width: 44px; text-align: left; transition: color 0.2s; }
    #pj-play-btn:hover { color: #fff; }
    #pj-title-span  { color: rgba(255,255,255,0.72); }
    #pj-sep-span    { color: rgba(255,255,255,0.2); letter-spacing: 0; }
    #pj-client-span { color: rgba(255,255,255,0.36); }

    #pj-fs-btn, #pj-mute-btn {
      color: rgba(255,255,255,0.45); background: none; border: none; cursor: pointer; padding: 0;
      transition: color 0.2s;
      font: 400 10px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    #pj-fs-btn:hover, #pj-mute-btn:hover { color: #fff; }

    /* Progress bar */
    #pj-scrubber {
      position: absolute; bottom: 56px; left: 44px; right: 44px;
      height: 2px; cursor: pointer; z-index: 10;
      background: rgba(255,255,255,0.12);
    }
    #pj-progress {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: rgba(255,255,255,0.85); pointer-events: none; width: 0%;
    }
    #pj-handle {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 11px; height: 11px; border-radius: 50%;
      background: #fff; pointer-events: none; left: 0%;
      opacity: 0 !important;
    }

    /* Fullscreen overrides */
    .pj-video-wrap:fullscreen,
    .pj-video-wrap:-webkit-full-screen { }

    /* ── CREDITS ─────────────────────────────────────────── */
    .pj-credits {
      background: #000;
      padding: 80px 72px 120px;
      min-height: 60vh;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .pj-cr-back {
      font: 400 9px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      background: none; border: none; cursor: pointer; padding: 0;
      margin-bottom: 40px; display: block;
      transition: color 0.2s;
    }
    .pj-cr-back:hover { color: #fff; }
    .pj-cr-title {
      font: 700 56px/1.04 Micross, Arial, sans-serif;
      color: #fff; letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .pj-cr-title em { font-style: italic; font-weight: 300; }
    .pj-cr-share {
      font: 400 9px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); margin-bottom: 60px;
    }
    .pj-cr-cols {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      padding-bottom: 52px; margin-bottom: 48px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .pj-cr-col-lbl {
      font: 400 9px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); margin-bottom: 12px;
    }
    .pj-cr-col-val {
      font: 400 15px/1.55 Micross, Arial, sans-serif;
      color: rgba(255,255,255,0.82);
    }
    .pj-cr-meta { display: flex; flex-direction: column; gap: 12px; }
    .pj-cr-meta-row { display: flex; align-items: baseline; }
    .pj-cr-meta-key {
      font: 400 9px/1.4 Micross, Arial, sans-serif;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.22); min-width: 130px;
    }
    .pj-cr-meta-val {
      font: 400 11px/1.4 Micross, Arial, sans-serif;
      color: rgba(255,255,255,0.5);
    }

    /* ── SCROLL SNAP ───────────────────────────── */
    html { height: 100%; }
    body { overflow-y: scroll; scroll-behavior: smooth; }
    .pj-stage { } /* no snap */
    .pj-credits { }

    /* ── ENTRANCE ANIMATIONS ───────────────────── */
    @keyframes pj-fade-up {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 40px)); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }
    @keyframes pj-fade-dn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pj-fade-in { from { opacity:0; } to { opacity:1; } }
    body.pj-entering #pj-video    { animation: pj-fade-up 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s both; }
    body.pj-entering .pj-nav      { animation: pj-fade-dn 0.8s cubic-bezier(0.16,1,0.3,1) 0.08s both; }
    body.pj-entering .pj-ctrl-bar { animation: pj-fade-in 0.7s cubic-bezier(0.16,1,0.3,1) 0.42s both; }

  </style>
</head>

  // ── Read params ────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const pTitle  = params.get('t') || '';
  const pClient = params.get('c') || '';
  const pCat    = params.get('cat') || '';

  // Find matching card for video URL
  let videoUrl = '';
  for (const row of ROWS) {
    if (row.label === pCat) {
      const card = row.cards.find(c => c.title === pTitle && c.client === pClient);
      if (card) { videoUrl = card.video; break; }
    }
  }
  // Fallback: search all rows
  if (!videoUrl) {
    for (const row of ROWS) {
      const card = row.cards.find(c => c.title === pTitle && c.client === pClient);
      if (card) { videoUrl = card.video; break; }
    }
  }

  // Update page title
  document.title = `${pTitle} — XYZ Studios`;

  // Populate UI text
  document.getElementById('pj-title-span').textContent  = pTitle;
  document.getElementById('pj-client-span').textContent = pClient;
  document.getElementById('pj-cr-title').textContent    = pTitle;
  document.getElementById('pj-cr-client').textContent   = pClient;
  document.getElementById('pj-cr-cat').textContent      = pCat;

  // Load and play video
  const vid = document.getElementById('pj-video');
  if (videoUrl) {
    vid.src = videoUrl;
    vid.play().catch(() => {});
  }

  // ── Video controls ────────────────────────────────────
  const ui       = document.getElementById('pj-ui');
  const playBtn  = document.getElementById('pj-play-btn');
  const timeEl   = document.getElementById('pj-time');
  const muteBtn  = document.getElementById('pj-mute-btn');
  const fsBtn    = document.getElementById('pj-fs-btn');
  const scrubber = document.getElementById('pj-scrubber');
  const progress = document.getElementById('pj-progress');
  const handle   = document.getElementById('pj-handle');
  const wrap     = document.getElementById('pj-video-wrap');

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }
  function updatePlay() { playBtn.textContent = vid.paused ? 'Play' : 'Pause'; }
  function updateMute() { muteBtn.textContent = vid.muted ? 'Sound:Off' : 'Sound:On'; }

  let _raf = null;
  function _tick() {
    const cur = vid.currentTime, dur = vid.duration || 0;
    timeEl.textContent = `${fmt(cur)} / ${fmt(dur)}`;
    const pct = dur ? (cur / dur) * 100 : 0;
    progress.style.width = `${pct}%`;
    _raf = requestAnimationFrame(_tick);
  }
  function _startRaf() { if (!_raf) _raf = requestAnimationFrame(_tick); }
  function _stopRaf()  { if (_raf)  { cancelAnimationFrame(_raf); _raf = null; } }
  vid.addEventListener('play',  () => { updatePlay(); _startRaf(); });
  vid.addEventListener('pause', () => { updatePlay(); _stopRaf();  });
  vid.addEventListener('ended', () => { updatePlay(); _stopRaf();  });

  vid.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
  playBtn.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
  muteBtn.addEventListener('click', () => { vid.muted = !vid.muted; updateMute(); });
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) wrap.requestFullscreen && wrap.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  });

  // Scrubber
  let scrubbing = false;
  function seekTo(e) {
    const r = scrubber.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    if (isFinite(vid.duration)) vid.currentTime = pct * vid.duration;
  }
  scrubber.addEventListener('mousedown', e => { scrubbing = true; seekTo(e); e.stopPropagation(); });
  document.addEventListener('mousemove', e => { if (scrubbing) seekTo(e); });
  document.addEventListener('mouseup',   () => { scrubbing = false; });

  // ── SUBTLE TILT ON VIDEO ─────────────────────────────────────
  (function() {
    const TILT_MAX = 3;
    const SPRING = "transform 1.2s cubic-bezier(0.34,1.56,0.64,1)";
    const EASE_IN = "transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)";
    let entering = false, enterTimer;
    vid.addEventListener("mouseenter", () => {
      if (document.fullscreenElement) return;
      entering = true;
      vid.style.transition = EASE_IN;
      clearTimeout(enterTimer);
      enterTimer = setTimeout(() => { entering = false; }, 500);
    });
    vid.addEventListener("mousemove", e => {
      if (document.fullscreenElement) return;
      const r  = vid.getBoundingClientRect();
      const tiltX = ((e.clientY - r.top  - r.height / 2) / (r.height / 2)) * -TILT_MAX;
      const tiltY = ((e.clientX - r.left - r.width  / 2) / (r.width  / 2)) *  TILT_MAX;
      if (!entering) vid.style.transition = "none";
      vid.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    });
    vid.addEventListener("mouseleave", () => {
      entering = false;
      clearTimeout(enterTimer);
      vid.style.transition = SPRING;
      vid.style.transform = "";
    });
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) { vid.style.transition = "none"; vid.style.transform = ""; }
    });
  })();

  // ── Auto-hide UI ──────────────────────────────────────
  let hideTimer = null;
  function showUI() {
    ui.classList.remove('ui-hidden');
    wrap.style.cursor = '';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      ui.classList.add('ui-hidden');
      wrap.style.cursor = 'none';
    }, 3000);
  }
  wrap.addEventListener('mousemove', showUI);
  wrap.addEventListener('mouseenter', showUI);
  ui.addEventListener('mouseenter', () => {
    clearTimeout(hideTimer);
    ui.classList.remove('ui-hidden');
    wrap.style.cursor = '';
  });

  // ── Back navigation ───────────────────────────────────
  function goBack() { window.location.href = '/projects/'; }
  document.getElementById('pj-back').addEventListener('click', goBack);
  document.getElementById('pj-cr-back').addEventListener('click', goBack);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });

  // Fade nav on fullscreen
  const navEl = document.querySelector('nav');
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      navEl.style.opacity = '0';
      navEl.style.pointerEvents = 'none';
    } else {
      navEl.style.opacity = '';
      navEl.style.pointerEvents = '';
    }
  });

  updatePlay();
  updateMute();
  showUI();

  // ── SECTION SNAP SCROLL ──────────────────────────────────────────
  (function () {
    const DURATION = 900;
    const EASE = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

    let scrolling = false;
    let startY = 0;
    let startTime = 0;
    let targetY = 0;
    let rafId = null;
    let snapUsed = false; // only snap once

    const credits = document.querySelector('.pj-credits');
    if (!credits) return;

    // Only engage if the page actually overflows (images are cut off)
    function pageOverflows() {
      return document.documentElement.scrollHeight > window.innerHeight + 10;
    }

    function getCreditsTop() {
      return Math.round(credits.getBoundingClientRect().top + window.scrollY);
    }

    function animateTo(to) {
      if (rafId) cancelAnimationFrame(rafId);
      startY = window.scrollY;
      targetY = to;
      startTime = performance.now();
      scrolling = true;
      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / DURATION, 1);
        window.scrollTo(0, startY + (targetY - startY) * EASE(t));
        if (t < 1) { rafId = requestAnimationFrame(step); }
        else { window.scrollTo(0, targetY); scrolling = false; rafId = null; }
      }
      rafId = requestAnimationFrame(step);
    }

    function cleanup() {
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('touchstart', onTouchStart);
      window.removeEventListener('touchend', onTouchEnd);
    }

    function onWheel(e) {
      if (!pageOverflows()) return; // fits in viewport — normal scroll
      if (snapUsed) { cleanup(); return; } // already snapped — remove listeners
      if (window.scrollY > 10) return; // already scrolled past top — let go
      if (e.deltaY <= 0) return; // only snap on first downward scroll
      if (scrolling) { e.preventDefault(); return; }
      e.preventDefault();
      snapUsed = true;
      animateTo(getCreditsTop());
      cleanup();
    }

    let touchStartY = 0;
    function onTouchStart(e) { touchStartY = e.touches[0].clientY; }
    function onTouchEnd(e) {
      if (!pageOverflows()) return;
      if (snapUsed) { cleanup(); return; }
      if (window.scrollY > 10) return;
      const diff = touchStartY - e.changedTouches[0].clientY;
      if (diff < 10) return; // only snap on swipe up (content moves up)
      if (scrolling) return;
      snapUsed = true;
      animateTo(getCreditsTop());
      cleanup();
    }

    window.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchend', onTouchEnd, { passive: true });
  })();
</script>

  #pj-center-play{ position:absolute; left:50%; top:calc(var(--nav-h) + var(--pj-stage-h)/2); transform:translate(-50%,-50%);
    z-index:30; width:76px; height:76px; border-radius:50%; padding:0; cursor:pointer;
    border:1px solid rgba(255,255,255,.6); background:rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); transition:opacity .25s ease, background .2s ease; }
  #pj-center-play svg{ width:26px; height:26px; fill:#fff; display:block; }
  #pj-center-play.pj-hide{ opacity:0; pointer-events:none; }
  .pj-video-wrap:fullscreen #pj-center-play, .pj-video-wrap:-webkit-full-screen #pj-center-play{ top:50%; }
</style>
<script>
(function(){
  function init(){
    var wrap=document.getElementById('pj-video-wrap');
    var vid=document.getElementById('pj-video');
    if(!wrap||!vid){ return false; }
    if(document.getElementById('pj-center-play')) return true;
    var b=document.createElement('button'); b.type='button'; b.id='pj-center-play';
    b.setAttribute('aria-label','Play/pause');
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    wrap.appendChild(b);
    function sync(){ b.classList.toggle('pj-hide', !vid.paused); }
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation();
      if(vid.paused){ var p=vid.play(); if(p&&p.catch)p.catch(function(){}); } else { vid.pause(); } });
    vid.addEventListener('play', sync); vid.addEventListener('pause', sync); vid.addEventListener('ended', sync);
    sync();
    return true;
  }
  if(!init()){ var n=0, iv=setInterval(function(){ n++; if(init()||n>60) clearInterval(iv); },200); }
  document.addEventListener('DOMContentLoaded', init); window.addEventListener('load', init);
})();
</script>
