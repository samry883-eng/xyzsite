<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Work CMS — XYZ Studios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <style>
    @font-face { font-family: 'Micross'; src: url('/assets/micross.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.2); --dim: rgba(255,255,255,.5); --dim2: rgba(255,255,255,.3); --dim3: rgba(255,255,255,.14); }
    html, body { background: #000; color: #fff; font-family: Micross, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; padding: 48px 24px 120px; }
    .wrap { max-width: 960px; margin: 0 auto; }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1 { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; font-weight: 700; }
    .sub { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim2); margin: 10px 0 32px; line-height: 1.6; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logout { background: none; border: 0; color: var(--dim2); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
    .logout:hover { color: #fff; }
    #login { max-width: 300px; margin: 20vh auto 0; text-align: center; }
    #login input { width: 100%; padding: 14px 6px; background: transparent; border: 0; border-bottom: 1px solid var(--line2); color: #fff; text-align: center; }
    #login input:focus { outline: none; border-color: #fff; }
    .btn { background: #fff; color: #000; border: 0; padding: 12px 22px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
    .btn.ghost { background: none; color: var(--dim); border: 1px solid var(--line2); font-weight: 400; }
    .btn:disabled { opacity: .4; cursor: default; }
    .msg { font-size: 11px; color: var(--dim); min-height: 1.2em; margin-top: 12px; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .toolbar input[type=search] { flex: 1; min-width: 180px; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; }
    .toolbar input:focus { outline: none; border-color: #fff; }
    .list { border-top: 1px solid var(--line2); }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .row.is-active { background: rgba(255,255,255,.04); }
    .row.sortable-ghost { opacity: .25; }
    .grip { color: var(--dim3); cursor: grab; padding: 8px; touch-action: none; }
    .thumb { width: 72px; height: 40px; object-fit: cover; background: #111; flex: 0 0 auto; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 13px; }
    .row-meta { font-size: 10px; color: var(--dim2); letter-spacing: .06em; margin-top: 3px; }
    .badge { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line2); padding: 3px 8px; color: var(--dim); }
    .badge.on { color: #fff; border-color: #fff; }
    .editor { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line2); display: none; }
    .editor.is-open { display: block; }
    .editor h2 { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 20px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    label { display: block; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim2); margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; }
    .field textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #fff; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
    .checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .04em; text-transform: none; color: var(--dim); cursor: pointer; }
    .checks input { width: auto; }
    .editor-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.88); backdrop-filter: blur(16px); border-top: 1px solid var(--line2); padding: 16px 24px; }
    .bar .inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
    .spacer { flex: 1; }
    .pill { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <h1 style="text-align:center;margin-bottom:28px">Work CMS</h1>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:20px">Sign in</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="topbar">
      <div>
        <h1>Work CMS</h1>
        <div class="sub">Edit projects for /projects-v2 · drag to reorder work page · Publish saves to Edge Config and redeploys (~30s) · <a href="/work/adminv2" style="color:#fff">Open CMS v2 →</a></div>
      </div>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title or client…">
      <button class="btn ghost" id="seedBtn" title="Reset catalog to 38 default projects">Seed defaults</button>
      <button class="btn ghost" id="addBtn">+ Add project</button>
    </div>

    <div class="list" id="list"></div>

    <div class="editor" id="editor">
      <h2 id="editorTitle">Edit project</h2>
      <div class="grid2">
        <div class="field"><label>Title</label><input id="f-title"></div>
        <div class="field"><label>Client</label><input id="f-client"></div>
        <div class="field"><label>Category</label>
          <select id="f-category">
            <option value="visual-effects">Visual Effects</option>
            <option value="sound">Sound</option>
            <option value="ai">AI</option>
            <option value="making-of">Making Of</option>
          </select>
        </div>
        <div class="field"><label>Project type</label>
          <select id="f-type">
            <option>Commercial</option>
            <option>Music Video</option>
            <option>Brand Film</option>
          </select>
        </div>
        <div class="field"><label>Video URL</label><input id="f-video"></div>
        <div class="field"><label>Poster URL</label><input id="f-poster"></div>
        <div class="field"><label>Project page href</label><input id="f-href" placeholder="/work/visual-effects/slug/"></div>
        <div class="field"><label>Slug</label><input id="f-slug"></div>
        <div class="field" style="grid-column:1/-1"><label>Credits (one per line: Label: Value)</label><textarea id="f-credits"></textarea></div>
        <div class="field" style="grid-column:1/-1">
          <label>Services</label>
          <div class="checks" id="f-services"></div>
        </div>
        <div class="field"><label><input type="checkbox" id="f-featured"> Featured (Selected Work)</label></div>
      </div>
      <div class="editor-actions">
        <button class="btn" id="applyBtn">Apply to draft</button>
        <button class="btn ghost" id="deleteBtn">Delete project</button>
      </div>
    </div>
  </div>
</div>

<div class="bar hidden" id="bar">
  <div class="inner">
    <span class="pill" id="saveMsg">All published</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="resetBtn">Reset</button>
    <button class="btn" id="saveBtn">Publish changes</button>
  </div>
</div>

<script>
var SERVICE_OPTIONS = ['Creative Direction','Visual Effects','CGI','AI','Compositing','Clean Up & Beauty','Sound Design','Mixing & Mastering','Compose'];
var catalog = null;
var draft = null;
var activeId = null;
var dirtyFlag = false;
var sortable = null;

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function slugify(s) {
  return String(s || '').toLowerCase().replace(/[''`']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function normalizeKey(title, client) {
  return String(title || '').trim().toLowerCase().replace(/[''`]/g, '').replace(/\s+/g, ' ') + '|' + String(client || '').trim().toLowerCase().replace(/[''`]/g, '').replace(/\s+/g, ' ');
}

function creditsToText(credits) {
  if (!Array.isArray(credits)) return '';
  return credits.map(function (c) { return c.label + ': ' + c.value; }).join('\n');
}

function textToCredits(text) {
  return String(text || '').split('\n').map(function (line) {
    var i = line.indexOf(':');
    if (i < 0) return null;
    return { label: line.slice(0, i).trim(), value: line.slice(i + 1).trim() };
  }).filter(function (c) { return c && c.label && c.value; });
}

function dirty() {
  if (!dirtyFlag) {
    dirtyFlag = true;
    document.getElementById('saveMsg').textContent = 'Unpublished changes';
  }
}

function setLive(msg) {
  dirtyFlag = false;
  document.getElementById('saveMsg').textContent = msg || 'All published';
}

function cloneCatalog(c) {
  return JSON.parse(JSON.stringify(c));
}

function buildServiceChecks() {
  var box = document.getElementById('f-services');
  box.innerHTML = '';
  SERVICE_OPTIONS.forEach(function (name) {
    var lab = el('label');
    var cb = el('input');
    cb.type = 'checkbox';
    cb.value = name;
    cb.dataset.service = name;
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(name));
    box.appendChild(lab);
  });
}

function filteredProjects() {
  var q = (document.getElementById('search').value || '').trim().toLowerCase();
  var list = draft.projects.slice().sort(function (a, b) { return a.sortOrder - b.sortOrder; });
  if (!q) return list;
  return list.filter(function (p) {
    return (p.title + ' ' + p.client + ' ' + p.category).toLowerCase().indexOf(q) >= 0;
  });
}

function renderList() {
  var listEl = document.getElementById('list');
  listEl.innerHTML = '';
  filteredProjects().forEach(function (p) {
    var row = el('div', 'row' + (p.id === activeId ? ' is-active' : ''));
    row.dataset.id = p.id;
    row.appendChild(el('span', 'grip', '≡'));
    var img = el('img', 'thumb');
    img.src = p.poster || '';
    img.alt = '';
    row.appendChild(img);
    var main = el('div', 'row-main');
    main.appendChild(el('div', 'row-title', p.title + ' — ' + p.client));
    main.appendChild(el('div', 'row-meta', p.category + ' · ' + p.projectType));
    row.appendChild(main);
    var badge = el('span', 'badge' + (p.featured ? ' on' : ''), p.featured ? 'Featured' : 'All work');
    row.appendChild(badge);
    row.onclick = function (e) {
      if (e.target.closest('.grip')) return;
      openEditor(p.id);
    };
    listEl.appendChild(row);
  });
  if (sortable) sortable.destroy();
  sortable = new Sortable(listEl, {
    animation: 150,
    handle: '.grip',
    draggable: '.row',
    onEnd: function () {
      var ids = Array.prototype.map.call(listEl.querySelectorAll('.row'), function (r) { return r.dataset.id; });
      var map = {};
      draft.projects.forEach(function (p) { map[p.id] = p; });
      var next = [];
      ids.forEach(function (id, i) {
        if (map[id]) { map[id].sortOrder = i; next.push(map[id]); }
      });
      draft.projects.forEach(function (p) {
        if (ids.indexOf(p.id) < 0) { p.sortOrder = next.length; next.push(p); }
      });
      draft.projects = next;
      dirty();
      renderList();
    }
  });
}

function openEditor(id) {
  activeId = id;
  var p = draft.projects.find(function (x) { return x.id === id; });
  if (!p) return;
  document.getElementById('editor').classList.add('is-open');
  document.getElementById('editorTitle').textContent = 'Edit — ' + p.title;
  document.getElementById('f-title').value = p.title || '';
  document.getElementById('f-client').value = p.client || '';
  document.getElementById('f-category').value = p.category || 'visual-effects';
  document.getElementById('f-type').value = p.projectType || 'Commercial';
  document.getElementById('f-video').value = p.video || '';
  document.getElementById('f-poster').value = p.poster || '';
  document.getElementById('f-href').value = p.href || '';
  document.getElementById('f-slug').value = p.slug || '';
  document.getElementById('f-credits').value = creditsToText(p.credits);
  document.getElementById('f-featured').checked = !!p.featured;
  document.querySelectorAll('#f-services input').forEach(function (cb) {
    cb.checked = (p.services || []).indexOf(cb.value) >= 0;
  });
  renderList();
}

function readEditorIntoProject(p) {
  p.title = document.getElementById('f-title').value.trim();
  p.client = document.getElementById('f-client').value.trim();
  p.category = document.getElementById('f-category').value;
  p.projectType = document.getElementById('f-type').value;
  p.video = document.getElementById('f-video').value.trim();
  p.poster = document.getElementById('f-poster').value.trim();
  p.href = document.getElementById('f-href').value.trim();
  p.slug = document.getElementById('f-slug').value.trim() || slugify(p.title);
  p.credits = textToCredits(document.getElementById('f-credits').value);
  p.featured = document.getElementById('f-featured').checked;
  p.services = Array.prototype.filter.call(document.querySelectorAll('#f-services input:checked'), function (cb) { return cb.value; }).map(function (cb) { return cb.value; });
  if (!p.href) p.href = '/work/' + p.category + '/' + p.slug + '/';
  return p;
}

function loadCatalog(cb) {
  fetch('/api/projects').then(function (r) { return r.json(); }).then(function (d) {
    catalog = d && d.catalog ? d.catalog : { version: 1, projects: [] };
    draft = cloneCatalog(catalog);
    cb && cb();
  }).catch(function () {
    catalog = { version: 1, projects: [] };
    draft = cloneCatalog(catalog);
    cb && cb();
  });
}

function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('bar').classList.remove('hidden');
  buildServiceChecks();
  loadCatalog(function () {
    renderList();
    setLive('All published');
  });
}

fetch('/api/capabilities/admin/list').then(function (r) { if (r.ok) showApp(); }).catch(function () {});

document.getElementById('loginBtn').onclick = function () {
  var pw = document.getElementById('pw').value;
  document.getElementById('loginMsg').textContent = 'Signing in…';
  fetch('/api/capabilities/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.ok) showApp(); else document.getElementById('loginMsg').textContent = (d && d.error) || 'Wrong password'; })
    .catch(function () { document.getElementById('loginMsg').textContent = 'Network error'; });
};
document.getElementById('logoutBtn').onclick = function () {
  fetch('/api/capabilities/admin/logout', { method: 'POST' }).finally(function () { location.reload(); });
};

document.getElementById('search').oninput = renderList;

document.getElementById('applyBtn').onclick = function () {
  if (!activeId) return;
  var p = draft.projects.find(function (x) { return x.id === activeId; });
  if (!p) return;
  readEditorIntoProject(p);
  dirty();
  renderList();
};

document.getElementById('deleteBtn').onclick = function () {
  if (!activeId || !confirm('Delete this project from the catalog?')) return;
  draft.projects = draft.projects.filter(function (p) { return p.id !== activeId; });
  draft.projects.forEach(function (p, i) { p.sortOrder = i; });
  activeId = null;
  document.getElementById('editor').classList.remove('is-open');
  dirty();
  renderList();
};

document.getElementById('addBtn').onclick = function () {
  var p = {
    id: 'new-project|' + Date.now(),
    slug: 'new-project',
    category: 'visual-effects',
    title: 'New Project',
    client: 'Client',
    href: '/work/visual-effects/new-project/',
    video: '',
    poster: '',
    credits: [],
    services: [],
    projectType: 'Commercial',
    featured: false,
    homeHero: { start: 0, enabled: false },
    sortOrder: draft.projects.length
  };
  draft.projects.push(p);
  dirty();
  openEditor(p.id);
};

document.getElementById('saveBtn').onclick = function () {
  if (activeId) {
    var p = draft.projects.find(function (x) { return x.id === activeId; });
    if (p) readEditorIntoProject(p);
  }
  var btn = this;
  btn.disabled = true;
  document.getElementById('saveMsg').textContent = 'Publishing…';
  fetch('/api/projects', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ catalog: draft, redeploy: true }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      btn.disabled = false;
      if (d && d.ok) {
        catalog = cloneCatalog(d.catalog || draft);
        draft = cloneCatalog(catalog);
        setLive(d.redeployed ? 'Published — redeploy started (~30s)' : 'Published to Edge Config');
        renderList();
      } else {
        document.getElementById('saveMsg').textContent = (d && d.error) || 'Save failed';
      }
    })
    .catch(function () { btn.disabled = false; document.getElementById('saveMsg').textContent = 'Network error'; });
};

document.getElementById('resetBtn').onclick = function () {
  draft = cloneCatalog(catalog);
  activeId = null;
  document.getElementById('editor').classList.remove('is-open');
  renderList();
  setLive('Reverted to last published');
};

document.getElementById('seedBtn').onclick = function () {
  if (!confirm('Replace catalog with 38 default projects from unified work page?')) return;
  fetch('/api/projects/seed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ redeploy: false }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) loadCatalog(function () { renderList(); setLive('Seeded ' + d.count + ' projects'); });
      else alert((d && d.error) || 'Seed failed');
    });
};
</script>
</body>
</html>
