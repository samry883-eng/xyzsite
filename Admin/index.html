<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>XYZ Studios — Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#080809;--card:#0f0f11;--card2:#141417;--line:#1f1f23;--line2:#2a2a30;--txt:#f4f4f5;--dim:rgba(255,255,255,.5);--dim2:rgba(255,255,255,.3);--accent:#6b8afd}
  body{background:radial-gradient(1100px 600px at 50% -120px,#16161c 0%,var(--bg) 60%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding:30px 18px 130px}
  .wrap{max-width:780px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  h1{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .sub{font-size:12px;color:var(--dim2);margin-bottom:26px}
  .logout{background:none;border:0;color:var(--dim2);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:color .2s}
  .logout:hover{color:var(--dim)}
  button{cursor:pointer;font-family:inherit}
  #login{max-width:330px;margin:17vh auto 0;text-align:center}
  #login .mark{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:24px}
  #login input{width:100%;padding:13px 15px;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:#fff;font-size:16px;margin-bottom:12px;text-align:center}
  #login input:focus{outline:none;border-color:var(--accent)}
  .btn{background:#fff;color:#000;border:0;border-radius:10px;padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:transform .12s,opacity .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .btn.ghost{background:none;color:var(--dim);border:1px solid var(--line2)}
  .btn.ghost:hover{color:#fff;border-color:#3a3a42}
  .msg{font-size:12px;color:var(--dim)}

  .sec{margin-bottom:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#101013,#0d0d10);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
  .sec-head{display:flex;align-items:center;gap:11px;padding:15px 17px}
  .sec-head .cat-grip{color:var(--dim2);font-size:18px;cursor:grab;line-height:1;padding:8px 8px;margin:-8px -2px;border-radius:6px;touch-action:none;-webkit-user-select:none;user-select:none;transition:color .15s,background .15s}
  .sec-head .cat-grip:hover{color:#fff;background:rgba(255,255,255,.05)}
  .sec-head .cat-grip:active{cursor:grabbing}
  .sec-head .lbl{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff}
  .sec-head .count{font-size:10px;color:var(--dim2);background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;letter-spacing:.04em}
  .sec-head .hint{margin-left:auto;font-size:10px;color:var(--dim2);letter-spacing:.04em}
  .sec-body{padding:4px 9px 11px}

  .row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin:7px 3px;transition:border-color .15s,background .15s}
  .row:hover{border-color:var(--line2)}
  .row.sortable-ghost{opacity:.3}
  .row.sortable-chosen{background:#1a1a1f;border-color:#34343c}
  .row .grip{color:var(--dim2);cursor:grab;font-size:19px;line-height:1;flex:0 0 auto;padding:10px 8px;margin:-6px 0;border-radius:6px;flex:0 0 auto;transition:color .15s,background .15s;touch-action:none;-webkit-user-select:none;user-select:none}
  .row .grip:hover{color:#fff;background:rgba(255,255,255,.05)}
  .row .grip:active{cursor:grabbing}
  .row .num{width:16px;flex:0 0 auto;font-size:10px;color:var(--dim2);text-align:center;font-variant-numeric:tabular-nums}
  .thumb{flex:0 0 auto;width:72px;height:41px;border-radius:7px;overflow:hidden;position:relative;background:#000;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.35));pointer-events:none}
  .thumb .pl{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);background:rgba(0,0,0,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:.85}
  .thumb .pl svg{width:8px;height:8px;fill:#fff;margin-left:1px}
  .fld{flex:1;display:flex;gap:9px;min-width:0;align-items:center}
  .fld input{min-width:0;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--txt);font-size:13.5px;padding:8px 10px;font-family:inherit;transition:background .15s,border-color .15s}
  .fld input:hover{background:rgba(255,255,255,.025)}
  .fld input:focus{outline:none;border-color:var(--accent);background:rgba(107,138,253,.06)}
  .fld input.brand{flex:0 0 36%;color:#fff;font-weight:600}
  .fld input.ttl{flex:1;color:rgba(255,255,255,.72)}
  .fld input.tc{flex:0 0 70px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums}
  .fldlabels{display:flex;gap:9px;padding:3px 10px 1px 0;margin-left:118px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
  .fldlabels .a{flex:0 0 36%}.fldlabels .b{flex:1}.fldlabels .c{flex:0 0 70px;text-align:center}

  .grant{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin:7px 3px}
  .grant .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2a2a32,#3a3a44);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-transform:uppercase;font-weight:600}
  .grant .em{flex:1;font-size:13px;color:rgba(255,255,255,.88);word-break:break-all}
  .grant .src{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);flex:0 0 auto;border:1px solid var(--line);border-radius:20px;padding:3px 9px}
  .grant .rm{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:7px;font-size:11px;padding:6px 11px;flex:0 0 auto;transition:.15s}
  .grant .rm:hover{border-color:#5a2a2a;color:#ff8b8b}
  .addrow{display:flex;gap:9px;padding:9px 3px 3px}
  .addrow input{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:9px;color:#fff;font-size:14px;padding:11px 13px;font-family:inherit}
  .addrow input:focus{outline:none;border-color:var(--accent)}
  .note{font-size:11px;color:var(--dim);margin:4px 6px 8px;line-height:1.5}
  .copybox{margin:6px 3px;padding:10px 12px;background:var(--card);border:1px solid var(--line2);border-radius:8px;font-size:11px;color:var(--dim);word-break:break-all;display:none}

  .morebtn{display:block;width:calc(100% - 6px);margin:6px 3px 2px;padding:10px;background:transparent;border:1px dashed var(--line2);border-radius:10px;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;transition:.15s}
  .morebtn:hover{border-color:#3a3a42;color:#fff;background:rgba(255,255,255,.02)}
  .cat-section.collapsed .plist .row:nth-child(n+4){display:none}
  .arrows{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;margin-left:6px}
  .arrows .ar,.catarrows .ar{width:30px;height:20px;line-height:1;font-size:9px;background:var(--card);border:1px solid var(--line2);color:var(--dim);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
  .arrows .ar:hover,.catarrows .ar:hover{color:#fff;border-color:#3a3a42;background:rgba(255,255,255,.05)}
  .arrows .ar:active,.catarrows .ar:active{background:rgba(107,138,253,.18)}
  .catarrows{display:flex;gap:5px;margin-left:auto}
  .catarrows .ar{width:32px;height:24px;font-size:10px}
  .homerm{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:none;border:1px solid var(--line2);color:var(--dim2);font-size:12px;line-height:1;margin-left:2px;transition:.15s}
  .homerm:hover{border-color:#5a2a2a;color:#ff8b8b}
  .addvid{display:block;width:calc(100% - 6px);margin:8px 3px 4px;padding:11px;background:rgba(107,138,253,.08);border:1px dashed #34406a;border-radius:10px;color:#9fb2ff;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:.15s}
  .addvid:hover{background:rgba(107,138,253,.14);border-color:#4a5a9a;color:#c3cfff}
  .picker{margin:4px 3px 6px;border:1px solid var(--line);border-radius:12px;background:#0b0b0d;max-height:340px;overflow:auto;padding:8px}
  .pickhint{font-size:10px;color:var(--dim2);letter-spacing:.04em;padding:4px 6px 8px;text-transform:uppercase}
  .pickcat{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:9px 6px 5px;position:sticky;top:0;background:#0b0b0d}
  .pickrow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px}
  .pickrow:hover{background:rgba(255,255,255,.025)}
  .pickrow .pl{flex:1;font-size:12.5px;color:rgba(255,255,255,.7);min-width:0}
  .pickrow .pl b{color:#fff;font-weight:600}
  .pickadd{flex:0 0 auto;background:#fff;color:#000;border:0;border-radius:7px;font-size:11px;font-weight:600;padding:7px 14px;letter-spacing:.04em;text-transform:uppercase}
  .pickadd.added{background:none;color:var(--dim2);border:1px solid var(--line2);cursor:default}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,9,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:13px 18px;z-index:50}
  .bar .inner{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:#3a3a42;transition:background .2s}
  .dot.live{background:#43d17a;box-shadow:0 0 8px rgba(67,209,122,.5)}
  .dot.unsaved{background:#f5c451}
  .spacer{flex:1}
  @media(max-width:600px){
    .fld{flex-wrap:wrap}.fld input.brand{flex:1 1 100%}.fld input.ttl{flex:1 1 100%}
    .fldlabels{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <div class="mark">XYZ Studios</div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%">Sign in</button>
    <div class="msg" id="loginMsg" style="margin-top:14px"></div>
  </div>

  <div id="app" style="display:none">
    <div class="topbar">
      <h1>XYZ Studios — Admin</h1>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
    <div class="sub">Reorder with \u25b2\u25bc arrows (or drag the \u2261 handle) &middot; type to rename &middot; Publish saves instantly \u2014 no deploy needed</div>
    <div id="sections"></div>
  </div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="inner">
    <span class="pill"><span class="dot live" id="statDot"></span><span id="saveMsg">All published</span></span>
    <span class="spacer"></span>
    <button class="btn ghost" id="resetBtn">Reset</button>
    <button class="btn" id="saveBtn">Publish changes</button>
  </div>
</div>

_snapshot_00.17.054.jpg", "cat": "Visual Effects", "start": ""}, {"key": "prime-video-good-sports", "client": "Prime Video", "title": "Good Sports", "video": "https://r2.vidzflow.com/source/fb5e495e-8460-4277-a7aa-08accd388af0.mp4", "poster": "/work/sound/good-sports/poster.jpg", "cat": "Sound", "start": ""}];
var ORDER = null, GRANTS = [], GRANT_MODE = null;
var PLAY = '<span class="pl"><svg viewBox="0 0 10 10"><path d="M2 1l6 4-6 4z"/></svg></span>';

function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function projMeta(cat,key){ var a=DATA.projects[cat]||[]; for(var i=0;i<a.length;i++) if(a[i].key===key) return a[i]; return null; }
function thumb(poster){ var d=el('div','thumb'); var img=el('img'); img.loading='lazy'; img.src=poster||''; img.onerror=function(){this.style.display='none';}; d.appendChild(img); d.insertAdjacentHTML('beforeend',PLAY); return d; }

function defaultOrder(){ var o={categories:DATA.categories.slice(),projects:{},meta:{},home:{}}; DATA.categories.forEach(function(c){ o.projects[c]=DATA.projects[c].map(function(p){return p.key;}); }); return o; }
function mergeOrder(saved){
  var base=defaultOrder(); if(!saved) return base;
  var cats=(saved.categories||[]).filter(function(c){return base.categories.indexOf(c)>=0;});
  base.categories.forEach(function(c){ if(cats.indexOf(c)<0) cats.push(c); });
  var projects={};
  cats.forEach(function(c){ var valid=base.projects[c]||[]; var sv=((saved.projects||{})[c]||[]).filter(function(k){return valid.indexOf(k)>=0;}); valid.forEach(function(k){ if(sv.indexOf(k)<0) sv.push(k); }); projects[c]=sv; });
  return {categories:cats,projects:projects,meta:saved.meta||{},home:saved.home||{}};
}


function homeKeysInUse(){ var s={}; document.querySelectorAll('#homeList .row').forEach(function(r){ s[r.dataset.key]=1; }); return s; }
function homeRow(item){
  var r=el('div','row'); r.dataset.key=item.key; r.dataset.video=item.video||''; r.dataset.poster=item.poster||''; r.dataset.cat=item.cat||'';
  r.appendChild(el('span','grip','≡'));
  r.appendChild(thumb(item.poster));
  var f=el('div','fld');
  f.appendChild(inp('brand', item.client!=null?item.client:''));
  f.appendChild(inp('ttl', item.title!=null?item.title:''));
  f.appendChild(inp('tc', item.start!=null?item.start:'', '0:00'));
  r.appendChild(f);
  var raw=el('div','arrows'); raw.innerHTML='<button class="ar up" title="Move up">▲</button><button class="ar dn" title="Move down">▼</button>';
  raw.querySelector('.up').onclick=(function(rr){return function(){moveRow(rr,-1);};})(r);
  raw.querySelector('.dn').onclick=(function(rr){return function(){moveRow(rr,1);};})(r);
  r.appendChild(raw);
  var rm=el('button','homerm','✕'); rm.title='Remove from reel'; rm.onclick=function(){ if(r.parentNode)r.parentNode.removeChild(r); dirty(); refreshPicker(); updateHomeCount(); }; r.appendChild(rm);
  return r;
}
function updateHomeCount(){ var h=document.querySelector('#homeSec .count'); if(h) h.textContent=document.querySelectorAll('#homeList .row').length+' reel videos'; }
function buildHome(root){
  var items=(ORDER.homeList&&ORDER.homeList.length)?ORDER.homeList:HOMEDEF;
  var sec=el('div','sec'); sec.id='homeSec';
  sec.appendChild(headEl('Home', items.length+' reel videos', false));
  var body=el('div','sec-body'); body.appendChild(fldLabels(true));
  var list=el('div','plist'); list.id='homeList';
  items.forEach(function(it){ list.appendChild(homeRow(it)); });
  body.appendChild(list);
  var addBtn=el('button','addvid','+  Add video'); addBtn.onclick=function(){ var p=document.getElementById('homePicker'); var show=p.style.display==='none'; p.style.display=show?'block':'none'; addBtn.textContent=show?'×  Close picker':'+  Add video'; if(show) buildPicker(); };
  body.appendChild(addBtn);
  var picker=el('div','picker'); picker.id='homePicker'; picker.style.display='none'; body.appendChild(picker);
  sec.appendChild(body); root.appendChild(sec);
  new Sortable(list,{animation:160,handle:'.grip',draggable:'.row',filter:'input',preventOnFilter:false,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',delay:160,delayOnTouchOnly:true,touchStartThreshold:6,onSort:dirty});
}
function buildPicker(){
  var p=document.getElementById('homePicker'); if(!p) return; p.innerHTML=''; var used=homeKeysInUse();
  p.appendChild(el('div','pickhint','All videos — tap Add to put one in the home reel'));
  DATA.categories.forEach(function(cat){
    p.appendChild(el('div','pickcat',catLabelDisplay(cat)));
    (DATA.projects[cat]||[]).forEach(function(m){
      var c=CATALOG[m.key]; if(!c) return;
      var row=el('div','pickrow'); row.appendChild(thumb(c.poster));
      row.appendChild(el('span','pl','<b>'+c.client+'</b> — '+c.title));
      var b=el('button','pickadd');
      if(used[m.key]){ b.textContent='Added'; b.disabled=true; b.classList.add('added'); }
      else { b.textContent='Add'; b.onclick=(function(key){return function(){ addHome(key); };})(m.key); }
      row.appendChild(b); p.appendChild(row);
    });
  });
}
function refreshPicker(){ var p=document.getElementById('homePicker'); if(p&&p.style.display!=='none') buildPicker(); }
function addHome(key){
  var c=CATALOG[key]; if(!c) return;
  var list=document.getElementById('homeList');
  var r=homeRow({key:key,client:c.client,title:c.title,video:c.video,poster:c.poster,cat:c.cat,start:''});
  list.appendChild(r); dirty(); refreshPicker(); updateHomeCount();
  r.scrollIntoView({block:'nearest'});
}

function render(){
  var root=document.getElementById('sections'); root.innerHTML='';

  buildHome(root);

  var catWrap=el('div'); catWrap.id='catWrap';
  ORDER.categories.forEach(function(cat){
    var list=ORDER.projects[cat]||[];
    var sec=el('div','sec cat-section'); sec.dataset.cat=cat;
    var chead=headEl(catLabelDisplay(cat),list.length+' projects',true);
    var caw=el('div','catarrows'); caw.innerHTML='<button class="ar up" title="Move up">\u25b2</button><button class="ar dn" title="Move down">\u25bc</button>';
    caw.querySelector('.up').onclick=(function(s){return function(){moveCat(s,-1);};})(sec);
    caw.querySelector('.dn').onclick=(function(s){return function(){moveCat(s,1);};})(sec);
    chead.appendChild(caw); sec.appendChild(chead);
    var body=el('div','sec-body'); body.appendChild(fldLabels(false));
    var pl=el('div','plist'); pl.dataset.cat=cat;
    list.forEach(function(key){
      var m=projMeta(cat,key); if(!m) return;
      var ov=(ORDER.meta||{})[m.mkey]||{};
      var r=el('div','row'); r.dataset.key=key; r.dataset.mkey=m.mkey;
      r.appendChild(el('span','grip','\u2261'));
      r.appendChild(thumb(m.poster));
      var f=el('div','fld');
      f.appendChild(inp('brand',ov.client!=null?ov.client:m.client));
      f.appendChild(inp('ttl',ov.title!=null?ov.title:m.title));
      r.appendChild(f);
      var raw=el('div','arrows'); raw.innerHTML='<button class="ar up" title="Move up">\u25b2</button><button class="ar dn" title="Move down">\u25bc</button>';
      raw.querySelector('.up').onclick=(function(rr){return function(){moveRow(rr,-1);};})(r);
      raw.querySelector('.dn').onclick=(function(rr){return function(){moveRow(rr,1);};})(r);
      r.appendChild(raw); pl.appendChild(r);
    });
    body.appendChild(pl);
    if(list.length>3){ sec.classList.add('collapsed');
      var mb=el('button','morebtn'); var hidden=list.length-3; mb.textContent='Show all '+list.length+' \u25be';
      mb.onclick=function(){ var c=sec.classList.toggle('collapsed'); mb.textContent=c?('Show all '+list.length+' \u25be'):('Show less \u25b4'); };
      body.appendChild(mb);
    }
    sec.appendChild(body); catWrap.appendChild(sec);
    new Sortable(pl,{animation:160,handle:'.grip',draggable:'.row',filter:'input',preventOnFilter:false,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',delay:160,delayOnTouchOnly:true,touchStartThreshold:6,onSort:dirty});
  });
  root.appendChild(catWrap);
  new Sortable(catWrap,{animation:160,handle:'.cat-grip',draggable:'.cat-section',ghostClass:'sortable-ghost',delay:160,delayOnTouchOnly:true,touchStartThreshold:6,onSort:dirty});

  var gs=el('div','sec'); gs.appendChild(headEl('Capabilities Deck Access','who can open the deck',false));
  var gb=el('div','sec-body'); gb.id='grantsBody'; gs.appendChild(gb); root.appendChild(gs);
  renderGrants();
}
function catLabelDisplay(c){ return c==='Visual Effects'?'VFX':c; }
function headEl(label,count,drag){
  var h=el('div','sec-head');
  if(drag) h.appendChild(el('span','cat-grip','\u2261'));
  h.appendChild(el('span','lbl',label));
  h.appendChild(el('span','count',count));
  h.appendChild(el('span','hint',drag?'drag \u2237 to reorder':''));
  return h;
}
function fldLabels(third){ var d=el('div','fldlabels'); d.appendChild(el('span','a','Brand')); d.appendChild(el('span','b','Project name')); if(third) d.appendChild(el('span','c','Start')); return d; }
function inp(cls,val,ph){ var i=el('input',cls); i.type='text'; i.value=val||''; if(ph)i.placeholder=ph; i.oninput=dirty; return i; }

function renderGrants(){
  var gb=document.getElementById('grantsBody'); if(!gb) return; gb.innerHTML='';
  if(GRANT_MODE==='copy_env') gb.appendChild(el('div','note','Live save isn\u2019t enabled on this deployment, so new emails appear below to paste into Vercel \u2192 CAPABILITIES_ALLOWED_EMAILS, then redeploy.'));
  GRANTS.forEach(function(g){
    var r=el('div','grant');
    r.appendChild(el('span','av',(g.email||'?').charAt(0)));
    r.appendChild(el('span','em',g.email));
    r.appendChild(el('span','src',(g.source||'grant').indexOf('allowlist')>=0?'allowlist':'invited'));
    if((g.source||'').indexOf('allowlist')<0){ var b=el('button','rm','Remove'); b.onclick=function(){ revoke(g.email); }; r.appendChild(b); }
    gb.appendChild(r);
  });
  var add=el('div','addrow');
  var i=el('input'); i.id='grantEmail'; i.type='email'; i.placeholder='Add email\u2026  name@email.com'; i.autocomplete='off';
  var b=el('button','btn'); b.textContent='Grant'; b.onclick=function(){ grant(i.value); };
  i.addEventListener('keydown',function(e){ if(e.key==='Enter') grant(i.value); });
  add.appendChild(i); add.appendChild(b); gb.appendChild(add);
  var cb=el('div','copybox'); cb.id='grantCopy'; gb.appendChild(cb);
}

function moveRow(r,dir){ var sib=dir<0?r.previousElementSibling:r.nextElementSibling; if(!sib)return; var p=r.parentNode; if(dir<0)p.insertBefore(r,sib); else p.insertBefore(sib,r); var sec=r.closest('.cat-section'); if(sec)sec.classList.remove('collapsed'); r.style.background='rgba(107,138,253,.16)'; setTimeout(function(){r.style.background='';},300); dirty(); }
function moveCat(sec,dir){ var sib=dir<0?sec.previousElementSibling:sec.nextElementSibling; if(!sib||!sib.classList.contains('cat-section'))return; var p=sec.parentNode; if(dir<0)p.insertBefore(sec,sib); else p.insertBefore(sib,sec); dirty(); }
var dirtyFlag=false;
function dirty(){ if(!dirtyFlag){ dirtyFlag=true; var d=document.getElementById('statDot'),m=document.getElementById('saveMsg'); if(d){d.className='dot unsaved';} if(m)m.textContent='Unpublished changes'; } }
function setLive(txt){ var d=document.getElementById('statDot'),m=document.getElementById('saveMsg'); if(d)d.className='dot live'; if(m)m.textContent=txt||'All published'; }

function collect(){
  var out={categories:[],projects:{},meta:{},homeList:[]};
  document.querySelectorAll('#catWrap .cat-section').forEach(function(sec){
    var cat=sec.dataset.cat; out.categories.push(cat); out.projects[cat]=[];
    sec.querySelectorAll('.plist .row').forEach(function(r){ out.projects[cat].push(r.dataset.key); var ins=r.querySelectorAll('input'); out.meta[r.dataset.mkey]={client:ins[0].value.trim(),title:ins[1].value.trim()}; });
  });
  document.querySelectorAll('#homeList .row').forEach(function(r){ var ins=r.querySelectorAll('input'); out.homeList.push({key:r.dataset.key,client:ins[0].value.trim(),title:ins[1].value.trim(),start:ins[2].value.trim(),video:r.dataset.video,poster:r.dataset.poster,cat:r.dataset.cat}); });
  return out;
}

function loadAll(cb){
  var done=0; function step(){ done++; if(done>=2) cb&&cb(); }
  fetch('/api/site-order').then(function(r){return r.json();}).then(function(d){ ORDER=mergeOrder(d&&d.order); step(); }).catch(function(){ ORDER=defaultOrder(); step(); });
  fetch('/api/capabilities/admin/list').then(function(r){return r.json();}).then(function(d){ if(d&&d.ok){ GRANTS=d.grants||[]; GRANT_MODE=d.canPersistGrants?null:'copy_env'; } step(); }).catch(function(){ step(); });
}
function showApp(){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('bar').style.display='block'; loadAll(function(){ render(); setLive('All published'); }); }

fetch('/api/capabilities/admin/list').then(function(r){ if(r.ok) showApp(); }).catch(function(){});

document.getElementById('loginBtn').onclick=function(){
  var pw=document.getElementById('pw').value; var msg=document.getElementById('loginMsg'); msg.textContent='Signing in\u2026';
  fetch('/api/capabilities/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
   .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok){ showApp(); } else { msg.textContent=(d&&d.error)||'Wrong password'; } }).catch(function(){ msg.textContent='Network error'; });
};
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutBtn').onclick=function(){ fetch('/api/capabilities/admin/logout',{method:'POST'}).then(function(){ location.reload(); }).catch(function(){ location.reload(); }); };

document.getElementById('saveBtn').onclick=function(){
  var btn=this; btn.disabled=true; var m=document.getElementById('saveMsg'); if(m)m.textContent='Publishing\u2026';
  fetch('/api/site-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:collect()})})
   .then(function(r){return r.json();}).then(function(d){ btn.disabled=false; if(d&&d.ok){ dirtyFlag=false; setLive('Published \u2713 live now'); } else { if(m)m.textContent=(d&&d.error)||'Save failed'; } })
   .catch(function(){ btn.disabled=false; if(m)m.textContent='Network error'; });
};
document.getElementById('resetBtn').onclick=function(){ loadAll(function(){ render(); dirtyFlag=false; setLive('Reverted to last published'); }); };

function grant(email){
  email=(email||'').trim(); if(!email||email.indexOf('@')<0) return;
  fetch('/api/capabilities/admin/grant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
   .then(function(r){return r.json();}).then(function(d){
     if(d&&d.ok&&d.mode==='saved'){ loadAll(renderGrants); }
     else if(d&&d.ok&&d.mode==='copy_env'){ GRANT_MODE='copy_env'; renderGrants(); var c=document.getElementById('grantCopy'); c.style.display='block'; c.textContent=d.suggestedAllowedEmails||''; }
     else { alert((d&&d.error)||'Grant failed'); }
   }).catch(function(){ alert('Network error'); });
}
function revoke(email){
  if(!confirm('Remove access for '+email+'?')) return;
  fetch('/api/capabilities/admin/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
   .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok){ loadAll(renderGrants); } else { alert((d&&d.error)||'Revoke failed'); } }).catch(function(){ alert('Network error'); });
}
