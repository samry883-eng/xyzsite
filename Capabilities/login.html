<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — XYZ Studios</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deck-pad-x: clamp(24px, 4vw, 64px);
    }
    html, body {
      min-height: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Micross, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── Left: slide 1 cover copy (no hero image) ── */
    .split-left {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #000;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .split-left .wordmark {
      position: absolute;
      top: clamp(20px, 3vh, 36px);
      left: var(--deck-pad-x);
      z-index: 2;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .cover-zone {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(80px, 12vh, 120px) var(--deck-pad-x);
    }
    .cover-title {
      margin: 0;
      font-size: clamp(36px, 5.2vw, 72px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.035em;
      color: #fff;
    }
    .cover-sub {
      font-size: clamp(11px, 1.1vw, 13px);
      color: rgba(255, 255, 255, 0.92);
      margin-top: clamp(16px, 2.5vh, 24px);
      font-weight: 400;
      line-height: 1.45;
      max-width: 28em;
    }
    .foot-inline {
      margin-top: clamp(28px, 4vh, 40px);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 0.02em;
    }

    /* ── Right: same field + CTA language as Contact / deck modal ── */
    .split-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(40px, 8vh, 80px) clamp(28px, 5vw, 56px);
      background: #000;
    }
    .login-shell {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    /* Request modal typography (Contact/index.html) */
    .deck-title {
      font: 400 26px/1.1 Micross, Arial, sans-serif;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 10px;
    }
    .deck-sub {
      font: 400 11px/1.65 Micross, Arial, sans-serif;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 44px;
    }

    .ct-field {
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 0 11px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .ct-field:focus-within {
      border-color: rgba(255, 255, 255, 0.28);
    }
    .ct-label {
      position: absolute;
      top: 20px;
      left: 0;
      font: 400 9px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.16);
      transition:
        top 0.22s cubic-bezier(0.16, 1, 0.3, 1),
        font-size 0.22s cubic-bezier(0.16, 1, 0.3, 1),
        color 0.22s;
      pointer-events: none;
    }
    .ct-field:focus-within .ct-label,
    .ct-field.filled .ct-label {
      top: 2px;
      font-size: 7px;
      color: rgba(255, 255, 255, 0.38);
    }
    .ct-field input {
      background: none;
      border: none;
      outline: none;
      width: 100%;
      font: 400 12px/1.5 Micross, Arial, sans-serif;
      color: #fff;
      caret-color: rgba(255, 255, 255, 0.5);
    }
    .ct-field input:-webkit-autofill,
    .ct-field input:-webkit-autofill:hover,
    .ct-field input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px #000 inset;
      -webkit-text-fill-color: #fff;
      transition: background-color 5000s ease-in-out 0s;
    }
    .ct-field--last {
      margin-bottom: 8px;
    }
    .ct-submit {
      font: 700 8px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.32);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-align: left;
      transition: color 0.2s;
      margin-top: 8px;
    }
    .ct-submit:hover:not(:disabled) {
      color: #fff;
    }
    .ct-submit:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .err {
      font: 400 11px/1.5 Micross, Arial, sans-serif;
      color: rgba(255, 140, 130, 0.95);
      margin: 0 0 16px;
      min-height: 1.35em;
    }

    @media (max-width: 900px) {
      .split {
        grid-template-columns: 1fr;
      }
      .split-left {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        min-height: auto;
      }
      .cover-zone {
        justify-content: flex-end;
        padding-bottom: clamp(32px, 6vh, 48px);
      }
    }
  </style>
</head>
<body>
  <div class="split">
    <aside class="split-left" aria-label="Capabilities deck">
      <div class="wordmark">XYZSTUDIOS</div>
      <div class="cover-zone">
        <h1 class="cover-title">Capabilities<br />Deck</h1>
        <p class="cover-sub">This isn't work for hire. It's a partnership.</p>
        <p class="foot-inline">© XYZStudios · Capabilities</p>
      </div>
    </aside>

    <main class="split-right">
      <div class="login-shell">
        <div class="deck-title">Login</div>
        <div class="deck-sub">Enter the email you used to request access.</div>

        <form id="f" autocomplete="on" novalidate>
          <div class="ct-field ct-field--last" id="email-field">
            <label class="ct-label" for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              inputmode="email"
            />
          </div>
          <div class="err" id="err" aria-live="polite"></div>
          <button type="submit" class="ct-submit" id="btn">Enter &rarr;</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var email = document.getElementById('email');
      var field = document.getElementById('email-field');
      function syncFilled() {
        field.classList.toggle('filled', (email.value || '').length > 0);
      }
      email.addEventListener('input', syncFilled);
      syncFilled();

      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || '/capabilities/';
      function safeNext(n) {
        if (!n || !n.startsWith('/capabilities') || n.indexOf('//') !== -1) return '/capabilities/';
        return n;
      }
      var target = safeNext(next);
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      var form = document.getElementById('f');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.textContent = '';
        btn.disabled = true;
        var v = email.value.trim();
        fetch('/api/capabilities/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: v }),
        })
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, data: data };
            });
          })
          .then(function (x) {
            if (!x.ok || !x.data.ok) {
              err.textContent = x.data.error || 'Something went wrong.';
              btn.disabled = false;
              return;
            }
            window.location.href = target;
          })
          .catch(function () {
            err.textContent = 'Network error.';
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
