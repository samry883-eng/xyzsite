<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XYZStudios — Capabilities</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0b0b0b;
      --white: #ffffff;
      --dim: rgba(255, 255, 255, 0.42);
      --line: rgba(255, 255, 255, 0.12);
      --deck-pad-x: clamp(24px, 4vw, 64px);
      --ease: cubic-bezier(0.76, 0, 0.24, 1);
    }
    html, body {
      min-height: 100%;
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: "Microsoft Sans Serif", "Segoe UI", Tahoma, Geneva, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── Left: same content structure as slide 1 cover (deck index) ── */
    .split-left {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #000;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .split-left .wordmark {
      position: absolute;
      top: clamp(20px, 3vh, 36px);
      left: var(--deck-pad-x);
      z-index: 2;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .cover-year-bg {
      position: absolute;
      left: 8%;
      top: 42%;
      transform: translateY(-50%);
      font-size: clamp(72px, 14vw, 200px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.07em;
      color: rgba(255, 255, 255, 0.055);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    .cover-zone {
      position: relative;
      z-index: 1;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(72px, 10vh, 100px) var(--deck-pad-x) clamp(24px, 4vh, 40px);
    }
    .cover-head-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(9rem, 14rem);
      align-items: end;
      gap: clamp(16px, 3vw, 40px);
    }
    .cover-title-col {
      min-width: 0;
    }
    .cover-title {
      margin: 0;
      font-size: clamp(36px, 5.2vw, 72px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.035em;
      color: #fff;
    }
    .cover-contact {
      text-align: right;
      justify-self: end;
      max-width: 15rem;
    }
    .cover-contact strong {
      display: block;
      font-weight: 600;
      font-size: 12px;
      line-height: 1.4;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .cover-contact-email {
      display: block;
      font-size: 10.5px;
      line-height: 1.65;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 6px;
    }
    .cover-contact-meta {
      display: block;
      font-size: 10px;
      line-height: 1.55;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.42);
    }
    .cover-sub {
      font-size: clamp(11px, 1.1vw, 13px);
      color: rgba(255, 255, 255, 0.92);
      margin-top: clamp(12px, 2vh, 20px);
      font-weight: 400;
      line-height: 1.45;
      max-width: 28em;
    }
    .cover-photo-strip {
      flex: 0 0 clamp(120px, 28vh, 240px);
      min-height: 120px;
      position: relative;
      background: #050505;
      overflow: hidden;
    }
    .cover-photo-strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 58% 42%;
      display: block;
    }
    .foot-inline {
      margin-top: clamp(20px, 3vh, 32px);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 0.02em;
    }

    /* ── Right: login (underline field + circular CTA) ── */
    .split-right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 6vh, 64px) clamp(28px, 5vw, 56px) 160px;
      background: #000;
    }
    .login-shell {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }
    .login-shell h2 {
      font-size: clamp(32px, 4.5vw, 44px);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
      text-align: center;
    }
    .login-lead {
      font-size: 14px;
      line-height: 1.5;
      color: var(--dim);
      text-align: center;
      margin-bottom: 36px;
      font-weight: 400;
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 10px;
    }
    .field {
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 12px 0 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--white);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.35s var(--ease);
    }
    .field input::placeholder {
      color: rgba(255, 255, 255, 0.22);
    }
    .field input:focus {
      border-bottom-color: rgba(255, 255, 255, 0.38);
    }
    .err {
      font-size: 13px;
      line-height: 1.45;
      color: rgba(255, 130, 120, 0.92);
      text-align: center;
      margin-top: 20px;
      min-height: 1.35em;
    }

    /* Circular SIGN IN — bottom-right of right panel (reference) */
    .cta-circle {
      position: absolute;
      right: clamp(24px, 4vw, 48px);
      bottom: clamp(24px, 4vw, 48px);
      width: clamp(100px, 22vw, 132px);
      height: clamp(100px, 22vw, 132px);
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      border: none;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s var(--ease), opacity 0.25s var(--ease);
    }
    .cta-circle:hover:not(:disabled) {
      transform: scale(1.03);
      opacity: 0.92;
    }
    .cta-circle:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .split {
        grid-template-columns: 1fr;
      }
      .split-left {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        min-height: auto;
      }
      .cover-head-row {
        grid-template-columns: 1fr;
        align-items: start;
      }
      .cover-contact {
        text-align: left;
        justify-self: start;
        max-width: none;
        margin-top: 8px;
      }
      .cover-year-bg {
        left: 3%;
        font-size: clamp(56px, 22vw, 120px);
      }
      .split-right {
        padding-bottom: 140px;
        min-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="split">
    <aside class="split-left" aria-label="Capabilities deck">
      <div class="wordmark">XYZSTUDIOS</div>
      <div class="cover-year-bg" aria-hidden="true">2026</div>
      <div class="cover-zone">
        <div class="cover-head-row">
          <div class="cover-title-col">
            <h1 class="cover-title">Capabilities<br />Deck</h1>
          </div>
          <div class="cover-contact">
            <strong>XYZStudios</strong>
            <span class="cover-contact-email">Inquiries@xyzstudios.co</span>
            <span class="cover-contact-meta">International Post-Production Studio | Founded in 2024</span>
          </div>
        </div>
        <p class="cover-sub">This isn't work for hire. It's a partnership.</p>
        <p class="foot-inline">© XYZStudios · Capabilities</p>
      </div>
      <div class="cover-photo-strip">
        <img
          src="/capabilities/assets/cover-hero.png"
          width="1920"
          height="1080"
          alt=""
          decoding="async"
        />
      </div>
    </aside>

    <main class="split-right">
      <div class="login-shell">
        <h2>Login</h2>
        <p class="login-lead">Enter the email you used to request access.</p>
        <form id="f" autocomplete="on" novalidate>
          <label class="field-label" for="email">Email</label>
          <div class="field">
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="you@company.com"
              required
            />
          </div>
          <div class="err" id="err" aria-live="polite"></div>
        </form>
      </div>
      <button type="submit" class="cta-circle" id="btn" form="f">Sign in</button>
    </main>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || '/capabilities/';
      function safeNext(n) {
        if (!n || !n.startsWith('/capabilities') || n.indexOf('//') !== -1) return '/capabilities/';
        return n;
      }
      var target = safeNext(next);
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      var form = document.getElementById('f');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.textContent = '';
        btn.disabled = true;
        var email = document.getElementById('email').value.trim();
        fetch('/api/capabilities/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email }),
        })
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, data: data };
            });
          })
          .then(function (x) {
            if (!x.ok || !x.data.ok) {
              err.textContent = x.data.error || 'Something went wrong.';
              btn.disabled = false;
              return;
            }
            window.location.href = target;
          })
          .catch(function () {
            err.textContent = 'Network error.';
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
