<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Micross, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ct-field {
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 0 10px;
      margin: 0 auto 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .ct-field:focus-within { border-color: rgba(255, 255, 255, 0.28); }
    .ct-field input {
      background: none;
      border: none;
      outline: none;
      width: 100%;
      font: 400 13px/1.5 Micross, Arial, sans-serif;
      color: #fff;
      text-align: center;
    }
    .ct-submit {
      font: 700 8px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 4px;
      transition: color 0.2s;
      text-align: center;
    }
    .ct-submit:hover { color: #fff; }
    .err {
      font: 400 11px/1.5 Micross, Arial, sans-serif;
      color: rgba(255, 140, 130, 0.95);
      margin: 0 0 12px;
      min-height: 1.2em;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="ct-field">
      <input type="password" id="admin-pass" autocomplete="current-password" required aria-label="Password" />
    </div>
    <div class="err" id="login-err" aria-live="polite"></div>
    <button type="button" class="ct-submit" id="btn-login">Sign in &rarr;</button>
  </div>

  <script>
    (function () {
      var loginErr = document.getElementById('login-err');

      document.getElementById('btn-login').addEventListener('click', function () {
        loginErr.textContent = '';
        var password = document.getElementById('admin-pass').value;
        fetch('/api/capabilities/admin/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password }),
        })
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, data: data };
            });
          })
          .then(function (x) {
            if (!x.ok) {
              loginErr.textContent = (x.data && x.data.error) || 'Sign in failed';
              return;
            }
            window.location.href = '/capabilities/';
          })
          .catch(function () {
            loginErr.textContent = 'Network error.';
          });
      });
    })();
  </script>
</body>
</html>
