<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — XYZ Studios</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Micross, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: clamp(40px, 8vh, 72px) 28px 64px;
    }
    .wordmark {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    h1 {
      font: 400 clamp(26px, 4vw, 32px) / 1.12 Micross, Arial, sans-serif;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .sub {
      font: 400 12px/1.55 Micross, Arial, sans-serif;
      color: rgba(255, 255, 255, 0.34);
      margin-bottom: 36px;
    }
    .ct-field {
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 0 12px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .ct-field:focus-within { border-color: rgba(255, 255, 255, 0.28); }
    .ct-label {
      position: absolute;
      top: 20px;
      left: 0;
      font: 400 9px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.18);
      transition: top 0.2s, font-size 0.2s, color 0.2s;
      pointer-events: none;
    }
    .ct-field:focus-within .ct-label,
    .ct-field.filled .ct-label {
      top: 2px;
      font-size: 7px;
      color: rgba(255, 255, 255, 0.38);
    }
    .ct-field input {
      background: none;
      border: none;
      outline: none;
      width: 100%;
      font: 400 13px/1.5 Micross, Arial, sans-serif;
      color: #fff;
    }
    .ct-submit {
      font: 700 8px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 4px;
      transition: color 0.2s;
    }
    .ct-submit:hover { color: #fff; }
    .err {
      font: 400 11px/1.5 Micross, Arial, sans-serif;
      color: rgba(255, 140, 130, 0.95);
      margin: 0 0 12px;
      min-height: 1.2em;
    }
    .hidden { display: none !important; }
    .back {
      display: inline-block;
      font: 400 11px/1 Micross, Arial, sans-serif;
      color: rgba(255, 255, 255, 0.32);
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-bottom: 32px;
    }
    .back:hover { color: #fff; }
    /* Logged-in: minimal list */
    .section-label {
      font: 700 8px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
      margin: 40px 0 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font: 400 12px/1.5 Micross, Arial, sans-serif;
    }
    th, td {
      text-align: left;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    th {
      font: 700 7px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3);
    }
    .row-actions button {
      font: 700 8px/1 Micross, Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      background: none;
      border: none;
      cursor: pointer;
    }
    .row-actions button:hover { color: #fff; }
    .toolbar { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="/capabilities/login">Deck login</a>

    <div id="login-panel">
      <div class="wordmark">XYZSTUDIOS</div>
      <h1>Admin</h1>
      <p class="sub">Capabilities deck access. Password only.</p>

      <div class="ct-field" id="f-admin-pass">
        <label class="ct-label" for="admin-pass">Password</label>
        <input type="password" id="admin-pass" autocomplete="current-password" required />
      </div>
      <div class="err" id="login-err" aria-live="polite"></div>
      <button type="button" class="ct-submit" id="btn-login">Sign in &rarr;</button>
    </div>

    <div id="admin-panel" class="hidden">
      <div class="wordmark">XYZSTUDIOS</div>
      <h1>Capabilities</h1>
      <p class="sub">Who can open the deck.</p>

      <div class="toolbar">
        <button type="button" class="ct-submit" id="btn-logout">Sign out</button>
      </div>

      <div class="section-label">Allowed emails</div>
      <div class="err" id="list-err" aria-live="polite"></div>
      <table>
        <thead>
          <tr><th>Email</th><th>Added</th><th></th></tr>
        </thead>
        <tbody id="grant-rows"></tbody>
      </table>

      <div class="section-label">Add email</div>
      <div class="ct-field" id="f-new-email">
        <label class="ct-label" for="new-email">Email</label>
        <input type="email" id="new-email" autocomplete="off" />
      </div>
      <div class="err" id="add-err" aria-live="polite"></div>
      <button type="button" class="ct-submit" id="btn-add">Add &rarr;</button>
    </div>
  </div>

  <script>
    (function () {
      var loginPanel = document.getElementById('login-panel');
      var adminPanel = document.getElementById('admin-panel');
      var loginErr = document.getElementById('login-err');
      var listErr = document.getElementById('list-err');
      var addErr = document.getElementById('add-err');
      var grantRows = document.getElementById('grant-rows');

      function floatLabel(id) {
        var input = document.getElementById(id);
        if (!input) return;
        var field = input.closest('.ct-field');
        function check() {
          field.classList.toggle('filled', (input.value || '').length > 0);
        }
        input.addEventListener('input', check);
        check();
      }
      floatLabel('admin-pass');
      floatLabel('new-email');

      function api(path, opts) {
        opts = opts || {};
        opts.credentials = 'include';
        opts.headers = opts.headers || {};
        if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(opts.body);
        }
        return fetch(path, opts).then(function (r) {
          return r.json().then(function (data) {
            return { ok: r.ok, status: r.status, data: data };
          });
        });
      }

      function renderRows(grants) {
        grantRows.innerHTML = '';
        (grants || []).forEach(function (g) {
          var tr = document.createElement('tr');
          var td1 = document.createElement('td');
          td1.textContent = g.email;
          var td2 = document.createElement('td');
          td2.textContent = g.createdAt ? new Date(g.createdAt).toLocaleString() : '—';
          var td3 = document.createElement('td');
          td3.className = 'row-actions';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Remove';
          btn.addEventListener('click', function () {
            api('/api/capabilities/admin/revoke', {
              method: 'POST',
              body: { email: g.email },
            }).then(function (x) {
              if (!x.ok) {
                listErr.textContent = (x.data && x.data.error) || 'Could not remove';
                return;
              }
              listErr.textContent = '';
              refreshList();
            });
          });
          td3.appendChild(btn);
          tr.appendChild(td1);
          tr.appendChild(td2);
          tr.appendChild(td3);
          grantRows.appendChild(tr);
        });
      }

      function refreshList() {
        listErr.textContent = '';
        return api('/api/capabilities/admin/list').then(function (x) {
          if (x.status === 401) {
            loginPanel.classList.remove('hidden');
            adminPanel.classList.add('hidden');
            return;
          }
          if (!x.ok) {
            listErr.textContent = (x.data && x.data.error) || 'Could not load list';
            return;
          }
          renderRows(x.data.grants);
        });
      }

      function showAdmin() {
        loginPanel.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        return refreshList();
      }

      document.getElementById('btn-login').addEventListener('click', function () {
        loginErr.textContent = '';
        var password = document.getElementById('admin-pass').value;
        api('/api/capabilities/admin/login', {
          method: 'POST',
          body: { password: password },
        }).then(function (x) {
          if (!x.ok) {
            loginErr.textContent = (x.data && x.data.error) || 'Sign in failed';
            return;
          }
          document.getElementById('admin-pass').value = '';
          document.getElementById('f-admin-pass').classList.remove('filled');
          showAdmin();
        });
      });

      document.getElementById('btn-logout').addEventListener('click', function () {
        api('/api/capabilities/admin/logout', { method: 'POST' }).then(function () {
          loginPanel.classList.remove('hidden');
          adminPanel.classList.add('hidden');
        });
      });

      document.getElementById('btn-add').addEventListener('click', function () {
        addErr.textContent = '';
        var email = document.getElementById('new-email').value.trim();
        api('/api/capabilities/admin/grant', {
          method: 'POST',
          body: { email: email },
        }).then(function (x) {
          if (!x.ok) {
            addErr.textContent = (x.data && x.data.error) || 'Could not add';
            return;
          }
          document.getElementById('new-email').value = '';
          document.getElementById('f-new-email').classList.remove('filled');
          refreshList();
        });
      });

      api('/api/capabilities/admin/list').then(function (x) {
        if (x.status === 401) return;
        if (x.ok && x.data && x.data.grants) {
          loginPanel.classList.add('hidden');
          adminPanel.classList.remove('hidden');
          renderRows(x.data.grants);
        }
      });
    })();
  </script>
</body>
</html>
