<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capabilities — XYZ Studios</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    @font-face {
      font-family: 'Micross';
      src: url('/assets/micross.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Micross, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .deck-choose {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
    }
    .deck-choose__half {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: clamp(32px, 5vw, 64px);
      text-decoration: none;
      color: #fff;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.45s ease;
    }
    .deck-choose__half::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.03);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }
    .deck-choose__half:hover::before,
    .deck-choose__half:focus-visible::before {
      opacity: 1;
    }
    .deck-choose__half--vfx {
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      background: #050505;
    }
    .deck-choose__half--sound {
      background: #0a0a0a;
    }
    .deck-choose__eyebrow {
      position: relative;
      z-index: 1;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 16px;
    }
    .deck-choose__title {
      position: relative;
      z-index: 1;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
    .deck-choose__cta {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .deck-choose__half:hover .deck-choose__cta,
    .deck-choose__half:focus-visible .deck-choose__cta {
      color: #fff;
      transform: translateX(6px);
    }
    .deck-choose__wordmark {
      position: fixed;
      top: clamp(24px, 4vh, 40px);
      left: clamp(24px, 4vw, 48px);
      z-index: 10;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }
    @media (max-width: 760px) {
      .deck-choose {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
        overflow-y: auto;
      }
      .deck-choose__half--vfx {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        min-height: 50vh;
      }
      .deck-choose__half--sound {
        min-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="deck-choose__wordmark" aria-hidden="true">XYZ Studios</div>

  <div class="deck-choose">
    <a class="deck-choose__half deck-choose__half--vfx" href="/capabilities/vfx/" id="pick-vfx">
      <span class="deck-choose__eyebrow">Capabilities</span>
      <h1 class="deck-choose__title">VFX</h1>
      <span class="deck-choose__cta">Open deck &rarr;</span>
    </a>
    <a class="deck-choose__half deck-choose__half--sound" href="/capabilities/sound/" id="pick-sound">
      <span class="deck-choose__eyebrow">Capabilities</span>
      <h1 class="deck-choose__title">Sound</h1>
      <span class="deck-choose__cta">Open deck &rarr;</span>
    </a>
  </div>
</body>
</html>
