<!DOCTYPE html>
<html lang="en" class="deck-protect">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XYZ Studios — Capabilities</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/xyz-nav-font.css">
<link rel="stylesheet" href="/capabilities/assets/nda-modal.css">
<style>
  @font-face{font-family:'Micross';src:url('/assets/micross.ttf') format('truetype');font-weight:400 700;font-display:swap}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#000;--ink:#fff;--dim:rgba(255,255,255,.5);--faint:rgba(255,255,255,.28);--line:rgba(255,255,255,.12);--ease:cubic-bezier(.16,1,.3,1);--nav-h:clamp(52px,9vh,80px)}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Micross',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  html.deck-protect,html.deck-protect body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  img{-webkit-user-drag:none}
  nav{position:fixed;top:0;left:0;right:0;z-index:1001;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,48px);background:transparent;pointer-events:auto}
  .nav-logo img{height:29px;width:auto;display:block}
  .wrap{position:fixed;inset:0;display:flex}
  .panel{position:relative;flex:1 1 50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);overflow:hidden;cursor:pointer;transition:flex-grow .8s var(--ease);background:#050505}
  .panel+.panel{border-left:1px solid var(--line)}
  .panel-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.3;transform:scale(1.06);transition:opacity .8s var(--ease),transform 1.4s var(--ease);filter:grayscale(.4)}
  .panel-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.3) 45%,rgba(0,0,0,.82))}
  .panel-inner{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;padding:0 24px;transition:transform .8s var(--ease)}
  .kick{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);margin-bottom:22px}
  .title{font-size:clamp(52px,8vw,120px);font-weight:700;letter-spacing:-.04em;line-height:.86;text-transform:uppercase}
  .sub{margin-top:22px;max-width:30ch;font-size:12px;font-weight:400;line-height:1.7;color:var(--dim)}
  .cta{margin-top:30px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;color:#fff;opacity:0;transform:translateY(8px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
  .cta .arr{transition:transform .55s var(--ease)}
  @media (hover:hover) and (min-width:880px){
    .wrap:hover .panel{flex-grow:.82}
    .wrap:hover .panel:hover{flex-grow:1.36}
    .panel:hover .panel-bg{opacity:.62;transform:scale(1);filter:grayscale(0)}
    .panel:hover .cta{opacity:1;transform:translateY(0)}
    .panel:hover .cta .arr{transform:translateX(6px)}
    .panel:hover .panel-inner{transform:translateY(-6px)}
  }
  @media (max-width:879px){
    .wrap{flex-direction:column}
    .panel+.panel{border-left:none;border-top:1px solid var(--line)}
    .cta{opacity:.85;transform:none}
    .title{font-size:clamp(44px,15vw,80px)}
    .panel-bg{opacity:.4}
  }
</style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/">
      <img src="https://cdn.prod.website-files.com/6917408c1d0fee8fc2c58505/691f47e2f734702aa3a0675f_xyz-logo.png" alt="XYZ Studios">
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/work/">WORK</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>
  <div class="wrap">
    <a class="panel" href="/capabilities/vfx" aria-label="VFX capabilities deck">
      <div class="panel-bg" style="background-image:url('/capabilities/vfx/media/cover-photo.jpg')"></div>
      <div class="panel-inner">
        <div class="kick">Post-Production</div>
        <div class="title">VFX</div>
        <p class="sub">Creative direction, CG, environments, compositing and finishing &mdash; concept to final frame.</p>
        <span class="cta">View deck <span class="arr">&rarr;</span></span>
      </div>
    </a>
    <a class="panel" href="/capabilities/sound" aria-label="Sound capabilities deck">
      <div class="panel-bg" style="background-image:url('https://cdn.prod.website-files.com/69174740184591f142f019c1/69c0b94d0ebe8f3b86741b7a_214a3ae2-01ca-4593-8949-98a7191f6548.mp4_snapshot_00.12.156.jpg')"></div>
      <div class="panel-inner">
        <div class="kick">Audio</div>
        <div class="title">Sound</div>
        <p class="sub">Sound design, foley, mix and original composition &mdash; built to match the visual tone.</p>
        <span class="cta">View deck <span class="arr">&rarr;</span></span>
      </div>
    </a>
  </div>
  <script src="/capabilities/assets/nda-modal.js" defer></script>
</body>
</html>
