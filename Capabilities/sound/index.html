   var build=s.build.map(function(b){return '<div class="build-row"><span class="bv">'+e(b[0])+'</span><span class="bl">'+e(b[1])+'</span></div>';}).join('');
   var specs=s.specs.map(function(sp){return '<div class="spec-row"><span class="sk">'+e(sp[0])+'</span><span class="sv"><div class="v">'+e(sp[1])+'</div><div class="sub">'+e(sp[2])+'</div></span></div>';}).join('');
   return '<div class="top"><div class="pleft"><div class="lab">'+e(s.label)+'</div><div class="pname1">'+Tinline(s.client)+'</div><div class="pname2">'+Tinline(s.name)+'</div><div class="lab" style="margin-top:14px">'+e(s.disc)+'</div></div><div class="pimg"'+bg(s.img)+'></div></div>'
    +'<div class="fill"></div><div class="hr"></div>'
    +'<div class="bot"><div><div class="lab">Scope</div><div class="scopelist">'+scope+'</div><div class="lab" style="margin-top:18px">Director</div><div style="margin-top:6px;font-size:13px">'+e(s.director)+'</div></div>'
    +'<div><div class="lab">Build</div>'+build+'</div><div>'+specs+'</div></div>';},
 beforeafter:function(s){
   function lanes(side,kind){var rows=side.rows.map(function(r){return '<div class="lane"><span class="ln">'+e(r[0])+'</span><span class="trk">'+segs(r[1],kind)+'</span><span class="tt">'+e(r[2])+'</span></div>';}).join('');
     return '<div><div class="lane-head"><b>'+(kind==='before'?'↑ Before':'→ After')+'</b><span>'+e(side.label)+'</span></div>'+rows+'</div>';}
   return '<div class="labk" style="margin-top:5vh">↗ Before → After</div><div class="head" style="margin-top:14px">'+T(s.title)+'<div class="note">'+e(s.note)+'</div></div>'
     +'<div class="lanes">'+lanes(s.before,'before')+lanes(s.after,'after')+'</div>'
     +'<div class="baimgs"><div class="baimg"'+bg(s.imgBefore)+'></div><div class="baimg"'+bg(s.imgAfter)+'></div></div>';},
 pipeline:function(s){
   var tiles=s.tiles.map(function(t){return '<div class="tile"'+bg(t[0])+'><span class="cap">'+e(t[1])+'</span></div>';}).join('');
   var steps=s.steps.map(function(st,i){return '<span class="step"><span class="sn">0'+(i+1)+'</span><span class="st">'+e(st)+'</span></span>'+(i<s.steps.length-1?'<span class="step-ar">→</span>':'');}).join('');
   return '<div style="margin-top:6vh"><div class="lab">'+e(s.kick)+'</div>'+T(s.title)+'<div class="body">'+e(s.body)+'</div></div><div class="fill"></div><div class="tiles">'+tiles+'</div><div class="steps">'+steps+'</div>';},
 packages:function(s){
   var tiers=s.tiers.map(function(t){return '<div class="tier'+(t.rec?' rec':'')+'"><div class="tag">'+e(t.tag)+'</div><div><div class="tname">'+Tinline(t.name)+'</div><div class="tdesc">'+e(t.desc)+'</div><div class="tinc">'+e(t.inc)+'</div></div><div class="tright"><div class="tfrom">From</div><div class="tprice">'+e(t.price)+'</div><div class="tfor">'+e(t.for)+'</div></div></div>';}).join('');
   return '<div class="pk-left"><div class="labk">'+e(s.kick)+'</div>'+T(s.title)+'<div class="body">'+e(s.body)+'</div></div><div class="pk-right">'+tiers+'</div>';},
 crew:function(s){var ppl=s.people.map(function(p){return '<div class="person"><div class="pr">'+e(p[0])+'</div><div class="pn">'+e(p[1])+'</div><div class="pd">'+e(p[2])+'</div></div>';}).join('');
   return '<div style="margin-top:7vh"><div class="labk">'+e(s.kick)+'</div>'+T(s.title)+'<div class="body">'+e(s.body)+'</div></div><div class="fill"></div><div class="people">'+ppl+'</div>';},
 contact:function(s){var f=s.founders.map(function(x){return '<div class="cb"><div class="cl">'+e(x[0])+'</div><div class="cv">'+e(x[1])+'</div><div class="cs">'+e(x[2])+'</div></div>';}).join('');
   return '<div style="margin-top:8vh">'+T(s.title)+'</div><div class="fill"></div><div class="cgrid"><div class="cb"><div class="cl">Email</div><div class="cv">'+e(s.email)+'</div><div class="cs">For new project enquiries</div></div><div class="cb"><div class="cl">Website</div><div class="cv">'+e(s.site)+'</div><div class="cs">'+e(s.social.join(' · '))+'</div></div>'+f+'</div>';}
};
function render(D){var h='';D.slides.forEach(function(s,i){h+='<section class="slide '+s.type+'" data-i="'+i+'">'+corners(s)+'<div class="inr" style="flex:1;display:flex;flex-direction:column">'+R[s.type](s)+'</div></section>';});
  document.getElementById('deck').innerHTML=h;}
fetch('/api/site-order',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){var d=(j&&j.order&&j.order.soundDeck&&j.order.soundDeck.slides)?j.order.soundDeck:D;render(d);}).catch(function(){render(D);});
</script>
</body>
</html>
