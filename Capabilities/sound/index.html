<!DOCTYPE html>
<html lang="en" class="deck-protect">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>XYZStudios — Sound Capabilities</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--black:#000;--white:#fff;--dim:rgba(255,255,255,.5);--ease:cubic-bezier(.76,0,.24,1)}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--black);color:var(--white);font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
  html.deck-protect,html.deck-protect body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html.deck-protect img{-webkit-user-drag:none}
  @media print{html.deck-protect body{display:none!important}}
  #vp{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:100%;height:100%}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .35s ease;display:flex;align-items:center;justify-content:center}
  .slide.active{opacity:1}
  .slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  .top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:22px 32px;pointer-events:none}
  .back{pointer-events:auto;text-decoration:none;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:color .3s}
  .back:hover{color:#fff}.back .a{transition:transform .4s var(--ease)}.back:hover .a{transform:translateX(-4px)}
  .meta{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s,background .3s;z-index:25}
  #vp:hover .nav{opacity:1}.nav:hover{background:rgba(255,255,255,.16)}.prev{left:18px}.next{right:18px}
  .dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:25}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);border:0;padding:0;cursor:pointer;transition:background .3s,transform .3s}
  .dot.active{background:rgba(255,255,255,.9);transform:scale(1.5)}
  #fs{position:absolute;bottom:18px;right:24px;z-index:25;background:none;border:1px solid rgba(255,255,255,.18);color:var(--dim);border-radius:6px;padding:6px 11px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;opacity:0;transition:color .3s,border-color .3s}
  #vp:hover #fs{opacity:1}#fs:hover{color:#fff;border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>
  <div id="vp">
    <div class="top">
      <a class="back" href="/capabilities/"><span class="a">&larr;</span> Capabilities</a>
      <span class="meta" id="ct">01 / 15</span>
    </div>
    <div class="stage" id="stage">
      <button class="nav prev" id="prev" aria-label="Previous">&#8249;</button>
      <button class="nav next" id="next" aria-label="Next">&#8250;</button>
    </div>
    <div class="dots" id="dots"></div>
    <button id="fs">Fullscreen</button>
  </div>
<script>
  var TOTAL=15;
  var PATH=function(i){return "slide-"+String(i+1).padStart(2,"0")+".jpg";};
  var stage=document.getElementById("stage"),dotsEl=document.getElementById("dots"),ct=document.getElementById("ct");
  var pad=function(n){return String(n).padStart(2,"0");},cur=0,slides=[];
  for(var i=0;i<TOTAL;i++){
    var s=document.createElement("div");s.className="slide"+(i===0?" active":"");
    var im=new Image();im.src=PATH(i);im.alt="Sound slide "+(i+1);im.loading=i<2?"eager":"lazy";
    s.appendChild(im);stage.insertBefore(s,document.getElementById("prev"));slides.push(s);
    var d=document.createElement("button");d.className="dot"+(i===0?" active":"");
    (function(n){d.addEventListener("click",function(){go(n);});})(i);dotsEl.appendChild(d);
  }
  var dots=[].slice.call(dotsEl.children);
  function go(n){cur=(n+TOTAL)%TOTAL;slides.forEach(function(s,i){s.classList.toggle("active",i===cur);});dots.forEach(function(d,i){d.classList.toggle("active",i===cur);});ct.textContent=pad(cur+1)+" / "+TOTAL;}
  function next(){go(cur+1);}function prev(){go(cur-1);}
  document.getElementById("next").onclick=next;document.getElementById("prev").onclick=prev;
  document.addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next();}if(e.key==="ArrowLeft")prev();if(e.key==="Escape"&&document.fullscreenElement)document.exitFullscreen();});
  var x0=null;stage.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;},{passive:true});
  stage.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(dx<-40)next();else if(dx>40)prev();x0=null;});
  document.getElementById("fs").onclick=function(){if(!document.fullscreenElement)document.getElementById("vp").requestFullscreen();else document.exitFullscreen();};
</script>
</body>
</html>
