<!DOCTYPE html>
<html lang="en" class="deck-protect">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  @font-face{font-family:'Micross';src:url('/assets/micross.ttf') format('truetype');font-weight:400 700;font-display:swap}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#000;--ink:#fff;--dim:rgba(255,255,255,.55);--dim2:rgba(255,255,255,.32);--dim3:rgba(255,255,255,.14);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--ease:cubic-bezier(.16,1,.3,1)}
  html,body{background:var(--bg);color:var(--ink);font-family:'Micross',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  html.deck-protect,html.deck-protect body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  img{-webkit-user-drag:none}
  @media print{html.deck-protect body{display:none!important}}
  .deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  .deck::-webkit-scrollbar{display:none}.deck{scrollbar-width:none}
  .slide{height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;padding:96px 7vw 84px;overflow:hidden}
  .chrome{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:24px 7vw;pointer-events:none;mix-blend-mode:difference}
  .chrome .brand{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
  .chrome .sec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .botbar{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:24px 7vw;pointer-events:none;mix-blend-mode:difference}
  .counter{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
  .scrollhint{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}
  .dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:9px}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);border:0;padding:0;cursor:pointer;transition:.3s}
  .dot.on{background:#fff;transform:scale(1.5)}
  .kick{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim2);margin-bottom:26px}
  .big{font-size:clamp(40px,7vw,92px);font-weight:700;letter-spacing:-.035em;line-height:.92}

  .lead{font-size:clamp(15px,1.5vw,19px);color:var(--ink);margin-top:24px;max-width:24ch;line-height:1.4}
  .body{font-size:13.5px;line-height:1.7;color:var(--dim);max-width:46ch;margin-top:18px}
  .bgimg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.18;filter:grayscale(.3)}
  .bgimg::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.85),rgba(0,0,0,.5))}
  .z{position:relative;z-index:2}
  .meta-foot{position:absolute;left:7vw;right:7vw;bottom:84px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
  /* cover */
  .cover .big{font-size:clamp(54px,11vw,150px)}
  .cover .tagline{margin-top:30px;font-size:clamp(14px,1.4vw,17px);color:var(--dim);max-width:34ch;line-height:1.5}
  /* about caps */
  .caps{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px}
  .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line2);border-radius:40px;padding:9px 16px}
  /* divider */
  .divider{align-items:center;text-align:center}
  .divider .big{font-size:clamp(54px,12vw,150px)}
  /* layout split */
  .split{display:grid;grid-template-columns:1.05fr .95fr;gap:6vw;align-items:center}
  .col-r{display:flex;flex-direction:column;gap:18px}
  .panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
  .panel-img{aspect-ratio:16/10;background:#0a0a0a;background-size:cover;background-position:center}
  .imgrow{display:grid;gap:10px}
  .imgrow.n2{grid-template-columns:1fr 1fr}.imgrow.n3{grid-template-columns:1fr 1fr 1fr}
  .imgrow .ph{aspect-ratio:4/3;background:#0a0a0a;background-size:cover;background-position:center;border:1px solid var(--line);border-radius:10px}
  /* project */
  .stat-row{display:flex;gap:26px;margin-top:30px}
  .stat .v{font-size:clamp(26px,3vw,40px);font-weight:700;letter-spacing:-.03em}
  .stat .l{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-top:4px}
  .specs{margin-top:26px;display:grid;grid-template-columns:1fr;gap:0}

  .spec .vv{flex:1;color:var(--ink)}
  .scopewrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
  .scope-i{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:30px;padding:7px 13px}
  /* before/after */
  .ba{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
  .ba-card{border:1px solid var(--line);border-radius:14px;padding:18px;background:rgba(255,255,255,.02)}
  .ba-card.aft{border-color:var(--line2)}
  .ba-lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-bottom:14px}
  .trk{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .trk .tn{flex:0 0 34px;font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .trk .bar{flex:1;height:14px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 2px,transparent 2px 4px)}
  .trk .bar.off{background:none;border-bottom:1px dashed var(--line2);height:1px}
  .trk .tt{flex:0 0 auto;font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .ba-note{font-size:11px;color:var(--dim);line-height:1.55;margin-top:14px}
  /* pipeline */
  .steps{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:30px}
  .step{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:30px;padding:8px 14px}
  .step .sn{color:var(--dim2);margin-right:7px}
  .arrowx{color:var(--dim3)}
  .gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px}
  .gcell{aspect-ratio:3/4;background:#0a0a0a;background-size:cover;background-position:center;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
  .gcap{position:absolute;left:0;right:0;bottom:0;padding:8px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);background:linear-gradient(transparent,rgba(0,0,0,.85))}
  /* packages */
  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
  .tier{border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.02)}
  .tier.rec{border-color:#fff}
  .tier-tag{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
  .tier-name{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .tier-desc{font-size:12px;color:var(--dim);line-height:1.5;flex:1}
  .tier-inc{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
  .tier-from{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.1em}
  .tier-price{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .tier-for{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
  /* crew */
  .people{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
  .person{border-top:1px solid var(--line2);padding-top:14px}
  .p-role{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
  .p-name{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 8px}
  .p-desc{font-size:11.5px;color:var(--dim);line-height:1.5;max-width:34ch}
  /* contact */
  .contact .big{font-size:clamp(54px,11vw,140px)}
  .c-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 50px;margin-top:44px;max-width:760px}
  .c-block .cl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-bottom:8px}
  .c-block .cv{font-size:15px;color:#fff}
  .c-block .cs{font-size:11px;color:var(--dim);margin-top:3px}
  @media (max-width:820px){
    .slide{padding:88px 26px 76px}
    .split,.ba,.tiers,.people,.c-grid{grid-template-columns:1fr;gap:22px}
    .gallery{grid-template-columns:repeat(3,1fr)}
    .dots{display:none}
    .stat-row{flex-wrap:wrap;gap:18px}
    .chrome,.botbar{padding:16px 22px}
  }
</style>
</head>

  },
  crew:function(s){
    var p=(s.people||[]).map(function(p){return '<div class="person"><div class="p-role">'+esc(p.role)+'</div><div class="p-name">'+esc(p.name)+'</div><div class="p-desc">'+esc(p.desc)+'</div></div>';}).join('');
    return '<div class="kick">'+esc(s.kicker)+'</div>'+title2(s.titleA,s.titleB)+'<p class="body">'+esc(s.body)+'</p><div class="people">'+p+'</div>';
  },
  contact:function(s){
    var f=(s.founders||[]).map(function(x){return '<div class="c-block"><div class="cl">'+esc(x.role)+'</div><div class="cv">'+esc(x.name)+'</div><div class="cs">'+esc(x.email)+'</div></div>';}).join('');
    return '<div class="contact"><div class="kick">'+esc(s.kicker)+'</div>'+title2(s.titleA,s.titleB)
      +'<div class="c-grid"><div class="c-block"><div class="cl">Email</div><div class="cv">'+esc(s.email)+'</div><div class="cs">For new project enquiries</div></div>'
      +'<div class="c-block"><div class="cl">Website</div><div class="cv">'+esc(s.site)+'</div></div>'+f+'</div></div>';
  }
};
function setup(){
  var deck=document.getElementById('deck'); var slides=[].slice.call(deck.querySelectorAll('.slide'));
  var counter=document.getElementById('counter'), sec=document.getElementById('secLabel'), dots=[].slice.call(document.querySelectorAll('.dot'));
  function pad(n){return String(n).padStart(2,'0');}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var i=+e.target.dataset.i;counter.textContent=pad(i+1)+' / '+pad(slides.length);sec.textContent=e.target.dataset.sec||'Sound · Capabilities';dots.forEach(function(d,j){d.classList.toggle('on',j===i);});}});},{threshold:.55});
  slides.forEach(function(s){io.observe(s);});
  dots.forEach(function(d){d.addEventListener('click',function(){slides[+d.dataset.d].scrollIntoView();});});
}
fetch('/api/site-order',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  var d=(j&&j.order&&j.order.soundDeck&&j.order.soundDeck.slides)?j.order.soundDeck:DEFAULT_DECK; R(d); setup();
}).catch(function(){ R(DEFAULT_DECK); setup(); });
</script>
